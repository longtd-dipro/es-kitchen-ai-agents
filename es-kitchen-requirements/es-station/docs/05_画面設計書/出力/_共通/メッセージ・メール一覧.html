*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.55 var(--f)}
.top{background:var(--navy);color:#fff;padding:0 20px;height:52px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:5}
.top b{font-size:15px}.top .sub{color:#B8C7D6;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.top .sp{flex:1}
.seg{display:flex;background:#0F2338;border-radius:8px;padding:3px}
.seg button{border:0;background:transparent;color:#C5D3E0;padding:4px 11px;border-radius:6px;font:600 12px var(--f);cursor:pointer}
.seg button.on{background:#fff;color:var(--navy)}
.wrap{max-width:1500px;margin:0 auto;padding:16px 20px 60px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.kpi .n{font-size:22px;font-weight:800}.kpi .l{color:var(--ink2);font-size:12px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:10px;flex-wrap:wrap}
.tabs button{border:0;background:none;padding:9px 14px;font:700 13px var(--f);color:var(--ink2);border-bottom:3px solid transparent;cursor:pointer}
.tabs button.on{color:var(--blue);border-bottom-color:var(--blue)}
.tabs .c{font-weight:600;color:var(--ink3);margin-left:4px}
.bar{display:flex;gap:8px;align-items:center;margin:0 0 10px;flex-wrap:wrap}
.bar input{flex:1;min-width:220px;border:1px solid #C9D1DA;border-radius:7px;padding:7px 10px;font:inherit}
.chip{border:1px solid #C9D1DA;background:#fff;border-radius:14px;padding:3px 11px;font-size:12px;color:var(--ink2);cursor:pointer}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.tw{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;background:#F2F5F8;color:var(--ink2);font-weight:700;padding:8px;border-bottom:1px solid var(--line);position:sticky;top:0;white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
td.id{font:700 12px var(--fm);color:var(--pink);white-space:nowrap}
.st{display:inline-block;border-radius:6px;padding:1px 7px;font-size:11.5px;font-weight:700;white-space:nowrap}
.st.ok{background:var(--ok-s);color:var(--ok)}.st.warn{background:var(--warn-s);color:var(--warn)}.st.red{background:var(--red-s);color:var(--red)}
.mut{color:var(--ink3);font-size:11.5px}
.ml{background:#F6F8FB;border-left:3px solid #C9D1DA;padding:3px 7px;margin-top:4px;font-size:12px;color:var(--ink2)}
.diff{background:var(--warn-s);color:#6B3A04;border-radius:6px;padding:3px 7px;margin-top:4px;font-size:12px}
.use a{display:block;color:var(--blue);text-decoration:none;font-size:12px}.use a:hover{text-decoration:underline}
.note{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:14px;color:var(--ink2);font-size:12.5px}
@media (max-width:760px){.wrap{padding:12px 16px 40px}.top .sub{display:none}}
</style>

<script>
(function(){
var K = window.KC, LANG='ja', TAB='msg', Q='', F='all';
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function vi(){ return LANG==='vi'; }
function stc(s){ s=String(s||''); return /一致/.test(s)||s==='登録済み'?'ok':(/未登録|ない/.test(s)?'red':(/違う|未確認/.test(s)?'warn':'')); }
function useHtml(u){
  if(!u.length) return '<span class="mut">'+(vi()?'Chưa dùng ở màn hình nào':'どの画面でもまだ使っていない')+'</span>';
  var link = function(x){
    var d = K.docs.filter(function(d){ return d.title[0]===x.doc; })[0];
    var href = d ? '../'+encodeURIComponent(d.out)+'/'+encodeURIComponent(d.base)+'.html#'+encodeURIComponent(x.view+'|'+x.no) : '#';
    return '<a href="'+href+'" target="_blank">'+esc(x.code+' '+x.view+' No.'+x.no+' '+x.ja)+'</a>'; };
  var head = u.slice(0,4).map(link).join(''), rest = u.slice(4);
  return '<div class="use">'+head+(rest.length?'<details><summary class="mut" style="cursor:pointer">'+(vi()?'và '+rest.length+' mục khác':'ほか '+rest.length+' 件')+'</summary>'+rest.map(link).join('')+'</details>':'')+'</div>';
}
var TABS = {
  msg:{ja:'メッセージ',vi:'Thông báo',n:function(){return K.messages.length;}},
  mail:{ja:'メール',vi:'Email',n:function(){return K.mails.length;}},
  mlonly:{ja:'ML のメール（設計書で未使用）',vi:'Email trong ML (chưa dùng)',n:function(){return K.mlOnly.length;}},
  add:{ja:'Message List への追加案',vi:'Đề xuất thêm vào Message List',n:function(){return K.adds.length;}}
};
function kpis(){
  var diff = K.messages.filter(function(m){ return /違う/.test(m.mlState); }).length;
  var it = [[K.messages.length, vi()?'Thông báo':'メッセージ'],[K.adds.length, vi()?'Chưa có trong ML':'Message List に未登録'],[diff, vi()?'Khác nội dung ML':'Message List と文言が違う'],
            [K.mails.length, vi()?'Email dùng trong thiết kế':'設計書で使うメール'],[K.mlOnly.length, vi()?'Email ML chưa dùng':'ML にあり設計書で未使用のメール']];
  document.getElementById('kpis').innerHTML = it.map(function(x){ return '<div class="kpi"><div class="n">'+x[0]+'</div><div class="l">'+esc(x[1])+'</div></div>'; }).join('');
}
function tabs(){
  document.getElementById('tabs').innerHTML = Object.keys(TABS).map(function(k){
    return '<button data-t="'+k+'" class="'+(TAB===k?'on':'')+'">'+esc(TABS[k][LANG])+'<span class="c">'+TABS[k].n()+'</span></button>'; }).join('');
}
function bar(){
  var chips = TAB==='msg'||TAB==='mail' ? [['all',vi()?'Tất cả':'すべて'],['red',vi()?'Chưa có trong ML':'未登録'],['warn',vi()?'Khác nội dung':'文言が違う'],['ok',vi()?'Khớp':'一致・登録済み']] : [];
  document.getElementById('bar').innerHTML = '<input id="q" placeholder="'+(vi()?'Tìm kiếm':'ID・文言・画面で探す')+'" value="'+esc(Q)+'">'+
    chips.map(function(c){ return '<button class="chip '+(F===c[0]?'on':'')+'" data-f="'+c[0]+'">'+esc(c[1])+'</button>'; }).join('');
  var q = document.getElementById('q'); q.oninput = function(){ Q=this.value; var p=this.selectionStart; table(); };
}
function match(o){ if(F!=='all' && stc(o.mlState)!==F) return false; if(!Q) return true; return JSON.stringify(o).toLowerCase().indexOf(Q.toLowerCase())>=0; }
function table(){
  var h='';
  if(TAB==='msg'){
    h='<table><tr><th>ID</th><th>'+(vi()?'Loại':'種類')+'</th><th>'+(vi()?'Nội dung':'文言')+'</th><th>Message List</th><th>'+(vi()?'Dùng ở':'使う画面・項目')+'</th></tr>'+
      K.messages.filter(match).map(function(m){
        return '<tr><td class="id">'+esc(m.id)+'</td><td>'+esc(m.type)+'<div class="mut">'+esc(m.where)+'</div></td><td>'+esc(vi()?m.vi:m.ja)+
          (m.diff?'<div class="diff">'+esc(m.diff)+'</div>':'')+'</td><td><span class="st '+stc(m.mlState)+'">'+esc(m.mlState)+'</span><div class="mut">'+esc(m.ml||'')+'</div>'+
          (m.mlText?'<div class="ml">'+esc(m.mlText)+'</div>':'')+'</td><td>'+useHtml(m.use)+'</td></tr>'; }).join('')+'</table>';
  } else if(TAB==='mail'){
    h='<table><tr><th>ID</th><th>'+(vi()?'Email':'メール')+'</th><th>'+(vi()?'Người nhận / khi gửi':'宛先・送るとき')+'</th><th>Message List</th><th>'+(vi()?'Dùng ở':'使う画面・項目')+'</th></tr>'+
      K.mails.filter(match).map(function(m){
        return '<tr><td class="id">'+esc(m.id)+'</td><td>'+esc(vi()?m.vi:m.ja)+'<div class="mut">'+esc(m.src||'')+'</div></td><td>'+esc(m.to||'')+'<div class="mut">'+esc(m.when||'')+'</div></td>'+
          '<td><span class="st '+stc(m.mlState)+'">'+esc(m.mlState)+'</span><div class="mut">'+esc(m.ml||'')+'</div>'+(m.mlSubject?'<div class="ml">'+esc(m.mlSubject)+'</div>':'')+'</td><td>'+useHtml(m.use)+'</td></tr>'; }).join('')+'</table>';
  } else if(TAB==='mlonly'){
    h='<table><tr><th>Message List</th><th>'+(vi()?'Trường hợp':'利用ケース')+'</th><th>'+(vi()?'Người nhận':'送信対象')+'</th><th>'+(vi()?'Tiêu đề':'件名')+'</th></tr>'+
      K.mlOnly.filter(match).map(function(m){ return '<tr><td class="id">MAIL-'+m.no+'</td><td>'+esc(m.use)+'</td><td>'+esc(m.to)+'</td><td>'+esc(m.subject)+'</td></tr>'; }).join('')+'</table>';
  } else {
    h='<table><tr><th>'+(vi()?'ID thiết kế':'設計書のID')+'</th><th>場面</th><th>画面</th><th>ボタン</th><th>メッセージタイトル</th><th>メッセージ（JP）</th><th>ポップアップのボタン</th><th>タイプ</th><th>表示形式</th></tr>'+
      K.adds.filter(match).map(function(a){ return '<tr><td class="id">'+esc(a.id)+'</td><td>'+esc(a.scene)+'</td><td>'+esc(a.screen)+'</td><td>'+esc(a.button)+'</td><td>'+esc(a.title)+'</td><td>'+esc(a.ja)+'</td><td>'+esc(a.popup)+'</td><td>'+esc(a.type)+'</td><td>'+esc(a.fmt)+'</td></tr>'; }).join('')+'</table>';
  }
  document.getElementById('tw').innerHTML = h;
}
function note(){
  document.getElementById('note').innerHTML = vi()
    ? 'Dữ liệu gốc: 05_基本設計/データ/_共通_メッセージ.py. Message List (chính thức): '+esc(K.mlFile||'—')+'. Tạo lại mỗi khi chạy make.py.'
    : '元データ：05_基本設計/データ/_共通_メッセージ.py（各画面のデータは ID だけ使う）。Message List（正）：'+esc(K.mlFile||'見つからなかった')+' を自動で読んで判定。make.py を実行するたびに作り直す。'+
      '「Message List への追加案」は Message List の「運営管理者／法人顧客向けWEB」シートと同じ列の順。'+(K.unused.length?'<br>どの画面でもまだ使っていない ID：'+esc(K.unused.join('、')):'');
  document.getElementById('sub').textContent = (vi()?'Thiết kế: ':'対象：')+K.docs.map(function(d){ return d.title[vi()?1:0]; }).join('、');
  document.getElementById('ttl').textContent = vi()?'Danh sách thông báo & email':'メッセージ・メール一覧';
}
function all(){ kpis(); tabs(); bar(); table(); note(); }
document.getElementById('tabs').onclick = function(e){ var b=e.target.closest('button'); if(!b) return; TAB=b.dataset.t; F='all'; all(); };
document.getElementById('bar').onclick = function(e){ var b=e.target.closest('.chip'); if(!b) return; F=b.dataset.f; bar(); table(); };
document.getElementById('lang').onclick = function(e){ var b=e.target.closest('button'); if(!b) return; LANG=b.dataset.l;
  document.querySelectorAll('#lang button').forEach(function(x){ x.classList.toggle('on', x===b); }); all(); };
all();
})();
</script>
</body>
</html>
