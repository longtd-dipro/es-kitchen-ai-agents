<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>画面設計書</title>
<style>
:root{
  --bg:#F3F5F8; --panel:#FFFFFF; --ink:#18212B; --ink2:#55616E; --ink3:#8A95A1; --line:#DFE4EA; --line2:#C9D1DA;
  --navy:#16324F; --blue:#1D4ED8; --blue-s:#EAF0FD; --pink:#D6246E; --pink-s:#FCEAF2; --amber:#B45309; --amber-s:#FEF3C7;
  --green:#047857; --green-s:#E3F5EE; --red:#B42318; --red-s:#FDECEA; --sel:#F59E0B;
  --f:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP","Meiryo",sans-serif;
  --fm:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:13px/1.55 var(--f);display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;cursor:pointer}
/* top bar */
.top{height:50px;flex:0 0 50px;background:var(--navy);color:#fff;display:flex;align-items:center;gap:14px;padding:0 16px}
.top .ttl{font-weight:800;font-size:14px;white-space:nowrap}
.top .sub{color:#B8C7D6;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sp{flex:1}
.seg{display:flex;background:#0F2338;border-radius:8px;padding:3px}
.seg button{border:0;background:transparent;color:#C5D3E0;padding:4px 11px;border-radius:6px;font-size:12px;font-weight:600}
.seg button.on{background:#fff;color:var(--navy)}
.tg{display:flex;align-items:center;gap:6px;font-size:12px;color:#DCE6EF;white-space:nowrap}
/* layout */
.main{flex:1;display:grid;grid-template-columns:232px minmax(0,1fr) 460px;min-height:0}
.nav{background:var(--panel);border-right:1px solid var(--line);overflow:auto;padding:12px 0}
.nav h4{margin:14px 16px 6px;font-size:11px;letter-spacing:.06em;color:var(--ink3);font-weight:700}
.nav .grp{margin:8px 10px 2px;padding:6px 8px 4px;font-size:11.5px;font-weight:700;color:var(--ink2)}
.nav .grp code{font:600 10.5px var(--fm);color:var(--blue);display:block}
.nav a{display:grid;grid-template-columns:1fr auto auto;column-gap:6px;align-items:center;margin:1px 10px;padding:6px 10px;border-radius:8px;color:var(--ink);text-decoration:none;cursor:pointer;font-size:12.5px;line-height:1.4}
.nav a .id{grid-column:1/-1;line-height:1.3}
.nav a.ls{display:flex}
.nav a:hover{background:#F1F4F8}
.nav a.on{background:var(--blue-s);color:var(--blue);font-weight:700}
.nav a .id{font:600 10px var(--fm);color:var(--ink3)}
.nav a.on .id{color:var(--blue)}
.nav a .n{margin-left:auto;font-size:10.5px;color:var(--ink3)}
.nav a .w{margin-left:4px;background:var(--amber-s);color:var(--amber);border-radius:9px;padding:0 6px;font-size:10.5px;font-weight:700}
/* center */
.ctr{display:flex;flex-direction:column;min-width:0;min-height:0}
.ch{padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.ch .t1{font:600 11px var(--fm);color:var(--blue)}
.ch .t2{font-size:15px;font-weight:800;margin-top:1px}
.ch .t3{font-size:12px;color:var(--ink2);margin-top:2px}
.ch .btns{margin-left:auto;display:flex;gap:6px;flex-shrink:0}
.btn{border:1px solid var(--line2);background:#fff;border-radius:7px;padding:5px 10px;font-size:12px;color:var(--ink)}
.btn:hover{background:#F5F7FA}
.stage{flex:1;position:relative;overflow:hidden;background:#E7EBF0}
.stage iframe{position:absolute;left:0;top:0;border:0;background:#fff;transform-origin:0 0}
.legend{position:absolute;right:12px;bottom:10px;background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:11px;color:var(--ink2);display:flex;gap:12px;z-index:3}
.legend i{display:inline-block;width:12px;height:12px;border-radius:6px;vertical-align:-2px;margin-right:4px}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink2);font-size:13px;background:#E7EBF0;z-index:2}
/* right */
.side{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.sh{padding:10px 14px 8px;border-bottom:1px solid var(--line)}
.sh .row{display:flex;gap:8px;align-items:center}
.sh h3{margin:0;font-size:14px}
.sh .cnt{color:var(--ink3);font-size:12px}
.sh input{width:100%;margin-top:8px;border:1px solid var(--line2);border-radius:7px;padding:6px 9px;font:inherit}
.chips{display:flex;gap:5px;margin-top:7px;flex-wrap:wrap}
.chips button{border:1px solid var(--line2);background:#fff;border-radius:14px;padding:2px 10px;font-size:11.5px;color:var(--ink2)}
.chips button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.list{flex:1;overflow:auto;padding:8px 10px 40px}
.note{margin:2px 4px 10px;padding:8px 10px;border-radius:8px;background:#F4F6F9;color:var(--ink2);font-size:12px}
.it{border:1px solid var(--line);border-radius:10px;margin:0 0 7px;background:#fff;transition:box-shadow .15s}
.it.l1{margin-left:16px}
.it.on{border-color:var(--sel);box-shadow:0 0 0 3px rgba(245,158,11,.22)}
.it .hd{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;cursor:pointer}
.bdg{flex:0 0 auto;min-width:24px;height:22px;padding:0 6px;border-radius:11px;color:#fff;font:700 11.5px/22px var(--f);text-align:center}
.bdg.area{background:var(--blue)} .bdg.leaf{background:var(--pink)}
.it .nm{font-weight:700;font-size:13px;line-height:1.4;padding-top:2px}
.it .meta{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}
.tag{font-size:10.5px;border-radius:5px;padding:0 6px;background:#EEF1F5;color:var(--ink2);line-height:18px}
.tag.req{background:var(--red-s);color:var(--red);font-weight:700}
.tag.cnd{background:var(--amber-s);color:var(--amber);font-weight:700}
.tag.chk{background:var(--amber-s);color:var(--amber)}
.tag.miss{background:#333;color:#fff}
.it .one{color:var(--ink2);font-size:12px;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.it.open .one{display:none}
.it .bd{display:none;border-top:1px solid var(--line);padding:8px 10px 10px}
.it.open .bd{display:block}
dl{margin:0;display:grid;grid-template-columns:104px 1fr;gap:5px 10px;font-size:12px}
dt{color:var(--ink3);font-weight:600}
dd{margin:0;white-space:pre-wrap;word-break:break-word}
dd .em{display:block;padding:3px 7px;margin:0 0 3px;border-radius:6px;background:var(--red-s);color:#7A1B12;cursor:pointer}
dd .em:hover{outline:1px solid #E7A39B}
dd.warn{background:var(--amber-s);color:#6B3A04;border-radius:6px;padding:4px 7px}
dd.demo{font-size:11.5px;color:var(--ink2)}
.sel{font:11px var(--fm);color:var(--ink3)}
/* tables in side */
table.t{width:100%;border-collapse:collapse;font-size:12px}
table.t th{text-align:left;background:#F2F5F8;color:var(--ink2);font-weight:700;padding:6px 7px;border-bottom:1px solid var(--line);position:sticky;top:0}
table.t td{padding:6px 7px;border-bottom:1px solid var(--line);vertical-align:top}
table.t tr.on td{background:#FFF7E6}
table.t tr.go{cursor:pointer} table.t tr.go:hover td{background:#F6F9FD}
.mid{font:700 11.5px var(--fm);color:var(--pink)}
.diff{color:#6B3A04;background:var(--amber-s);border-radius:5px;padding:2px 6px;display:inline-block;margin-top:3px}
.about p{margin:0 0 10px} .about b{color:var(--navy)}
@media (max-width:1180px){.main{grid-template-columns:200px minmax(0,1fr) 380px}}
@media (max-width:900px){body{overflow:auto}.main{grid-template-columns:1fr;grid-template-rows:auto 70vh auto}.nav{max-height:220px}.side{min-height:60vh}}
</style>
</head>
<body>
<div class="top">
  <div class="ttl" id="ttl">画面設計書</div>
  <div class="sub" id="sub"></div>
  <div class="sp"></div>
  <label class="tg"><input type="checkbox" id="boxTg" checked> <span data-t="box">枠を表示</span></label>
  <div class="seg" id="lang"><button data-l="ja" class="on">日本語</button><button data-l="vi">Tiếng Việt</button></div>
</div>
<div class="main">
  <nav class="nav" id="nav"></nav>
  <section class="ctr">
    <div class="ch">
      <div style="min-width:0">
        <div class="t1" id="vCode"></div>
        <div class="t2" id="vName"></div>
        <div class="t3" id="vState"></div>
      </div>
      <div class="btns">
        <button class="btn" id="reset" data-t="reset">最初の状態に戻す</button>
        <button class="btn" id="zoom" data-t="zoomFit">画面に合わせる</button>
      </div>
    </div>
    <div class="stage" id="stage">
      <div class="loading" id="loading" data-t="loading">デモを読み込んでいます…</div>
      <iframe id="fr" title="demo"></iframe>
      <div class="legend"><span><i style="background:#1D4ED8"></i><span data-t="lgArea">エリア（大項目）</span></span><span><i style="background:#D6246E"></i><span data-t="lgLeaf">項目</span></span><span><i style="background:#F59E0B"></i><span data-t="lgSel">選択中</span></span></div>
    </div>
  </section>
  <aside class="side">
    <div class="sh" id="sh"></div>
    <div class="list" id="list"></div>
  </aside>
</div>

v><\/div><div class=\"f newf\" data-name=\"請求書表示名\"><label>請求書表示名<span class=\"req\">*<\/span> <span class=\"tag pn\">P2新<\/span> <span class=\"tag only\">法人に出さない<\/span><\/label><div class=\"ctl\"><input readonly=\"\" value=\"配送回数追加\"><\/div><div class=\"note-s\">請求書の費目名としてそのまま出る。【スポット費用の対象月をカッコ書きする運用は廃止し、費目行の対象期間列で持つ】<\/div><div class=\"meta\"><code>option.name_invoice<\/code>　varchar(80)<\/div><\/div><div class=\"f newf\" data-name=\"オプション区分\"><label>オプション区分<span class=\"req\">*<\/span> <span class=\"tag pn\">P2新<\/span> <span class=\"tag only\">法人に出さない<\/span><\/label><div class=\"ctl\"><select disabled=\"\"><option value=\"配送\" selected=\"\">配送<\/option><option value=\"アプリ機能\">アプリ機能<\/option><option value=\"設置・作業\">設置・作業<\/option><option value=\"事務\">事務<\/option><option value=\"ペナルティ\">ペナルティ<\/option><\/select><\/div><div class=\"note-s\">オプション区分マスタ（使用中）から選ぶ。運営（システム管理）が足せる（台帳 F「オプション区分の持ち方」・受付簿 #117）。選択肢・請求書の並びは 区分の並び順 → オプションID<\/div><div class=\"meta\"><code>option.category<\/code>　varchar(20)<\/div><\/div><div class=\"f newf\" data-name=\"公開ステータス\"><label>公開ステータス<span class=\"req\">*<\/span> <span class=\"tag pn\">P2新<\/span> <span class=\"tag only\">法人に出さない<\/span><\/label><div class=\"ctl\"><select disabled=\"\"><option value=\"公開\">公開<\/option><option value=\"非公開\" selected=\"\">非公開<\/option><\/select><\/div><div class=\"note-s\">公開／非公開。【2026-10-01 統一（回答 P1）】旧「公開区分」（法人Webの申込に出す／運営だけが選べる）と同じ意味のため「公開ステータス」にまとめた。「公開」＝法人Webの申込・変更でお客様が自分で選べる。「非公開」＝運営だけが選べる（法人には出ない）。機種マスタ・プランマスタ・値引きマスタの「公開ステータス」と同じ言葉<\/div><div class=\"meta\"><code>option.public_status<\/code>　varchar(12)　（旧 option.visibility）<\/div><\/div><div class=\"f newf\" data-name=\"利用状態\"><label>利用状態<span class=\"req\">*<\/span> <span class=\"tag pn\">P2新<\/span> <span class=\"tag only\">法人に出さない<\/span><\/label><div class=\"ctl\"><select disabled=\"\"><option value=\"使用中\" selected=\"\">使用中<\/option><option value=\"終了\">終了<\/option><\/select><\/div><div class=\"note-s\">使用中／終了。終了にしても、すでに適用中の拠点はそのまま請求が続く ke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"9\" cy=\"8\" r=\"3.5\"><\/circle><path d=\"M2.5 20a6.5 6.5 0 0 1 13 0\"><\/path><path d=\"M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6 6 0 0 1 3.5 6\"><\/path><\/svg><span class=\"lbl\">アカウント管理<\/span><svg class=\"chev\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m6 9 6 6 6-6\"><\/path><\/svg><\/button><\/div><div style=\"display: contents;\"><button class=\"nav-g\" aria-expanded=\"false\"><svg class=\"ic\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"3\"><\/circle><path d=\"M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z\"><\/path><\/svg><span class=\"lbl\">設定管理<\/span><svg class=\"chev\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m6 9 6 6 6-6\"><\/path><\/svg><\/button><\/div><\/nav><div class=\"mascot\"><img alt=\"\" src=\"http://localhost:3000/ops/mascot.png\"><\/div><div class=\"side-foot\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 6h18M3 12h18M3 18h18\"><\/path><\/svg><\/div><\/aside><div class=\"scrim\"><\/div><div class=\"main\"><header class=\"top\"><button class=\"icon-btn burger\" aria-label=\"メニューを開く\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 6h18M3 12h18M3 18h18\"><\/path><\/svg><\/button><div class=\"hello\"><img alt=\"\" src=\"http://localhost:3000/ops/hello.png\"><span>お帰りなさい<\/span><\/div><div class=\"user\"><img alt=\"\" src=\"http://localhost:3000/ops/avatar.png\"><span>中村幸子<\/span><button class=\"btn\">ログアウト<\/button><\/div><\/header><main class=\"content\"><div class=\"ops-masters\"><div class=\"wrap\"><details class=\"info\"><summary>デモの説明・凡例<\/summary><div><div class=\"kpi\"><div><b>56<\/b><span>全項目<\/span><\/div><div><b>56<\/b><span>フェーズ2 新規<\/span><\/div>\n<div><b>0<\/b><span>法人Webに出る項目<\/span><\/div><div><b>2<\/b><span>画面<\/span><\/div><\/div>\n<div class=\"banner\">オプションマスタ・値引きマスタの画面デモです（<b>運営Webだけの画面<\/b>）。マスタは「料金表・計算ルール」を持つだけで、拠点へのつける・やめるは子契約の「オプション・割引の異動」（12_運営_法人拠点契約.html）で登録します。<b>2026-09-25 決定：2つのマスタは統合せず分けたまま<\/b>。考え方は 96_説明_オプション値引きかんたん.html を参照。<b>この2画面の項目はすべてフェーズ2の新規・運営だけなので、「P2新」「法人に出さない」の札は省略しています<\/b>（2026-09-28）。<\/div>\n<div class=\"legend\">\n<span><span class=\"tag p1\">P1<\/span> 現行画面にある<\/span><span><span class=\"tag pv\">P1→P2変<\/span> 持ち方が変わる<\/span>\n<span><span class=\"tag pn\">P2新<\/span> フェーズ2で新設<\/span><span><span class=\"tag ap\">承認必須<\/span><\/span>\n<span><span class=\"tag nt\">通知<\/span><\/span><span><span class=\"tag only\">法人に出さない<\/span><\/span><span><span class=\"tag ro\">法人は参照のみ<\/span>（運営は編集できます）<\/span>\n<span><span class=\"req\">*<\/span> 必須<\/span><span><span class=\"cond\">△<\/span> 条件付き<\/span><span>いまの設定では非活性<\/span>\n<\/div><\/div><\/details><section class=\"screen s-op\"><div class=\"phead\"><div class=\"phl\"><div class=\"crumb\">マスタ管理 / <a class=\"lnk\">オプションマスタ一覧<\/a> / オプション詳細<\/div><h2>オプション詳細<span class=\"pid\">OP000004<\/span><\/h2><div class=\"sumbar\"><span class=\"s\"><i>オプションID<\/i><b>OP000004<\/b><\/span><span class=\"s\"><i>オプション名<\/i><b>地域配送料<\/b><\/span><span class=\"s\"><i>連動タイプ<\/i><b>連動しない<\/b><\/span><span class=\"s\"><i>料金種別<\/i><b>月額料金（継続）<\/b><\/span><span class=\"s\"><i>標準金額<\/i><b>4,000円<\/b><\/span><span class=\"s\"><i>適用中<\/i><b>1拠点<\/b><\/span><\/div><\/div><div class=\"pbtn\"><button type=\"button\" class=\"del\">削除<\/button><button type=\"button\" class=\"save\">編集<\/button><\/div><\/div><div class=\"stick\"><div class=\"tabrow\"><div class=\"tabs\" role=\"tablist\"><button type=\"button\" role=\"tab\" aria-selected=\"true\" class=\"on\">基本情報<\/button><button type=\"button\" role=\"tab\" aria-selected=\"false\">料金<\/button><button type=\"button\" role=\"tab\" aria-selected=\"false\">連動の確認・履歴<\/button><\/div><\/div><div class=\"tools\"><div class=\"srch\"><span class=\"ic\">🔍<\/span><input placeholder=\"項目を検索（/）\" aria-label=\"項目を検索\" type=\"search\" value=\"\"><button type=\"button\" class=\"clr\" aria-label=\"検索をクリア\">×<\/button><\/div><span class=\"hits\"><\/span><button type=\"button\" class=\"linkbtn\">すべて閉じる<\/button><label><input type=\"checkbox\"> 項目定義（物理名・型・説明）<\/label><label><input type=\"checkbox\"> 入力する項目だけ<\/label><label><input type=\"checkbox\"> フェーズ2の新規のみ<\/label><\/div><div class=\"idx\"><button type=\"button\">基本情報<b>7<\/b><\/button><button type=\"button\">契約項目との連動<b>1<\/b><\/button><\/div><\/div><div class=\"pane\" id=\"op-0\"><div class=\"card\" id=\"sec-0\"><button type=\"button\" class=\"ch\">基本情報<span class=\"chev\">︿<\/span><\/button><div class=\"cb\"><div class=\"cols\"><div class=\"f newf\" data-name=\"オプションID\"><label>オプションID<span class=\"req\">*<\/span> <span class=\"tag pn\">P2新<\/span> <span class=\"tag only\">法人に出さない<\/span><\/label><div class=\"ctl\"><input readonly=\"\" value=\"OP000004\"><\/div><div class=\"note-s\">OP ＋6桁（例：OP000001）。機種ID・プランIDと同じ「2文字＋6桁」の体系。採番後は変更しない<\/div><div class=\"meta\"><code>option.no<\/code>　varchar(20)<\/div><\/div><div class=\"f newf\" data-name=\"管理名（社内用）\"><label>管理名（社内用）<span class=\"req\">*<\/span> <span class=\"tag pn\">P2新<\/span> <span class=\"tag only\">法人に出さない<\/span><\/label><div class=\"ctl\"><input readonly=\"\" value=\"地域配送料\"><\/div><div class=\"note-s\">社内で使う名前。一覧・検索はこの名前<\/div><div class=\"meta\"><code>option.name_admin<\/code>　varchar(80)<\/div><\/div><div class=\"f newf\" data-name=\"請求書表示名\"><label>請求書表示名<span class=\"req\">*<\/span> <span class=\"tag pn\">P2新<\/span> <span class=\"tag only\">法人に出さない<\/span><\/label><div class=\"ctl\"><input readonly=\"\" value=\"地域配送料\"><\/div><div class=\"note-s\">請求書の費目名としてそのまま出る。【スポット費用の対象月をカッコ書きする運用は廃止し、費目行の対象期間列で持つ】<\/div><div class=\"meta\"><code>option.name_invoice<\/code>　varchar(80)<\/div><\/div><div class=\"f newf\" data-name=\"オプション区分\"><label>オプション区分<span class=\"req\">*<\/span> <span class=\"tag pn\">P2新<\/span> <span class=\"tag only\">法人に出さない<\/span><\/label><div class=\"ctl\"><select disabled=\"\"><option value=\"配送\" selected=\"\">配送<\/option><option value=\"アプリ機能\">アプリ機能<\/option><option value=\"設置・作業\">設置・作業<\/option><option value=\"事務\">事務<\/option><option value=\"ペナルティ\">ペナルティ<\/option><\/select><\/div><div class=\"note-s\">オプション区分マスタ（使用中）から選ぶ。運営（システム管理）が足せる（台帳 F「オプション区分の持ち方」・受付簿 #117）。選択肢・請求書の並びは 区分の並び順 → オプションID<\/div><div class=\"meta\"><code>option.category<\/code>　varchar(20)<\/div><\/div><div class=\"f newf\" data-name=\"公開ステータス\"><label>公開ステータス<span class=\"req\">*<\/span> <span class=\"tag pn\">P2新<\/span> <span class=\"tag only\">法人に出さない<\/span><\/label><div class=\"ctl\"><select disabled=\"\"><option value=\"公開\">公開<\/option><option value=\"非公開\" selected=\"\">非公開<\/option><\/select><\/div><div class=\"note-s\">公開／非公開。【2026-10-01 統一（回答 P1）】旧「公開区分」（法人Webの申込に出す／運営だけが選べる）と同じ意味のため「公開ステータス」にまとめた。「公開」＝法人Webの申込・変更でお客様が自分で選べる。「非公開」＝運営だけが選べる（法人には出ない）。機種マスタ・プランマスタ・値引きマスタの「公開ステータス」と同じ言葉<\/div><div class=\"meta\"><code>option.public_status<\/code>　varchar(12)　（旧 option.visibility）<\/div><\/div><div class=\"f newf\" data-name=\"利用状態\"><label>利用状態<span class=\"req\">*<\/span> <span class=\"tag pn\">P2新<\/span> <span class=\"tag only\">法人に出さない<\/span><\/label><div class=\"ctl\"><select disabled=\"\"><option value=\"使用中\" selected=\"\">使用中<\/option><option value=\"終了\">終了<\/option><\/select><\/div><div class=\"note-s\">使用中／終了。終了にしても、すでに適用中の拠点はそのまま請求が続く（新規に選べなくなるだけ）<\/div><div class=\"meta\"><code>option.status<\/code>　varchar(12)<\/div><\/div><div class=\"f newf span3\" data-name=\"説明\"><label>説明<span class=\"cond\">△<\/span> <span class=\"tag pn\">P2新<\/span> <span class=\"tag only\">法人に出さない<\/span><\/label><div class=\"ctl\"><textarea rows=\"2\" readonly=\"\">配送エリアによる。金額は拠点ごと（子契約で上書き）。既定 4,000円（STEP3回答 Q5'）<\/textarea><\/div><div class=\"note-s\">運営が選ぶときに迷わないための説明。法人Webには出さない<\/div><div class=\"meta\"><code>option.description<\/code>　text<\/div><\/div><\/div><\/div><\/div><div class=\"card\" id=\"sec-1\"><button type=\"button\" class=\"ch\">契約項目との連動<span class=\"chev\">︿<\/span><\/button><div class=\"cb\"><div class=\"cols\"><div class=\"f newf\" data-name=\"連動タイプ\"><label>連動タイプ<span class=\"req\">*<\/span> <span class=\"tag pn\">P2新<\/span> <span class=\"tag only\">法人に出さない<\/span><\/label><div class=\"ctl\"><select disabled=\"\"><option value=\"A 契約項目に連動（システム定義）\">A 契約項目に連動（システム定義）<\/option><option value=\"連動しない\" selected=\"\">連動しない<\/option><\/select><\/div><div class=\"note-s\">【A】契約項目に連動（システム定義）／連動しない。【2026-09-28 決定：A型は運営が自由に作るものではなく、連動する契約項目（配送回数・ES-QR・ゲストモードなど）ごとにシステムで先に定義しておく。運営が直せるのは表示名・金額・ステータスなどだけで、A型の新規登録と削除はできない。新規登録で選べるのは「連動しない」だけ】【連動しないオプションの「継続／1回きり」（以前の B／C）は料金種別で決まる：月額料金＝継続（つけたらずっと）、初期料金・単発料金＝1回きり】。この区分で子契約の異動に出すか・自動で計上するかが決まる<\/div><div class=\"meta\"><code>option.link_type<\/code>　varchar(4)<\/div><\/div><div class=\"f newf hide\" data-name=\"連動する契約項目\"><label>連動する契約項目<span class=\"cond\">△<\/span> <span class=\"tag pn\">P2新<\/span> <span class=\"tag only\">法人に出さない<\/span><\/label><div class=\"ctl\"><input readonly=\"\" value=\"—（連動しない）\"><\/div><div class=\"note-s\">【連動タイプ＝A のときだけ表示・システム定義で変更不可（2026-09-28）】配送回数／ES-QR／ゲストモード／ユーザー現金利用 など。A型のオプション1つに契約項目1つ<\/div><div class=\"meta\"><code>option.link_field<\/code>　varchar(40)<\/div><\/div><div class=\"f newf hide\" data-name=\"連動条件\"><label>連動条件<span class=\"cond\">△<\/span> <span class=\"tag pn\">P2新<\/span> <span class=\"tag only\">法人に出さない<\/span><\/label><div class=\"ctl\"><input readonly=\"\" value=\"—（連動しない）\"><\/div><div class=\"note-s\">【連動タイプ＝A のときだけ表示・システム定義で変更不可（2026-09-28）】その項目がどの値のとき効くか。例：ES-QR＝利用する／ゲストモード＝利用する／配送回数がプラン標準を超えた分<\/div><div class=\"meta\"><code>option.link_condition<\/code>　varchar(120)<\/div><\/div><div class=\"f newf hide\" data-name=\"数量の取り方\"><label>数量の取り方<span class=\"cond\">△<\/span> <span class=\"tag pn\">P2新<\/span> <span class=\"tag only\">法人に出さない<\/span><\/label><div class=\"ctl\"><input readonly=\"\" value=\"プラン標準を超えた分だけ\"><\/div><div class=\"note-s\">【連動タイプ＝A のときだけ表示・システム定義】固定1／契約項目の値そのまま／プラン標準を超えた分だけ。例：配送回数12回・プラン標準8回 →「超えた分」なら数量4。連動しないオプションの数量は、子契約でつけるときに入れる（2026-09-29）<\/div><div class=\"meta\"><code>option.qty_rule<\/code>　varchar(20)<\/div><\/div><\/div><\/div><\/div><\/div><\/section><\/div><\/div><\/main><\/div><\/div><\/div><div id=\"es-review\" style=\"position: fixed; right: 16px; bottom: 16px; z-index: 2147483000;\"><\/div><next-route-announcer style=\"position: absolute;\"><\/next-route-announcer><\/body><\/html>", "008": "<!DOCTYPE html><html lang=\"ja\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width, initial-scale=1\"><!--KDCSS:3--><!--KDCSS:0--><!--KDCSS:1--><title>運営Web｜ESSTATION<\/title><meta name=\"description\" content=\"ESSTATION の運営・法人・委託配送先・ドライバー・仕入先の Web\"><link rel=\"preconnect\" href=\"https://fonts.googleapis.com\"><!--KDCSS:2--><style>nextjs-portal{display:none!important}*{transition:none!important;animation:none!important}<\/style><\/head><body><div hidden=\"\"><!--$--><!--/$--><\/div><div class=\"ops\"><div class=\"es-demo ><main class=\"content\"><div class=\"ops-masters\"><div class=\"wrap\"><details class=\"info\"><summary>デモの説明・凡例<\/summary><div><div class=\"kpi\"><div><b>56<\/b><span>全項目<\/span><\/div><div><b>56<\/b><span>フェーズ2 新規<\/span><\/div>\n<div><b>0<\/b><span>法人Webに出る項目<\/span><\/div><div><b>2<\/b><span>画面<\/span><\/div><\/div>\n<div class=\"banner\">オプションマスタ・値引きマスタの画面デモです（<b>運営Webだけの画面<\/b>）。マスタは「料金表・計算ルール」を持つだけで、拠点へのつける・やめるは子契約の「オプション・割引の異動」（12_運営_法人拠点契約.html）で登録します。<b>2026-09-25 決定：2つのマスタは統合せず分けたまま<\/b>。考え方は 96_説明_オプション値引きかんたん.html を参照。<b>この2画面の項目はすべてフェーズ2の新規・運営だけなので、「P2新」「法人に出さない」の札は省略しています<\/b>（2026-09-28）。<\/div>\n<div class=\"legend\">\n<span><span class=\"tag p1\">P1<\/span> 現行画面にある<\/span><span><span class=\"tag pv\">P1→P2変<\/span> 持ち方が変わる<\/span>\n<span><span class=\"tag pn\">P2新<\/span> フェーズ2で新設<\/span><span><span class=\"tag ap\">承認必須<\/span><\/span>\n<span><span class=\"tag nt\">通知<\/span><\/span><span><span class=\"tag only\">法人に出さない<\/span><\/span><span><span class=\"tag ro\">法人は参照のみ<\/span>（運営は編集できます）<\/span>\n<span><span class=\"req\">*<\/span> 必須<\/span><span><span class=\"cond\">△<\/span> 条件付き<\/span><span>いまの設定では非活性<\/span>\n<\/div><\/div><\/details><section class=\"screen s-op\"><div class=\"phead\"><div class=\"phl\"><div class=\"crumb\">マスタ管理 / <a class=\"lnk\">オプションマスタ一覧<\/a> / オプション新規登録<\/div><h2>オプション新規登録<span class=\"pid\"><\/span><\/h2><\/div><div class=\"pbtn\"><button type=\"button\" class=\"cancel\">キャンセル<\/button><button type=\"button\" class=\"save\">登録<\/button><\/div><\/div><div class=\"vbox\" role=\"alert\"><b>保存できません（3件）。<\/b>赤い項目を確認してください。<\/div><div class=\"stick\"><div class=\"tabrow\"><div class=\"tabs\" role=\"tablist\"><button type=\"button\" role=\"tab\" aria-selected=\"true\" class=\"on err\">基本情報<\/button><button type=\"button\" role=\"tab\" aria-selected=\"false\" class=\"err\">料金<\/button><button type=\"button\" role=\"tab\" aria-selected=\"false\">連動の確認・履歴<\/button><\/div><\/div><div class=\"tools\"><div class=\"srch\"><span class=\"ic\">🔍<\/span><input placeholder=\"項目を検索（/）\" aria-label=\"項目を検索\" type=\"search\" value=\"\"><button type=\"button\" class=\"clr\" aria-label=\"検索をクリア\">×<\/button><\/div><span class=\"hits\"><\/span><button type=\"button\" class=\"linkbtn\">すべて閉じる<\/button><label><input type=\"checkbox\"> 項目定義（物理名・型・説明）<\/label><label><input type=\"checkbox\"> 入力する項目だけ<\/label><label><input type=\"checkbox\"> フェーズ2の新規のみ<\/label><\/div><div class=\"idx\"><button type=\"button\">基本情報<b>7<\/b><\/button><button type=\"button\">契約項目との連動<b>1<\/b><\/button><\/div><\/div><div class=\"pane\" id=\"op-0\"><div class=\"card\" id=\"sec-0\"><button type=\"button\" class=\"ch\">基本情報<span class=\"chev\">︿<\/span><\/button><div class=\"cb\"><div class=\"cols\"><div class=\"f newf\" data-name=\"オプションID\"><label>オプションID<span class=\"req\">*<\/span> <span class=\"tag pn\">P2新<\/span> <span class=\"tag only\">法人に出さない<\/span><\/label><div class=\"ctl\"><input readonly=\"\" value=\"（登録時に採番）\"><\/div><div class=\"note-s\">OP ＋6桁（例：OP000001）。機種ID・プランIDと同じ「2文字＋6桁」の体系。採番後は変更しない<\/div><div class=\"meta\"><code>option.no<\/code>　varchar(20)<\/div><\/div><div class=\"f newf verr\" data-name=\"管理名（社内用）\"><label>管理名（社内用）<span class=\"req\">*<\/span> <span class=\"tag pn\">P2新<\/span> <span class=\"tag only\">法人に出さない<\/span><\/label><div class=\"ctl\"><input value=\"\"><\/div><div class=\"ferr\" role=\"alert\"><div>管理名（社内用）は必須項目です。<\/div><\/div><div class=\"note-s\">社内で使う名前。一覧・検索はこの名前<\/div><div class=\"meta\"><code>option.name_admin<\/code>　varchar(80)<\/div><\/div><div class=\"f newf verr\" data-name=\"請求書表示名\"><label>請求書表示名<span class=\"req\">*<\/span> <span class=\"tag pn\">P2新<\/span> <span class=\"tag only\">法人に出さない<\/span><\/label><div class=\"ctl\"><input value=\"\"><\/div><div class=\"ferr\" role=\"alert\"><div>請求書表示名は必須項目です。<\/div><\/div><div class=\"note-s\">請求書の費目名としてそのまま出る。【スポット費用の対象月をカッコ書きする運用は廃止し、費目行の対象期間列で持つ】<\/div><div class=\"meta\"><code>option.name_invoice<\/code>　varchar(80)<\/div><\/div><div class=\"f newf\" data-name=\"オプション区分\"><label>オプション区分<span class=\"req\">*<\/span> <span class=\"tag pn\">P2新<\/span> <span class=\"tag only\">法人に出さない<\/span><\/label><div class=\"ctl\"><select><option value=\"配送\" selected=\"\">配送<\/option><option value=\"アプリ機能\">アプリ機能<\/option><option value=\"設置・作業\">設置・作業<\/option><option value=\"事務\">事務<\/option><option value=\"ペナルティ\">ペナルティ<\/option><\/select><\/div><div class=\"note-s\">オプション区分マスタ（使用中）から選ぶ。運営（システム管理）が足せる（台帳 F「オプション区分の持ち方」・受付簿 #117）。選択肢・請求書の並びは 区分の並び順 → オプションID<\/div><div class=\"meta\"><code>option.category<\/code>　varchar(20)<\/div><\/div><div class=\"f newf\" data-name=\"公開ステータス\"><label>公開ステータス<span class=\"req\">*<\/span> <span class=\"tag pn\">P2新<\/span> <span class=\"tag only\">法人に出さない<\/span><\/label><div class=\"ctl\"><select><option value=\"公開\" selected=\"\">公開<\/option><option value=\"非公開\">非公開<\/option><\/select><\/div><div class=\"note-s\">公開／非公開。【2026-10-01 統一（回答 P1）】旧「公開区分」（法人Webの申込に出す／運営だけが選べる）と同じ意味のため「公開ステータス」にまとめた。「公開」＝法人Webの申込・変更でお客様が自分で選べる。「非公開」＝運営だけが選べる（法人には出ない）。機種マスタ・プランマスタ・値引きマスタの「公開ステータス」と同じ言葉<\/div><div class=\"meta\"><code>option.public_status<\/code>　varchar(12)　（旧 option.visibility）<\/div><\/div><div class=\"f newf\" data-name=\"利用状態\"><label>利用状態<span class=\"req\">*<\/span> <span class=\"tag pn\">P2新<\/span> <span class=\"tag only\">法人に出さない<\/span><\/label><div class=\"ctl\"><select><option value=\"使用中\" selected=\"\">使用中<\/option><option value=\"終了\">終了<\/option><\/select><\/div><div class=\"note-s\">使用中／終了。終了にしても、すでに適用中の拠点はそのまま請求が続く（新規に選べなくなるだけ）<\/div><div class=\"meta\"><code>option.status<\/code>　varchar(12)<\/div><\/div><div class=\"f newf span3\" data-name=\"説明\"><label>説明<span class=\"cond\">△<\/span> <span class=\"tag pn\">P2新<\/span> <span class=\"tag only\">法人に出さない<\/span><\/label><div class=\"ctl\"><textarea rows=\"2\"><\/textarea><\/div><div class=\"note-s\">運営が選ぶときに迷わないための説明。法人Webには出さない<\/div><div class=\"meta\"><code>option.description<\/code>　text<\/div><\/div><\/div><\/div><\/div><div class=\"card\" id=\"sec-1\"><button type=\"button\" class=\"ch\">契約項目との連動<span class=\"chev\">︿<\/span><\/button><div class=\"cb\"><div class=\"cols\"><div class=\"f newf\" data-name=\"連動タイプ\"><label>連動タイプ<span class=\"req\">*<\/span> <span class=\"tag pn\">P2新<\/span> <span class=\"tag only\">法人に出さない<\/span><\/label><div class=\"ctl\"><select><option value=\"A 契約項目に連動（システム定義）\" disabled=\"\">A 契約項目に連動（システム定義）<\/option><option value=\"連動しない\" selected=\"\">連動しない<\/option><\/select><\/div><div class=\"note-s\">【A】契約項目に連動（システム定義）／連動しない。【2026-09-28 決定：A型は運営が自由に作るものではなく、連動する契約項目（配送回数・ES-QR・ゲストモードなど）ごとにシステムで先に定義しておく。運営が直せるのは表示名・金額・ステータスなどだけで、A型の新規登録と削除はできない。新規登録で選べるのは「連動しない」だけ】【連動しないオプションの「継続／1回きり」（以前の B／C）は料金種別で決まる：月額料金＝継続（つけたらずっと）、初期料金・単発料金＝1回きり】。この区分で子契約の異動に出すか・自動で計上するかが決まる<\/div><div class=\"meta\"><code>option.link_type<\/code>　varchar(4)<\/div><\/div><div class=\"f newf hide\" data-name=\"連動する契約項目\"><label>連動する契約項目<span class=\"cond\">△<\/span> <span class=\"tag pn\">P2新<\/span> <span class=\"tag only\">法人に出さない<\/span><\/label><div class=\"ctl\"><input readonly=\"\" value=\"—（連動しない）\"><\/div><div class=\"note-s\">【連動タイプ＝A のときだけ表示・システム定義で変更不可（2026-09-28）】配送回数／ES-QR／ゲストモード／ユーザー現金利用 など。A型のオプション1つに契約項目1つ<\/div><div class=\"meta\"><code>option.link_field<\/code>　varchar(40)<\/div><\/div><div class=\"f newf hide\" data-name=\"連動条件\"><label>連動条件<span class=\"cond\">△<\/span> <span class=\"tag pn\">P2新<\/span> <span class=\"tag only\">法人に出さない<\/span><\/label><div class=\"ctl\"><input readonly=\"\" value=\"—（連動しない）\"><\/div><div class=\"note-s\">【連動タイプ＝A のときだけ表示・システム定義で変更不可（2026-09-28）】その項目がどの値のとき効くか。例：ES-QR＝利用する／ゲストモード＝利用する／配送回数がプラン標準を超えた分<\/div><div class=\"meta\"><code>option.link_condition<\/code>　varchar(120)<\/div><\/div><div class=\"f newf hide\" data-name=\"数量の取り方\"><label>数量の取り方<span class=\"cond\">△<\/span> <span class=\"tag pn\">P2新<\/span> <span class=\"tag only\">法人に出さない<\/span><\/label><div class=\"ctl\"><input readonly=\"\" value=\"プラン標準を超えた分だけ\"><\/div><div class=\"note-s\">【連動タイプ＝A のときだけ表示・システム定義】固定1／契約項目の値そのまま／プラン標準を超えた分だけ。例：配送回数12回・プラン標準8回 →「超えた分」なら数量4。連動しないオプションの数量は、子契約でつけるときに入れる（2026-09-29）<\/div><div class=\"meta\"><code>option.qty_rule<\/code>　varchar(20)<\/div><\/div><\/div><\/div><\/div><\/div><\/section><\/div><\/div><\/main><\/div><\/div><\/div><div id=\"es-review\" style=\"position: fixed; right: 16px; bottom: 16px; z-index: 2147483000;\"><\/div><next-route-announcer style=\"position: absolute;\"><\/next-route-announcer><\/body><\/html>", "013": "<!DOCTYPE html><html lang=\"ja\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width, initial-scale=1\"><!--KDCSS:3--><!--KDCSS:0--><!--KDCSS:1--><title>運営Web｜ESSTATION<\/title><meta name=\"description\" content=\"ESSTATION の運営・法人・委託配送先・ドライバー・仕入先の Web\"><link rel=\"preconnect\" href=\"https://fonts.googleapis.com\"><!--KDCSS:2--><style>nextjs-portal{display:none!important}*{transition:none!important;animation:none!important}<\/style><\/head><body><div hidden=\"\"><!--$--><!--/$--><\/div><div class=\"ops\"><div class=\"es-demo-bar\"><span class=\"es-demo-tag\">DEMO<\/span><span>運営Web。データは架空です。今日：<b>2026-10-05<\/b><\/span><label title=\"デモの「今日」を変えます（全サイト共通）\">日付を変える<input type=\"date\" value=\"2026-10-05\"><button type=\"button\" disabled=\"\">変える<\/button><\/label><span style=\"flex: 1 1 0%;\"><\/span><a>デモ一覧<\/a><label>アカウント<select><option value=\"\">（ログアウト）<\/option><option value=\"Ad00001\">Ad00001 田中 健一（営業）<\/option><option value=\"Ad00002\">Ad00002 佐々木 桜（CS）<\/option><option value=\"Ad00003\">Ad00003 井上 悠（商品開発）<\/option><option value=\"Ad00006\">Ad00006 山田直美（商品管理）<\/option><option value=\"Ad00008\">Ad00008 佐藤太郎（フル権限）<\/option><option value=\"Ad00010\" selected=\"\">Ad00010 中村幸子（フル権限・商品管理・営業）<\/option><option value=\"Ad00011\">Ad00011 伊藤 美咲（物流）<\/option><option value=\"Ad00012\">Ad00012 渡辺 剛（経理）<\/option><option value=\"Ad00013\">Ad00013 松本 亮（閲覧のみ）<\/option><option value=\"Ad00021\">Ad00021 木村 大輔（関東倉 <img alt=\"\" src=\"http://localhost:3000/ops/avatar.png\"><span>中村幸子<\/span><button class=\"btn\">ログアウト<\/button><\/div><\/header><main class=\"content\"><div class=\"ops-masters\"><div class=\"wrap\"><details class=\"info\"><summary>デモの説明・凡例<\/summary><div><div class=\"kpi\"><div><b>56<\/b><span>全項目<\/span><\/div><div><b>56<\/b><span>フェーズ2 新規<\/span><\/div>\n<div><b>0<\/b><span>法人Webに出る項目<\/span><\/div><div><b>2<\/b><span>画面<\/span><\/div><\/div>\n<div class=\"banner\">オプションマスタ・値引きマスタの画面デモです（<b>運営Webだけの画面<\/b>）。マスタは「料金表・計算ルール」を持つだけで、拠点へのつける・やめるは子契約の「オプション・割引の異動」（12_運営_法人拠点契約.html）で登録します。<b>2026-09-25 決定：2つのマスタは統合せず分けたまま<\/b>。考え方は 96_説明_オプション値引きかんたん.html を参照。<b>この2画面の項目はすべてフェーズ2の新規・運営だけなので、「P2新」「法人に出さない」の札は省略しています<\/b>（2026-09-28）。<\/div>\n<div class=\"legend\">\n<span><span class=\"tag p1\">P1<\/span> 現行画面にある<\/span><span><span class=\"tag pv\">P1→P2変<\/span> 持ち方が変わる<\/span>\n<span><span class=\"tag pn\">P2新<\/span> フェーズ2で新設<\/span><span><span class=\"tag ap\">承認必須<\/span><\/span>\n<span><span class=\"tag nt\">通知<\/span><\/span><span><span class=\"tag only\">法人に出さない<\/span><\/span><span><span class=\"tag ro\">法人は参照のみ<\/span>（運営は編集できます）<\/span>\n<span><span class=\"req\">*<\/span> 必須<\/span><span><span class=\"cond\">△<\/span> 条件付き<\/span><span>いまの設定では非活性<\/span>\n<\/div><\/div><\/details><section class=\"screen s-op\"><div class=\"phead\"><div class=\"phl\"><div class=\"crumb\">マスタ管理 / <a class=\"lnk\">オプションマスタ一覧<\/a> / オプション編集<\/div><h2>オプション編集<span class=\"pid\">OP000001<\/span><\/h2><div class=\"sumbar\"><span class=\"s\"><i>オプションID<\/i><b>OP000001<\/b><\/span><span class=\"s\"><i>オプション名<\/i><b>配送回数追加<\/b><\/span><span class=\"s\"><i>連動タイプ<\/i><b>A 契約項目に連動（システム定義）<\/b><\/span><span class=\"s\"><i>料金種別<\/i><b>月額料金（継続）<\/b><\/span><span class=\"s\"><i>標準金額<\/i><b>3,000円<\/b><\/span><span class=\"s\"><i>適用中<\/i><b>8拠点<\/b><\/span><\/div><\/div><div class=\"pbtn\"><button type=\"button\" class=\"cancel\">キャンセル<\/button><button type=\"button\" class=\"save\">保存<\/button><\/div><\/div><div class=\"stick\"><div class=\"tabrow\"><div class=\"tabs\" role=\"tablist\"><button type=\"button\" role=\"tab\" aria-selected=\"true\" class=\"on\">基本情報<\/button><button type=\"button\" role=\"tab\" aria-selected=\"false\">料金<\/button><button type=\"button\" role=\"tab\" aria-selected=\"false\">連動の確認・履歴<\/button><\/div><\/div><div class=\"tools\"><div class=\"srch\"><span class=\"ic\">🔍<\/span><input placeholder=\"項目を検索（/）\" aria-label=\"項目を検索\" type=\"search\" value=\"\"><button type=\"button\" class=\"clr\" aria-label=\"検索をクリア\">×<\/button><\/div><span class=\"hits\"><\/span><button type=\"button\" class=\"linkbtn\">すべて閉じる<\/button><label><input type=\"checkbox\"> 項目定義（物理名・型・説明）<\/label><label><input type=\"checkbox\"> 入力する項目だけ<\/label><label><input type=\"checkbox\"> フェーズ2の新規のみ<\/label><\/div><div class=\"idx\"><button type=\"button\">基本情報<b>7<\/b><\/button><button type=\"button\">契約項目との連動<b>4<\/b><\/button><\/div><\/div><div class=\"pane\" id=\"op-0\"><div class=\"card\" id=\"sec-0\"><button type=\"button\" class=\"ch\">基本情報<span class=\"chev\">︿<\/span><\/button><div class=\"cb\"><div class=\"cols\"><div class=\"f newf\" data-name=\"オプションID\"><label>オプションID<span class=\"req\">*<\/span> <span class=\"tag pn\">P2新<\/span> <span class=\"tag only\">法人に出さない<\/span><\/label><div class=\"ctl\"><input readonly=\"\" value=\"OP000001\"><\/div><div class=\"note-s\">OP ＋6桁（例：OP000001）。機種ID・プランIDと同じ「2文字＋6桁」の体系。採番後は変更しない<\/div><div class=\"meta\"><code>option.no<\/code>　varchar(20)<\/div><\/div><div class=\"f newf\" data-name=\"管理名（社内用）\"><label>管理名（社内用）<span class=\"req\">*<\/span> <span class=\"tag pn\">P2新<\/span> <span class=\"tag only\">法人に出さない<\/span><\/label><div class=\"ctl\"><input value=\"配送回数追加\"><\/div><div class=\"note-s\">社内で使う名前。一覧・検索はこの名前<\/div><div class=\"meta\"><code>option.name_admin<\/code>　varchar(80)<\/div><\/div><div class=\"f newf\" data-name=\"請求書表示名\"><label>請求書表示名<span class=\"req\">*<\/span> <span class=\"tag pn\">P2新<\/span> <span class=\"tag only\">法人に出さない<\/span><\/label><div class=\"ctl\"><input value=\"配送回数追加\"><\/div><div class=\"note-s\">請求書の費目名としてそのまま出る。【スポット費用の対象月をカッコ書きする運用は廃止し、費目行の対象期間列で持つ】<\/div><div class=\"meta\"><code>option.name_invoice<\/code>　varchar(80)<\/div><\/div><div class=\"f newf\" data-name=\"オプション区分\"><label>オプション区分<span class=\"req\">*<\/span> <span class=\"tag pn\">P2新<\/span> <span class=\"tag only\">法人に出さない<\/span><\/label><div class=\"ctl\"><select><option value=\"配送\" selected=\"\">配送<\/option><option value=\"アプリ機能\">アプリ機能<\/option><option value=\"設置・作業\">設置・作業<\/option><option value=\"事務\">事務<\/option><option value=\"ペナルティ\">ペナルティ<\/option><\/select><\/div><div class=\"note-s\">オプション区分マスタ（使用中）から選ぶ。運営（システム管理）が足せる（台帳 F「オプション区分の持ち方」・受付簿 #117）。選択肢・請求書の並びは 区分の並び順 → オプションID<\/div><div class=\"meta\"><code>option.category<\/code>　varchar(20)<\/div><\/div><div class=\"f newf\" data-name=\"公開ステータス\"><label>公開ステータス<span class=\"req\">*<\/span> <span class=\"tag pn\">P2新<\/span> <span class=\"tag only\">法人に出さない<\/span><\/label><div class=\"ctl\"><select><option value=\"公開\">公開<\/option><option value=\"非公開\" selected=\"\">非公開<\/option><\/select><\/div><div class=\"note-s\">公開／非公開。【2026-10-01 統一（回答 P1）】旧「公開区分」（法人Webの申込に出す／運営だけが選べる）と同じ意味のため「公開ステータス」にまとめた。「公開」＝法人Webの申込・変更でお客様が自分で選べる。「非公開」＝運営だけが選べる（法人には出ない）。機種マスタ・プランマスタ・値引きマスタの「公開ステータス」と同じ言葉<\/div><div class=\"meta\"><code>option.public_status<\/code>　varchar(12)　（旧 option.visibility）<\/div><\/div><div class=\"f newf\" data-name=\"利用状態\"><label>利用状態<span class=\"req\">*<\/span> <span class=\"tag pn\">P2新<\/span> <span class=\"tag only\">法人に出さない<\/span><\/label><div class=\"ctl\"><select><option value=\"使用中\" selected=\"\">使用中<\/option><option value=\"終了\">終了<\/option><\/select><\/div><div class=\"note-s\">使用中／終了。終了にしても、すでに適用中の拠点はそのまま請求が続く（新規に選べなくなるだけ）<\/div><div class=\"meta\"><code>option.status<\/code>　varchar(12)<\/div><\/div><div class=\"f newf span3\" data-name=\"説明\"><label>説明<span class=\"cond\">△<\/span> <span class=\"tag pn\">P2新<\/span> <span class=\"tag only\">法人に出さない<\/span><\/label><div class=\"ctl\"><textarea rows=\"2\">温度帯ごとに標準の配送回数を超えた回数 × 金額（月額）。足りない温度帯と相殺しない（28-85・28-154・28-156）<\/textarea><\/div><div class=\"note-s\">運営が選ぶときに迷わないための説明。法人Webには出さない<\/div><div class=\"meta\"><code>option.description<\/code>　text<\/div><\/div><\/div><\/div><\/div><div class=\"card\" id=\"sec-1\"><button type=\"button\" class=\"ch\">契約項目との連動<span class=\"chev\">︿<\/span><\/button><div class=\"cb\"><div class=\"cols\"><div class=\"f newf\" data-name=\"連動タイプ\"><label>連動タイプ<span class=\"req\">*<\/span> <span class=\"tag pn\">P2新<\/span> <span class=\"tag only\">法人に出さない<\/span><\/label><div class=\"ctl\"><select disabled=\"\"><option value=\"A 契約項目に連動（システム定義）\" selected=\"\">A 契約項目に連動（システム定義）<\/option><option value=\"連動しない\">連動しない<\/option><\/select><\/div><div class=\"note-s\">【A】契約項目に連動（システム定義）／連動しない。【2026-09-28 決定：A型は運営が自由に作るものではなく、連動する契約項目（配送回数・ES-QR・ゲストモードなど）ごとにシステムで先に定義しておく。運営が直せるのは表示名・金額・ステータスなどだけで、A型の新規登録と削除はできない。新規登録で選べるのは「連動しない」だけ】【連動しないオプションの「継続／1回きり」（以前の B／C）は料金種別で決まる：月額料金＝継続（つけたらずっと）、初期料金・単発料金＝1回きり】。この区分で子契約の異動に出すか・自動で計上するかが決まる<\/div><div class=\"meta\"><code>option.link_type<\/code>　varchar(4)<\/div><\/div><div class=\"f newf\" data-name=\"連動する契約項目\"><label>連動する契約項目<span class=\"cond\">△<\/span> <span class=\"tag pn\">P2新<\/span> <span class=\"tag only\">法人に出さない<\/span><\/label><div class=\"ctl\"><input readonly=\"\" value=\"配送回数\"><\/div><div class=\"note-s\">【連動タイプ＝A のときだけ表示・システム定義で変更不可（2026-09-28）】配送回数／ES-QR／ゲストモード／ユーザー現金利用 など。A型のオプション1つに契約項目1つ<\/div><div class=\"meta\"><code>option.link_field<\/code>　varchar(40)<\/div><\/div><div class=\"f newf\" data-name=\"連動条件\"><label>連動条件<span class=\"cond\">△<\/span> <span class=\"tag pn\">P2新<\/span> <span class=\"tag only\">法人に出さない<\/span><\/label><div class=\"ctl\"><input readonly=\"\" value=\"配送ルート設定の配送回数が、プラン標準の回数を超えたとき\"><\/div><div class=\"note-s\">【連動タイプ＝A のときだけ表示・システム定義で変更不可（2026-09-28）】その項目がどの値のとき効くか。例：ES-QR＝利用する／ゲストモード＝利用する／配送回数がプラン標準を超えた分<\/div><div class=\"meta\"><code>option.link_condition<\/code>　varchar(120)<\/div><\/div><div class=\"f newf\" data-name=\"数量の取り方\"><label>数量の取り方<span class=\"cond\">△<\/span> <span class=\"tag pn\">P2新<\/span> <span class=\"tag only\">法人に出さない<\/span><\/label><div class=\"ctl\"><input readonly=\"\" value=\"プラン標準を超えた分だけ\"><\/div><div class=\"note-s\">【連動タイプ＝A のときだけ表示・システム定義】固定1／契約項目の値そのまま／プラン標準を超えた分だけ。例：配送回数12回・プラン標準8回 →「超えた分」なら数量4。連動しないオプションの数量は、子契約でつけるときに入れる（2026-09-29）<\/div><div class=\"meta\"><code>option.qty_rule<\/code>　varchar(20)<\/div><\/div><\/div><\/div><\/div><\/div><\/section><\/div><\/div><\/main><\/div><\/div><\/div><div id=\"es-review\" style=\"position: fixed; right: 16px; bottom: 16px; z-index: 2147483000;\"><\/div><next-route-announcer style=\"position: absolute;\"><\/next-route-announcer><\/body><\/html>", "014": "<!DOCTYPE html><html lang=\"ja\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width, initial-scale=1\"><!--KDCSS:3--><!--KDCSS:0--><!--KDCSS:1--><title>運営Web｜ESSTATION<\/title><meta name=\"description\" content=\"ESSTATION の運営・法人・委託配送先・ドライバー・仕入先の Web\"><link rel=\"preconnect\" href=\"https://fonts.googleapis.com\"><!--KDCSS:2--><style>nextjs-portal{display:none!important}*{transition:none!important;animation:none!important}<\/style><\/head><body><div hidden=\"\"><!--$--><!--/$--><\/div><div class=\"ops\"><div class=\"es-demo-bar\"><span class=\"es-demo-tag\">DEMO<\/span><span>運営Web。データは架空です。今日：<b>2026-10-05<\/b><\/span><label title=\"デモの「今日」を変えます（全サイト共通）\">日付を変える<input type=\"date\" value=\"2026-10-05\"><button type=\"button\" disabled=\"\">変える<\/button><\/label><span style=\"flex: 1 1 0%;\"><\/span><a>デモ一覧<\/a><label>アカウント<select><option value=\"\">（ログアウト）<\/option><option value=\"Ad00001\">Ad00001 田中 健一（営業）<\/option><option value=\"Ad00002\">Ad00002 佐々木 桜（CS）<\/option><option value=\"Ad00003\">Ad00003 井上 悠（商品開発）<\/option><option value=\"Ad00006\">Ad00006 山田直美（商品管理）<\/option><optio 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 6h18M3 12h18M3 18h18\"><\/path><\/svg><\/button><div class=\"hello\"><img alt=\"\" src=\"http://localhost:3000/ops/hello.png\"><span>お帰りなさい<\/span><\/div><div class=\"user\"><img alt=\"\" src=\"http://localhost:3000/ops/avatar.png\"><span>中村幸子<\/span><button class=\"btn\">ログアウト<\/button><\/div><\/header><main class=\"content\"><div class=\"ops-masters\"><div class=\"wrap\"><details class=\"info\"><summary>デモの説明・凡例<\/summary><div><div class=\"kpi\"><div><b>56<\/b><span>全項目<\/span><\/div><div><b>56<\/b><span>フェーズ2 新規<\/span><\/div>\n<div><b>0<\/b><span>法人Webに出る項目<\/span><\/div><div><b>2<\/b><span>画面<\/span><\/div><\/div>\n<div class=\"banner\">オプションマスタ・値引きマスタの画面デモです（<b>運営Webだけの画面<\/b>）。マスタは「料金表・計算ルール」を持つだけで、拠点へのつける・やめるは子契約の「オプション・割引の異動」（12_運営_法人拠点契約.html）で登録します。<b>2026-09-25 決定：2つのマスタは統合せず分けたまま<\/b>。考え方は 96_説明_オプション値引きかんたん.html を参照。<b>この2画面の項目はすべてフェーズ2の新規・運営だけなので、「P2新」「法人に出さない」の札は省略しています<\/b>（2026-09-28）。<\/div>\n<div class=\"legend\">\n<span><span class=\"tag p1\">P1<\/span> 現行画面にある<\/span><span><span class=\"tag pv\">P1→P2変<\/span> 持ち方が変わる<\/span>\n<span><span class=\"tag pn\">P2新<\/span> フェーズ2で新設<\/span><span><span class=\"tag ap\">承認必須<\/span><\/span>\n<span><span class=\"tag nt\">通知<\/span><\/span><span><span class=\"tag only\">法人に出さない<\/span><\/span><span><span class=\"tag ro\">法人は参照のみ<\/span>（運営は編集できます）<\/span>\n<span><span class=\"req\">*<\/span> 必須<\/span><span><span class=\"cond\">△<\/span> 条件付き<\/span><span>いまの設定では非活性<\/span>\n<\/div><\/div><\/details><section class=\"screen s-op\"><div class=\"phead\"><div class=\"phl\"><div class=\"crumb\">マスタ管理 / <a class=\"lnk\">オプションマスタ一覧<\/a> / オプション編集<\/div><h2>オプション編集<span class=\"pid\">OP000004<\/span><\/h2><div class=\"sumbar\"><span class=\"s\"><i>オプションID<\/i><b>OP000004<\/b><\/span><span class=\"s\"><i>オプション名<\/i><b>地域配送料<\/b><\/span><span class=\"s\"><i>連動タイプ<\/i><b>連動しない<\/b><\/span><span class=\"s\"><i>料金種別<\/i><b>月額料金（継続）<\/b><\/span><span class=\"s\"><i>標準金額<\/i><b>4,000円<\/b><\/span><span class=\"s\"><i>適用中<\/i><b>1拠点<\/b><\/span><\/div><\/div><div class=\"pbtn\"><button type=\"button\" class=\"cancel\">キャンセル<\/button><button type=\"button\" class=\"save\">保存<\/button><\/div><\/div><div class=\"stick\"><div class=\"tabrow\"><div class=\"tabs\" role=\"tablist\"><button type=\"button\" role=\"tab\" aria-selected=\"true\" class=\"on\">基本情報<\/button><button type=\"button\" role=\"tab\" aria-selected=\"false\">料金<\/button><button type=\"button\" role=\"tab\" aria-selected=\"false\">連動の確認・履歴<\/button><\/div><\/div><div class=\"tools\"><div class=\"srch\"><span class=\"ic\">🔍<\/span><input placeholder=\"項目を検索（/）\" aria-label=\"項目を検索\" type=\"search\" value=\"\"><button type=\"button\" class=\"clr\" aria-label=\"検索をクリア\">×<\/button><\/div><span class=\"hits\"><\/span><button type=\"button\" class=\"linkbtn\">すべて閉じる<\/button><label><input type=\"checkbox\"> 項目定義（物理名・型・説明）<\/label><label><input type=\"checkbox\"> 入力する項目だけ<\/label><label><input type=\"checkbox\"> フェーズ2の新規のみ<\/label><\/div><div class=\"idx\"><button type=\"button\">基本情報<b>7<\/b><\/button><button type=\"button\">契約項目との連動<b>1<\/b><\/button><\/div><\/div><div class=\"pane\" id=\"op-0\"><div class=\"card\" id=\"sec-0\"><button type=\"button\" class=\"ch\">基本情報<span class=\"chev\">︿<\/span><\/button><div class=\"cb\"><div class=\"cols\"><div class=\"f newf\" data-name=\"オプションID\"><label>オプションID<span class=\"req\">*<\/span> <span class=\"tag pn\">P2新<\/span> <span class=\"tag only\">法人に出さない<\/span><\/label><div class=\"ctl\"><input readonly=\"\" value=\"OP000004\"><\/div><div class=\"note-s\">OP ＋6桁（例：OP000001）。機種ID・プランIDと同じ「2文字＋6桁」の体系。採番後は変更しない<\/div><div class=\"meta\"><code>option.no<\/code>　varchar(20)<\/div><\/div><div class=\"f newf\" data-name=\"管理名（社内用）\"><label>管理名（社内用）<span class=\"req\">*<\/span> <span class=\"tag pn\">P2新<\/span> <span class=\"tag only\">法人に出さない<\/span><\/label><div class=\"ctl\"><input value=\"地域配送料X\"><\/div><div class=\"note-s\">社内で使う名前。一覧・検索はこの名前<\/div><div class=\"meta\"><code>option.name_admin<\/code>　varchar(80)<\/div><\/div><div class=\"f newf\" data-name=\"請求書表示名\"><label>請求書表示名<span class=\"req\">*<\/span> <span class=\"tag pn\">P2新<\/span> <span class=\"tag only\">法人に出さない<\/span><\/label><div class=\"ctl\"><input value=\"地域配送料\"><\/div><div class=\"note-s\">請求書の費目名としてそのまま出る。【スポット費用の対象月をカッコ書きする運用は廃止し、費目行の対象期間列で持つ】<\/div><div class=\"meta\"><code>option.name_invoice<\/code>　varchar(80)<\/div><\/div><div class=\"f newf\" data-name=\"オプション区分\"><label>オプション区分<span class=\"req\">*<\/span> <span class=\"tag pn\">P2新<\/span> <span class=\"tag only\">法人に出さない<\/span><\/label><div class=\"ctl\"><select><option value=\"配送\" selected=\"\">配送<\/option><option value=\"アプリ機能\">アプリ機能<\/option><option value=\"設置・作業\">設置・作業<\/option><option value=\"事務\">事務<\/option><option value=\"ペナルティ\">ペナルティ<\/option><\/select><\/div><div class=\"note-s\">オプション区分マスタ（使用中）から選ぶ。運営（システム管理）が足せる（台帳 F「オプション区分の持ち方」・受付簿 #117）。選択肢・請求書の並びは 区分の並び順 → オプションID<\/div><div class=\"meta\"><code>option.category<\/code>　varchar(20)<\/div><\/div><div class=\"f newf\" data-name=\"公開ステータス\"><label>公開ステータス<span class=\"req\">*<\/span> <span class=\"tag pn\">P2新<\/span> <span class=\"tag only\">法人に出さない<\/span><\/label><div class=\"ctl\"><select><option value=\"公開\">公開<\/option><option value=\"非公開\" selected=\"\">非公開<\/option><\/select><\/div><div class=\"note-s\">公開／非公開。【2026-10-01 統一（回答 P1）】旧「公開区分」（法人Webの申込に出す／運営だけが選べる）と同じ意味のため「公開ステータス」にまとめた。「公開」＝法人Webの申込・変更でお客様が自分で選べる。「非公開」＝運営だけが選べる（法人には出ない）。機種マスタ・プランマスタ・値引きマスタの「公開ステータス」と同じ言葉<\/div><div class=\"meta\"><code>option.public_status<\/code>　varchar(12)　（旧 option.visibility）<\/div><\/div><div class=\"f newf\" data-name=\"利用状態\"><label>利用状態<span class=\"req\">*<\/span> <span class=\"tag pn\">P2新<\/span> <span class=\"tag only\">法人に出さない<\/span><\/label><div class=\"ctl\"><select><option value=\"使用中\" selected=\"\">使用中<\/option><option value=\"終了\">終了<\/option><\/select><\/div><div class=\"note-s\">使用中／終了。終了にしても、すでに適用中の拠点はそのまま請求が続く（新規に選べなくなるだけ）<\/div><div class=\"meta\"><code>option.status<\/code>　varchar(12)<\/div><\/div><div class=\"f newf span3\" data-name=\"説明\"><label>説明<span class=\"cond\">△<\/span> <span class=\"tag pn\">P2新<\/span> <span class=\"tag only\">法人に出さない<\/span><\/label><div class=\"ctl\"><textarea rows=\"2\">配送エリアによる。金額は拠点ごと（子契約で上書き）。既定 4,000円（STEP3回答 Q5'）<\/textarea><\/div><div class=\"note-s\">運営が選ぶときに迷わないための説明。法人Webには出さない<\/div><div class=\"meta\"><code>option.description<\/code>　text<\/div><\/div><\/div><\/div><\/div><div class=\"card\" id=\"sec-1\"><button type=\"button\" class=\"ch\">契約項目との連動<span class=\"chev\">︿<\/span><\/button><div class=\"cb\"><div class=\"cols\"><div class=\"f newf\" data-name=\"連動タイプ\"><label>連動タイプ<span class=\"req\">*<\/span> <span class=\"tag pn\">P2新<\/span> <span class=\"tag only\">法人に出さない<\/span><\/label><div class=\"ctl\"><select><option value=\"A 契約項目に連動（システム定義）\">A 契約項目に連動（システム定義）<\/option><option value=\"連動しない\" selected=\"\">連動しない<\/option><\/select><\/div><div class=\"note-s\">【A】契約項目に連動（システム定義）／連動しない。【2026-09-28 決定：A型は運営が自由に作るものではなく、連動する契約項目（配送回数・ES-QR・ゲストモードなど）ごとにシステムで先に定義しておく。運営が直せるのは表示名・金額・ステータスなどだけで、A型の新規登録と削除はできない。新規登録で選べるのは「連動しない」だけ】【連動しないオプションの「継続／1回きり」（以前の B／C）は料金種別で決まる：月額料金＝継続（つけたらずっと）、初期料金・単発料金＝1回きり】。この区分で子契約の異動に出すか・自動で計上するかが決まる<\/div><div class=\"meta\"><code>option.link_type<\/code>　varchar(4)<\/div><\/div><div class=\"f newf hide\" data-name=\"連動する契約項目\"><label>連動する契約項目<span class=\"cond\">△<\/span> <span class=\"tag pn\">P2新<\/span> <span class=\"tag only\">法人に出さない<\/span><\/label><div class=\"ctl\"><input readonly=\"\" value=\"—（連動しない）\"><\/div><div class=\"note-s\">【連動タイプ＝A のときだけ表示・システム定義で変更不可（2026-09-28）】配送回数／ES-QR／ゲストモード／ユーザー現金利用 など。A型のオプション1つに契約項目1つ<\/div><div class=\"meta\"><code>option.link_field<\/code>　varchar(40)<\/div><\/div><div class=\"f newf hide\" data-name=\"連動条件\"><label>連動条   vi:{box:'Hiện khung',reset:'Về trạng thái ban đầu',zoomFit:'Vừa màn hình',zoom100:'Kích thước thật',loading:'Đang tải demo…',lgArea:'Khu vực (mục lớn)',lgLeaf:'Mục',lgSel:'Đang chọn',
      screens:'Màn hình & trạng thái',lists:'Danh sách',sheets:'Sheet bổ sung (dữ liệu mặc định…)',msgs:'Danh sách thông báo',mails:'Email',issues:'OPEN (chờ khách xác nhận)',about:'Về tài liệu này',items:'Định nghĩa mục',search:'Tìm theo tên, nội dung',
      all:'Tất cả',chk:'Cần xác nhận',inp:'Mục nhập',kind:'Loại',req:'Bắt buộc',len:'Kiểu / độ dài',init:'Giá trị mặc định',ex:'Dữ liệu ví dụ',detail:'Chi tiết',cond:'Điều kiện hiển thị',trig:'Trigger',valid:'Validation',err:'Error message',
      chkL:'OPEN',demo:'Định nghĩa từ demo (tự động)',sel:'Vị trí trên demo',must:'Bắt buộc',cnd:'Có điều kiện',miss:'Không có trên màn hình',count:'mục',noteL:'Ghi chú',type:'Loại',where:'Vị trí hiển thị',text:'Nội dung',ml:'Message List',diff:'Khác biệt',used:'Dùng ở mục',
      src:'Nguồn',content:'Nội dung',view:'Màn hình',to:'Người nhận',state:'Trạng thái'}
};
function t(k){ return (UI[LANG]||UI.ja)[k]||k; }
function L(p){ return Array.isArray(p) ? (LANG==='vi' ? (p[1]||p[0]) : p[0]) : (p||''); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
var $ = function(id){ return document.getElementById(id); };
var fr = $('fr'), W = null, READY = false;
/* 本物の Web を元にしたとき：状態ごとの静止した HTML（KD_DEMOS）。デモのときは 1 ファイル（KD_DEMO）＋ setup */
var DEMOS = window.KD_DEMOS || null, LOADED = null, LOADING = null;
/* スナップショットの共通 CSS（<!--KDCSS:n-->）を元に戻す（kd_build.dedupe_styles） */
function snapHtml(id){
  var h = DEMOS[id]; if(!h) return '<p style="padding:2rem">(no snapshot)</p>';
  return h.replace(/<!--KDCSS:(\d+)-->/g, function(m, n){ return (window.KD_CSS || [])[+n] || ''; });
}

/* ---------------- nav ---------------- */
function renderNav(){
  var h = '<h4>'+t('screens')+'</h4>', last = null;
  D.views.forEach(function(v){
    if(v.code!==last){ last = v.code; h += '<div class="grp"><code>'+esc(v.code)+'</code>'+esc(L(v.screen))+'</div>'; }
    var w = D.issues.filter(function(x){ return x.view===v.id; }).length;
    h += '<a data-v="'+v.id+'" class="'+(PANEL==='items'&&VIEW&&VIEW.id===v.id?'on':'')+'"><span class="id">'+esc(v.id)+'</span><span>'+esc(L(v.state))+'</span>'+
         '<span class="n">'+v.rows.length+'</span>'+(w?'<span class="w">'+w+'</span>':'')+'</a>';
  });
  h += '<h4>'+t('lists')+'</h4>';
  var lists = [['msgs',D.messages.length],['mails',D.mails.length],['issues',D.issues.length]];
  if((D.sheets||[]).length) lists.push(['sheets',D.sheets.length]);
  lists.push(['about','']);
  lists.forEach(function(p){
    h += '<a data-p="'+p[0]+'" class="ls '+(PANEL===p[0]?'on':'')+'"><span>'+t(p[0])+'</span><span class="n">'+p[1]+'</span></a>';
  });
  $('nav').innerHTML = h;
}
$('nav').addEventListener('click', function(e){
  var a = e.target.closest('a'); if(!a) return;
  if(a.dataset.v){ PANEL='items'; showView(a.dataset.v); }
  else { PANEL = a.dataset.p; renderNav(); renderSide(); }
});

/* ---------------- iframe ---------------- */
function fit(){
  var st = $('stage'), w = st.clientWidth, h = st.clientHeight, s = ZOOMFIT ? Math.min(1, w/1440) : 1;
  fr.style.width = '1440px'; fr.style.height = (h/s)+'px'; fr.style.transform = 'scale('+s+')';
  $('stage').style.overflow = ZOOMFIT ? 'hidden' : 'auto';
}
window.addEventListener('resize', fit);
$('zoom').onclick = function(){ ZOOMFIT = !ZOOMFIT; this.textContent = ZOOMFIT ? t('zoomFit') : t('zoom100'); fit(); };
function boot(){
  fr.onload = function(){
    W = fr.contentWindow;
    var s = W.document.createElement('script'); s.textContent = window.KD_OVERLAY; W.document.head.appendChild(s);
    var st = W.document.createElement('style'); st.id='__kd_hide'; W.document.head.appendChild(st);
    W.__KD.live(); READY = true; $('loading').style.display='none';
    if(DEMOS){ LOADED = LOADING; LOADING = null; applyView(); if(SELNO) setTimeout(function(){ scrollCard(SELNO); }, 400); return; }
    var keep = SELNO; showView(VIEW ? VIEW.id : D.views[0].id, keep);
    if(keep) setTimeout(function(){ scrollCard(keep); }, 400);
  };
  if(DEMOS) showView(D.views[0].id); else fr.srcdoc = window.KD_DEMO;
  fit();
}
function applyView(){
  if(!VIEW) return;
  if(DEMOS && LOADED !== VIEW.id){
    if(LOADING !== VIEW.id){ LOADING = VIEW.id; READY = false; $('loading').style.display=''; fr.srcdoc = snapHtml(VIEW.id); }
    return;
  }
  if(!READY) return;
  if(!DEMOS){ try { W.eval(VIEW.setup); } catch(e){ console.warn('setup', e); } }
  W.document.getElementById('__kd_hide').textContent = D.hideAlways.concat(VIEW.hide||[]).join(',')+'{display:none!important}'+(D.viewerCss||'');
  setTimeout(function(){
    W.__KD.set(VIEW.rows.map(function(r){ return {no:r.no, sel:r.sel, kind:r.kindKey, ja:r.ja}; }), function(no){ pick(no, false, true); });
    W.__KD.box($('boxTg').checked);
    if(SELNO) W.__KD.select(SELNO, true);
    W.scrollTo(0,0);
  }, 250);
}
$('reset').onclick = function(){ SELNO = null; if(DEMOS) LOADED = null; applyView(); renderSide(); };
$('boxTg').onchange = function(){ if(W && W.__KD) W.__KD.box(this.checked); };

function showView(id, no){
  VIEW = D.views.filter(function(v){ return v.id===id; })[0];
  SELNO = no || null; OPEN = {}; if(no) OPEN[no] = true;
  $('vCode').textContent = VIEW.code+'　/　'+VIEW.id;
  $('vName').textContent = L(VIEW.screen);
  $('vState').textContent = t('state')+'：'+L(VIEW.state);
  renderNav(); renderSide(); applyView();
}

/* ---------------- side ---------------- */
function rowMatch(r){
  if(FILTER==='chk' && !(r.chk[0] || r.auto.length)) return false;
  if(FILTER==='inp' && ['text','textarea','select','check','radio','month','file','card'].indexOf(r.kindKey)<0) return false;
  if(!Q) return true;
  var s = [r.no, r.ja, r.vi, r.detail[0], r.detail[1], r.valid[0], r.len].join(' ').toLowerCase();
  return s.indexOf(Q.toLowerCase())>=0;
}
function itemHtml(r){
  var area = r.lvl===0 && ['area','modal','table'].indexOf(r.kindKey)>=0;
  var hasChk = r.chk[0] || r.auto.length;
  var tags = '<span class="tag">'+esc(L(r.kind))+'</span>'+
    (r.req==='○'?'<span class="tag req">'+t('must')+'</span>':'')+(r.req==='条件付き'?'<span class="tag cnd">'+t('cnd')+'</span>':'')+
    (hasChk?'<span class="tag chk">'+t('chkL')+'</span>':'')+(!r.found?'<span class="tag miss">'+t('miss')+'</span>':'');
  var rows = [];
  function add(k, v, cls){ if(v) rows.push('<dt>'+t(k)+'</dt><dd'+(cls?' class="'+cls+'"':'')+'>'+v+'</dd>'); }
  add('detail', esc(L(r.detail)));
  add('len', esc(L(r.len))); add('init', esc(L(r.init)));
  if(r.ex && r.ex[0]) add('ex', esc(LANG==='vi' ? r.ex.filter(Boolean).join(' → ') : r.ex[0])); add('cond', esc(L(r.cond)));
  add('trig', esc(L(r.trig))); add('valid', esc(L(r.valid)));
  if(r.err.length) add('err', r.err.map(function(e, i){ return '<span class="em" data-m="'+esc(r.errCodes[i])+'">'+esc(L(e))+'</span>'; }).join(''));
  var ck = [];
  if(r.chk[0]) ck.push(esc(L(r.chk)));
  r.auto.forEach(function(a){ ck.push('【'+(LANG==='vi'?'Tự động':'自動')+'】'+esc(L(a))); });
  add('chkL', ck.join('\n'), 'warn');
  add('demo', esc(L(r.demo)), 'demo');
  add('sel', '<span class="sel">'+esc(r.sel)+'</span>');
  return '<div class="it '+(r.lvl?'l1':'')+(SELNO===r.no?' on':'')+(OPEN[r.no]?' open':'')+'" data-no="'+esc(r.no)+'">'+
    '<div class="hd"><span class="bdg '+(area?'area':'leaf')+'">'+esc(r.no)+'</span><div style="min-width:0;flex:1">'+
    '<div class="nm">'+esc(LANG==='vi'?r.vi:r.ja)+'</div><div class="meta">'+tags+'</div>'+
    (L(r.detail)?'<div class="one">'+esc(L(r.detail))+'</div>':'')+'</div></div>'+
    '<div class="bd"><dl>'+rows.join('')+'</dl></div></div>';
}
function renderSide(){
  var sh = $('sh'), li = $('list');
  if(PANEL==='items'){
    var rows = VIEW.rows.filter(rowMatch);
    sh.innerHTML = '<div class="row"><h3>'+t('items')+'</h3><span class="cnt">'+rows.length+' / '+VIEW.rows.length+' '+t('count')+'</span></div>'+
      '<input id="q" placeholder="'+t('search')+'" value="'+esc(Q)+'">'+
      '<div class="chips">'+['all','chk','inp'].map(function(f){ return '<button data-f="'+f+'" class="'+(FILTER===f?'on':'')+'">'+t(f)+'</button>'; }).join('')+'</div>';
    li.innerHTML = (L(VIEW.note)?'<div class="note"><b>'+t('noteL')+'：</b>'+esc(L(VIEW.note))+'</div>':'')+rows.map(itemHtml).join('');
    var q = $('q'); q.oninput = function(){ Q = this.value; var p = this.selectionStart; renderSide(); var n=$('q'); n.focus(); n.setSelectionRange(p,p); };
    sh.querySelectorAll('[data-f]').forEach(function(b){ b.onclick = function(){ FILTER = b.dataset.f; renderSide(); }; });
  } else if(PANEL==='msgs'){
    sh.innerHTML = '<div class="row"><h3>'+t('msgs')+'</h3><span class="cnt">'+D.messages.length+' '+t('count')+'</span></div>';
    var used = {};
    D.views.forEach(function(v){ v.rows.forEach(function(r){ r.errCodes.forEach(function(c){ (used[c]=used[c]||[]).push([v.id, r.no]); }); }); });
    li.innerHTML = '<table class="t"><tr><th>ID</th><th>'+t('text')+'</th></tr>'+D.messages.map(function(m){
      return '<tr id="m_'+m.id+'" class="'+(m.id===window.__MSEL?'on':'')+'"><td><span class="mid">'+m.id+'</span><div style="color:var(--ink3);font-size:11px">'+esc(m.type)+'</div></td><td>'+
        '<div>'+esc(LANG==='vi'?m.vi:m.ja)+'</div><div style="color:var(--ink3);font-size:11px;margin-top:2px">'+t('where')+'：'+esc(m.where)+'　'+t('ml')+'：'+esc(m.ml||'—')+(m.mlState?'（'+esc(m.mlState)+'）':'')+'</div>'+
        ((used[m.id]||[]).length?'<div style="font-size:11px;margin-top:2px">'+t('used')+'：'+used[m.id].map(function(u){ return '<a href="#" data-go="'+u[0]+'|'+u[1]+'">'+u[0]+' No.'+u[1]+'</a>'; }).join('、')+'</div>':'')+
        (m.diff?'<div class="diff">'+esc(m.diff)+'</div>':'')+'</td></tr>';
    }).join('')+'</table>';
    if(window.__MSEL){ var x = $('m_'+window.__MSEL); if(x) x.scrollIntoView({block:'center'}); }
  } else if(PANEL==='mails'){
    sh.innerHTML = '<div class="row"><h3>'+t('mails')+'</h3></div>';
    li.innerHTML = '<table class="t"><tr><th>ID</th><th>'+t('content')+'</th></tr>'+D.mails.map(function(m){
      return '<tr><td><span class="mid">'+m.id+'</span></td><td>'+esc(LANG==='vi'?m.vi:m.ja)+'<div style="color:var(--ink3);font-size:11px">'+t('to')+'：'+esc(m.to)+'</div></td></tr>'; }).join('')+'</table>'+
      '<div class="note" style="margin-top:10px">'+(LANG==='vi'?'Nội dung chính thức: Message List (Excel) sheet Email.':'文面の正は Message List（Excel）の「メール」シート。送る条件は メール一覧_申込・申請。')+'</div>';
  } else if(PANEL==='issues'){
    sh.innerHTML = '<div class="row"><h3>'+t('issues')+'</h3><span class="cnt">'+D.issues.length+' '+t('count')+'</span></div>';
    li.innerHTML = '<table class="t"><tr><th>'+t('view')+'</th><th>'+t('content')+'</th></tr>'+D.issues.map(function(x){
      return '<tr class="'+(x.view?'go':'')+'" data-go="'+(x.view?x.view+'|'+x.no:'')+'"><td style="white-space:nowrap"><span class="mid" style="color:var(--blue)">'+esc(x.view||x.code)+'</span><div style="font-size:11px">No.'+esc(x.no)+'</div></td>'+
        '<td><b>'+esc(LANG==='vi'&&x.vi?x.vi:x.ja)+'</b><div>'+esc(L(x.text))+'</div><div style="color:var(--ink3);font-size:11px">'+esc(x.src)+'</div></td></tr>'; }).join('')+'</table>';
  } else if(PANEL==='sheets'){
    sh.innerHTML = '<div class="row"><h3>'+t('sheets')+'</h3></div>';
    li.innerHTML = (D.sheets||[]).map(function(s){
      return '<h3 style="margin:6px 0">'+esc(L(s.name))+'</h3>'+(s.note?'<div class="note">'+esc(L(s.note))+'</div>':'')+(s.tables||[]).map(function(tb){
        return '<h4 style="margin:10px 0 4px">'+esc(L(tb.title))+'</h4>'+(tb.note&&L(tb.note)?'<div class="note">'+esc(L(tb.note))+'</div>':'')+'<div style="overflow:auto"><table class="t" style="font-size:11px;white-space:nowrap"><tr>'+tb.head.map(function(h){ return '<th>'+esc(L(h[0]))+'</th>'; }).join('')+'</tr>'+
          tb.rows.map(function(r){ return '<tr>'+r.map(function(x){ return '<td style="max-width:360px;white-space:normal">'+esc(Array.isArray(x)?L(x):String(x==null?'':x))+'</td>'; }).join('')+'</tr>'; }).join('')+'</table></div>'; }).join('');
    }).join('');
  } else if(PANEL==='about'){
    sh.innerHTML = '<div class="row"><h3>'+t('about')+'</h3></div>';
    li.innerHTML = '<div class="about note" style="background:#fff;border:1px solid var(--line)">'+(LANG==='vi'
      ? '<p><b>Cách dùng</b>: Nhấn số trên màn hình demo để xem định nghĩa; nhấn thẻ bên phải để làm sáng vị trí trên màn hình. Demo vẫn thao tác được.</p><p><b>Nguồn dữ liệu</b>: 05_基本設計/データ/'+esc(D.dataFile)+' là bản chính. HTML và Excel được tạo tự động từ cùng dữ liệu.</p><p><b>Demo</b>: '+esc(D.demo)+'</p>'
      : '<p><b>使い方</b>：デモ画面の番号を押すと右に定義が出ます。右の項目を押すと画面の場所が光ります。デモはそのまま操作できます（操作すると番号の位置も追いかけます）。</p>'+
        '<p><b>元データ</b>：05_基本設計/データ/'+esc(D.dataFile)+' が正です。この HTML と Excel は同じデータから自動で作っています。直すときはデータを直して作り直します。</p>'+
        '<p><b>「自動」の要確認</b>：作るときにデモの入力欄（項目名・必須の表示・選択肢・最大文字数）を読み取り、仕様と違うところを自動で挙げています。</p>'+
        '<p><b>共通の決まり</b>：基本設計_全体の定義_提案_20261001（メッセージの出し方 §1、入力 §10-1、法人Web の権限 §10-7）。</p>'+
        '<p><b>元にしたデモ</b>：'+esc(D.demo)+'　<b>作成</b>：'+esc(D.created)+'　'+esc(D.author)+'</p>')+'</div>';
  }
}
$('list').addEventListener('click', function(e){
  var go = e.target.closest('[data-go]');
  if(go && go.dataset.go){ e.preventDefault(); var p = go.dataset.go.split('|'); PANEL='items'; FILTER='all'; Q=''; showView(p[0], p[1]); setTimeout(function(){ scrollCard(p[1]); }, 60); return; }
  var em = e.target.closest('.em');
  if(em){ window.__MSEL = em.dataset.m; PANEL = D.messages.some(function(m){ return m.id===em.dataset.m; }) ? 'msgs' : 'mails'; renderNav(); renderSide(); return; }
  var hd = e.target.closest('.hd');
  if(hd){ var no = hd.parentNode.dataset.no; OPEN[no] = !(OPEN[no] && SELNO===no) ; pick(no, true, false); }
});
function scrollCard(no){ var c = document.querySelector('.it[data-no="'+no+'"]'); if(c) c.scrollIntoView({block:'center', behavior:'smooth'}); }
function pick(no, scrollFrame, scrollList){
  SELNO = no; if(scrollList) OPEN[no] = true;
  if(PANEL!=='items'){ PANEL='items'; renderNav(); }
  if(FILTER!=='all' || Q){ var r = VIEW.rows.filter(function(x){ return x.no===no; })[0]; if(r && !rowMatch(r)){ FILTER='all'; Q=''; } }
  renderSide();
  if(W && W.__KD) W.__KD.select(no, scrollFrame);
  if(scrollList) scrollCard(no);
}
$('lang').addEventListener('click', function(e){
  var b = e.target.closest('button'); if(!b) return; LANG = b.dataset.l;
  document.querySelectorAll('#lang button').forEach(function(x){ x.classList.toggle('on', x===b); });
  document.querySelectorAll('[data-t]').forEach(function(x){ x.textContent = t(x.dataset.t); });
  $('zoom').textContent = ZOOMFIT ? t('zoomFit') : t('zoom100');
  document.documentElement.lang = LANG;
  head(); renderNav(); renderSide(); if(VIEW){ $('vName').textContent = L(VIEW.screen); $('vState').textContent = t('state')+'：'+L(VIEW.state); }
});
function head(){
  $('ttl').textContent = LANG==='vi' ? 'Thiết kế màn hình' : '画面設計書';
  $('sub').textContent = L([D.system.ja, D.system.vi])+'　｜　'+(LANG==='vi'?(D.titleVi||D.title):D.title)+'　｜　'+D.created;
}
document.title = '画面設計書 '+D.title; head();
/* #001-4|14.12 のように開くと、その状態・項目から始める（メッセージ一覧からのリンク） */
var H = decodeURIComponent((location.hash||'').slice(1)).split('|'), HV = D.views.filter(function(v){ return v.id===H[0]; })[0];
VIEW = HV || D.views[0]; showView(VIEW.id, HV ? H[1] : null); boot();
})();
</script>
