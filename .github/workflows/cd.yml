name: Deploy wiki to S3 + CloudFront

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

# id-token: write lets the job get a GitHub OIDC token; no repository secrets needed.
permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-1
  # Not secrets: the role only trusts this repo's main branch (es-kitchen-infra/environments/wiki).
  AWS_ROLE_ARN: arn:aws:iam::049985671158:role/estkitchen-wiki-deploy
  S3_BUCKET: estkitchen-wiki-049985671158
  CLOUDFRONT_DISTRIBUTION_ID: E10B2U2P8VP0IG

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          cache: 'pip'

      - name: Install dependencies
        run: cd es-kitchen-docs && pip install -r requirements.txt

      - name: Build documentation
        run: cd es-kitchen-docs && mkdocs build --strict

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload site
        run: aws s3 sync ./es-kitchen-docs/site/ "s3://${S3_BUCKET}/" --delete

      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" --paths "/*"
