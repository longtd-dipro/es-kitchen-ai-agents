<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>画面設計書</title>
<style>
:root{
  --bg:#F3F5F8; --panel:#FFFFFF; --ink:#18212B; --ink2:#55616E; --ink3:#8A95A1; --line:#DFE4EA; --line2:#C9D1DA;
  --navy:#16324F; --blue:#1D4ED8; --blue-s:#EAF0FD; --pink:#D6246E; --pink-s:#FCEAF2; --amber:#B45309; --amber-s:#FEF3C7;
  --green:#047857; --green-s:#E3F5EE; --red:#B42318; --red-s:#FDECEA; --sel:#F59E0B;
  --f:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP","Meiryo",sans-serif;
  --fm:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:13px/1.55 var(--f);display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;cursor:pointer}
/* top bar */
.top{height:50px;flex:0 0 50px;background:var(--navy);color:#fff;display:flex;align-items:center;gap:14px;padding:0 16px}
.top .ttl{font-weight:800;font-size:14px;white-space:nowrap}
.top .sub{color:#B8C7D6;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sp{flex:1}
.seg{display:flex;background:#0F2338;border-radius:8px;padding:3px}
.seg button{border:0;background:transparent;color:#C5D3E0;padding:4px 11px;border-radius:6px;font-size:12px;font-weight:600}
.seg button.on{background:#fff;color:var(--navy)}
.tg{display:flex;align-items:center;gap:6px;font-size:12px;color:#DCE6EF;white-space:nowrap}
/* layout */
.main{flex:1;display:grid;grid-template-columns:232px minmax(0,1fr) 460px;min-height:0}
.nav{background:var(--panel);border-right:1px solid var(--line);overflow:auto;padding:12px 0}
.nav h4{margin:14px 16px 6px;font-size:11px;letter-spacing:.06em;color:var(--ink3);font-weight:700}
.nav .grp{margin:8px 10px 2px;padding:6px 8px 4px;font-size:11.5px;font-weight:700;color:var(--ink2)}
.nav .grp code{font:600 10.5px var(--fm);color:var(--blue);display:block}
.nav a{display:grid;grid-template-columns:1fr auto auto;column-gap:6px;align-items:center;margin:1px 10px;padding:6px 10px;border-radius:8px;color:var(--ink);text-decoration:none;cursor:pointer;font-size:12.5px;line-height:1.4}
.nav a .id{grid-column:1/-1;line-height:1.3}
.nav a.ls{display:flex}
.nav a:hover{background:#F1F4F8}
.nav a.on{background:var(--blue-s);color:var(--blue);font-weight:700}
.nav a .id{font:600 10px var(--fm);color:var(--ink3)}
.nav a.on .id{color:var(--blue)}
.nav a .n{margin-left:auto;font-size:10.5px;color:var(--ink3)}
.nav a .w{margin-left:4px;background:var(--amber-s);color:var(--amber);border-radius:9px;padding:0 6px;font-size:10.5px;font-weight:700}
/* center */
.ctr{display:flex;flex-direction:column;min-width:0;min-height:0}
.ch{padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.ch .t1{font:600 11px var(--fm);color:var(--blue)}
.ch .t2{font-size:15px;font-weight:800;margin-top:1px}
.ch .t3{font-size:12px;color:var(--ink2);margin-top:2px}
.ch .btns{margin-left:auto;display:flex;gap:6px;flex-shrink:0}
.btn{border:1px solid var(--line2);background:#fff;border-radius:7px;padding:5px 10px;font-size:12px;color:var(--ink)}
.btn:hover{background:#F5F7FA}
.stage{flex:1;position:relative;overflow:hidden;background:#E7EBF0}
.stage iframe{position:absolute;left:0;top:0;border:0;background:#fff;transform-origin:0 0}
.legend{position:absolute;right:12px;bottom:10px;background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:11px;color:var(--ink2);display:flex;gap:12px;z-index:3}
.legend i{display:inline-block;width:12px;height:12px;border-radius:6px;vertical-align:-2px;margin-right:4px}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink2);font-size:13px;background:#E7EBF0;z-index:2}
/* right */
.side{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.sh{padding:10px 14px 8px;border-bottom:1px solid var(--line)}
.sh .row{display:flex;gap:8px;align-items:center}
.sh h3{margin:0;font-size:14px}
.sh .cnt{color:var(--ink3);font-size:12px}
.sh input{width:100%;margin-top:8px;border:1px solid var(--line2);border-radius:7px;padding:6px 9px;font:inherit}
.chips{display:flex;gap:5px;margin-top:7px;flex-wrap:wrap}
.chips button{border:1px solid var(--line2);background:#fff;border-radius:14px;padding:2px 10px;font-size:11.5px;color:var(--ink2)}
.chips button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.list{flex:1;overflow:auto;padding:8px 10px 40px}
.note{margin:2px 4px 10px;padding:8px 10px;border-radius:8px;background:#F4F6F9;color:var(--ink2);font-size:12px}
.it{border:1px solid var(--line);border-radius:10px;margin:0 0 7px;background:#fff;transition:box-shadow .15s}
.it.l1{margin-left:16px}
.it.on{border-color:var(--sel);box-shadow:0 0 0 3px rgba(245,158,11,.22)}
.it .hd{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;cursor:pointer}
.bdg{flex:0 0 auto;min-width:24px;height:22px;padding:0 6px;border-radius:11px;color:#fff;font:700 11.5px/22px var(--f);text-align:center}
.bdg.area{background:var(--blue)} .bdg.leaf{background:var(--pink)}
.it .nm{font-weight:700;font-size:13px;line-height:1.4;padding-top:2px}
.it .meta{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}
.tag{font-size:10.5px;border-radius:5px;padding:0 6px;background:#EEF1F5;color:var(--ink2);line-height:18px}
.tag.req{background:var(--red-s);color:var(--red);font-weight:700}
.tag.cnd{background:var(--amber-s);color:var(--amber);font-weight:700}
.tag.chk{background:var(--amber-s);color:var(--amber)}
.tag.miss{background:#333;color:#fff}
.it .one{color:var(--ink2);font-size:12px;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.it.open .one{display:none}
.it .bd{display:none;border-top:1px solid var(--line);padding:8px 10px 10px}
.it.open .bd{display:block}
dl{margin:0;display:grid;grid-template-columns:104px 1fr;gap:5px 10px;font-size:12px}
dt{color:var(--ink3);font-weight:600}
dd{margin:0;white-space:pre-wrap;word-break:break-word}
dd .em{display:block;padding:3px 7px;margin:0 0 3px;border-radius:6px;background:var(--red-s);color:#7A1B12;cursor:pointer}
dd .em:hover{outline:1px solid #E7A39B}
dd.warn{background:var(--amber-s);color:#6B3A04;border-radius:6px;padding:4px 7px}
dd.demo{font-size:11.5px;color:var(--ink2)}
.sel{font:11px var(--fm);color:var(--ink3)}
/* tables in side */
table.t{width:100%;border-collapse:collapse;font-size:12px}
table.t th{text-align:left;background:#F2F5F8;color:var(--ink2);font-weight:700;padding:6px 7px;border-bottom:1px solid var(--line);position:sticky;top:0}
table.t td{padding:6px 7px;border-bottom:1px solid var(--line);vertical-align:top}
table.t tr.on td{background:#FFF7E6}
table.t tr.go{cursor:pointer} table.t tr.go:hover td{background:#F6F9FD}
.mid{font:700 11.5px var(--fm);color:var(--pink)}
.diff{color:#6B3A04;background:var(--amber-s);border-radius:5px;padding:2px 6px;display:inline-block;margin-top:3px}
.about p{margin:0 0 10px} .about b{color:var(--navy)}
@media (max-width:1180px){.main{grid-template-columns:200px minmax(0,1fr) 380px}}
@media (max-width:900px){body{overflow:auto}.main{grid-template-columns:1fr;grid-template-rows:auto 70vh auto}.nav{max-height:220px}.side{min-height:60vh}}
</style>
</head>
<body>
<div class="top">
  <div class="ttl" id="ttl">画面設計書</div>
  <div class="sub" id="sub"></div>
  <div class="sp"></div>
  <label class="tg"><input type="checkbox" id="boxTg" checked> <span data-t="box">枠を表示</span></label>
  <div class="seg" id="lang"><button data-l="ja" class="on">日本語</button><button data-l="vi">Tiếng Việt</button></div>
</div>
<div class="main">
  <nav class="nav" id="nav"></nav>
  <section class="ctr">
    <div class="ch">
      <div style="min-width:0">
        <div class="t1" id="vCode"></div>
        <div class="t2" id="vName"></div>
        <div class="t3" id="vState"></div>
      </div>
      <div class="btns">
        <button class="btn" id="reset" data-t="reset">最初の状態に戻す</button>
        <button class="btn" id="zoom" data-t="zoomFit">画面に合わせる</button>
      </div>
    </div>
    <div class="stage" id="stage">
      <div class="loading" id="loading" data-t="loading">デモを読み込んでいます…</div>
      <iframe id="fr" title="demo"></iframe>
      <div class="legend"><span><i style="background:#1D4ED8"></i><span data-t="lgArea">エリア（大項目）</span></span><span><i style="background:#D6246E"></i><span data-t="lgLeaf">項目</span></span><span><i style="background:#F59E0B"></i><span data-t="lgSel">選択中</span></span></div>
    </div>
  </section>
  <aside class="side">
    <div class="sh" id="sh"></div>
    <div class="list" id="list"></div>
  </aside>
</div>

-height);padding:0 var(--space-16);color:var(--text-middle);border-bottom:1px solid var(--divider-low);white-space:nowrap}\n.es-table tbody tr:hover td{background:var(--surface-subtle)}\n.es-table tr.is-selected td{background:var(--primary-subtle)}\n.es-table tr.is-deleted td{background:var(--surface-disabled);color:var(--text-low)}\n.es-table td a{color:var(--primary-text);text-decoration:none}\n.es-table td a:hover{text-decoration:underline}\n\n/* Pagination */\n.es-pagination{display:flex;align-items:center;justify-content:flex-end;gap:var(--space-8);flex-wrap:wrap;font-size:14px}\n.es-pagination__meta{color:var(--text-middle);margin-right:var(--space-8)}\n.es-page{min-width:32px;height:32px;padding:0 var(--space-8);border:1px solid var(--divider-middle);border-radius:var(--radius-md);background:var(--surface);color:var(--text-middle);font:inherit;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}\n.es-page:hover:not(:disabled){border-color:var(--primary);color:var(--primary-text)}\n.es-page.is-current{border-color:var(--primary);color:var(--primary-text);font-weight:700}\n.es-page:disabled{color:var(--divider-high);cursor:not-allowed}\n.es-page--gap{border-color:transparent;cursor:default}\n.es-pagination__per{width:128px}\n\n/* Side navigation — 210 / 80, item 48, radius 8, active = primary fill */\n.es-sidenav{width:var(--sidebar-width);flex:none;background:var(--surface);display:flex;flex-direction:column;box-shadow:var(--shadow-stick);min-height:100%;position:relative;z-index:5;transition:width .18s ease}\n@media (prefers-reduced-motion:reduce){.es-sidenav{transition:none}}\n.es-sidenav.is-collapsed{width:var(--sidebar-collapsed)}\n.es-sidenav__logo{height:var(--header-height);display:flex;align-items:center;padding:0 var(--space-12);border-bottom:1px solid var(--divider-low)}\n.es-sidenav__logo{overflow:hidden;flex:none}\n.es-sidenav__logo img{height:36px;max-width:none;width:auto;display:block}\n.is-collapsed .es-sidenav__logo{padding:0 0 0 17px}\n.is-collapsed .es-sidenav__logo img{height:36px;clip-path:inset(0 calc(100% - 46px) 0 0)}\n.es-sidenav__wordmark{font-weight:700;letter-spacing:.04em;color:var(--brand-red)}\n.es-sidenav__menu{display:flex;flex-direction:column;gap:var(--space-8);padding:var(--space-16) 13px}\n.es-navitem{width:100%;height:var(--nav-item-height);display:flex;align-items:center;gap:var(--space-8);padding:0 var(--space-12);border:0;border-radius:var(--radius-lg);background:transparent;color:var(--text-middle);font:inherit;font-size:16px;text-align:left;cursor:pointer}\n.es-navitem__label{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.es-navitem:hover{background:var(--surface-subtle);color:var(--text-high)}\n.es-navitem.is-active{background:var(--primary);color:var(--on-primary);font-weight:700}\n.es-navitem.is-active:hover{background:var(--primary-hover)}\n.is-collapsed .es-navitem{justify-content:center;padding:0}\n.es-subnav{display:flex;flex-direction:column;margin-top:var(--space-4)}\n.es-subitem{height:var(--nav-item-height);border:0;border-radius:var(--radius-lg);background:transparent;padding:0 var(--space-16) 0 46px;text-align:left;font:inherit;font-size:14px;color:var(--text-middle);cursor:pointer}\n.es-subitem:hover{background:var(--surface-subtle)}\n.es-subitem.is-active{background:var(--primary-subtle);color:var(--primary-text);font-weight:700}\n\n/* App header — 54 */\n.es-appheader{height:var(--header-height);background:var(--surface);display:flex;align-items:center;justify-content:space-between;padding:0 var(--space-16);border-bottom:1px solid var(--divider-low)}\n.es-appheader__greet{display:flex;align-items:center;gap:var(--space-8);font-size:16px;font-weight:500;color:var(--text-high)}\n.es-appheader__sun{width:28px;height:28px;border-radius:var(--radius-full);background:var(--brand-orange)}\n.es-appheader__right{display:flex;align-items:center;gap:var(--space-12)}\n.es-profile{display:flex;align-items:center;gap:var(--space-8);border:0;background:none;font:inherit;font-size:16px;color:var(--text-high);cursor:pointer;padding:var(--space-4);border-radius:var(--radius-md)}\n.es-avatar{width:36px;height:36px;border-radius:var(--radius-full);background:var(--primary-muted);color:var(--primary-text);display:grid;place-items:center;font-weight:700}\n\n/* Inline message / Toast */\n.es-inline{display:flex;gap:var(--space-8);padding:var(--space-12) var(--space-16);border-radius:var(--radius-sm);border:1px solid;font-size:14px;line-height:24px}\n.es-inline strong{display:block}\n.es-inline .es-icon{margin-top:3px}\n.es-inline--info{background:var(--info-50);border-color:var(--info-100);color:var(--info-700)}\n.es-inline--success{background:var(--success-50);border-color:var(--success-100);color:var(--success-700)}\n.es-inline--warning{background:var(--warning-50);border-color:var(--warning-100);color:var(--warning-800)}\n.es-inline--negative{background:var(--negative-50);border-color:var(--negative-100);color:var(--negative-600)}\n.es-toast{display:inline-flex;align-items:center;gap:var(--space-8);min-width:280px;max-width:100%;padding:var(--space-12) var(--space-16);border-radius:var(--radius-lg);background:var(--surface);color:var(--text-high);box-shadow:var(--shadow-popout);border:1px solid var(--divider-low);font-size:14px}\n.es-toast--success .es-icon:first-child{color:var(--success-500)}\n.es-toast--negative .es-icon:first-child{color:var(--negative-500)}\n.es-toast__close{margin-left:auto;border:0;background:none;color:var(--text-low);cursor:pointer;padding:var(--space-4);display:grid}\n\n/* Modal — 450 wide, radius modal 12 */\n.es-modal{position:fixed;inset:0;display:grid;place-items:center;z-index:50;padding:var(--space-16)}\n.es-modal--inline{position:relative;inset:auto;padding:0}\n.es-modal__scrim{position:absolute;inset:0;background:var(--overlay-scrim)}\n.es-modal__panel{position:relative;width:var(--modal-width);max-width:100%;background:var(--surface);border-radius:var(--radius-xl);box-shadow:var(--shadow-popout);padding:var(--space-24);display:flex;flex-direction:column;align-items:center;gap:var(--space-16);text-align:center}\n.es-modal__close{position:absolute;top:var(--space-12);right:var(--space-12);border:0;background:none;color:var(--text-low);cursor:pointer;padding:var(--space-4);display:grid;border-radius:var(--radius-md)}\n.es-modal__mark{width:72px;height:72px;border-radius:var(--radius-full);display:grid;place-items:center;font-size:40px;font-weight:700}\n.es-modal__mark--warning,.es-modal__mark--negative{background:var(--warning-100);color:var(--negative-500)}\n.es-modal__mark--success{background:var(--success-100);color:var(--success-700)}\n.es-modal__mark--info{background:var(--info-100);color:var(--info-700)}\n.es-modal__title{margin:0;font-size:20px;line-height:32px;font-weight:700;color:var(--text-high)}\n.es-modal__body{font-size:14px;line-height:24px;color:var(--text-middle)}\n.es-modal__actions{display:flex;gap:var(--space-8);width:100%}\n\n/* Login */\n.es-login{min-height:100%;display:grid;place-items:center;padding:var(--space-40) var(--space-16);background:linear-gradient(180deg,var(--login-wash) 0%,var(--primary-100) 55%,var(--white) 55%)}\n.es-login__card{width:464px;max-width:100%;background:var(--surface);border-radius:var(--radius-3xl);box-shadow:var(--shadow-popout);padding:var(--space-48) var(--space-32) var(--space-24);display:flex;flex-direction:column;gap:var(--space-16)}\n.es-login__logo{height:56px;object-fit:contain;align-self:center}\n.es-login__title{margin:0;text-align:center;font-size:24px;line-height:36px;font-weight:700}\n.es-login__forgot{align-self:center}\n\n/* Shell */\n.es-shell{display:flex;min-height:100%;background:var(--page-bg)}\n.es-shell__main{flex:1;min-width:0;display:flex;flex-direction:column}\n.es-shell__content{padding:0 var(--space-24) var(--space-24);display:flex;flex-direction:column;gap:var(--space-16)}\n\n/* Search panel — one wrapping flow. Fields take only the width they need; the actions sit at the right\n   and drop below the fields when the panel is narrow. Collapsed = first line of fields only. */\n.es-search{display:flex;flex-wrap:wrap;align-items:flex-start;gap:var(--space-12) var(--space-16);background:var(--surface-subtle);border-left:3px solid var(--primary);padding:var(--space-12) var(--space-16);container-type:inline-size}\n.es-search__toggle{flex:none;width:32px;height:32px;margin-top:4px;border-radius:var(--radius-full);border:0;background:var(--surface);color:var(--text-middle);box-shadow:var(--shadow-raise);display:grid;place-items:center;cursor:pointer}\n.es-search__toggle:hover{color:var(--primary-text);background:var(--primary-subtle)}\n.es-search__toggle:focus-visible{outline:none;box-shadow:var(--shadow-focus)}\n.es-search__left{flex:1 1 360px;min-width:0;display:flex;align-items:flex-start;gap:var(--space-12)}\n.es-search__fields{flex:1;min-width:0;display:flex;flex-wrap:wrap;align-content:flex-start;gap:var(--space-12)}\n.es-search.is-collapsed .es-search__fields{max-height:var(--control-md);overflow:hidden}\n/* intrinsic widths: a select needs ~12 chars, a free-text search ~20; they may grow a little to fill a line */\n.es-search__fields>*{flex:1 1 176px;max-width:240px;min-width:0}\n.es-search__fields>.es-grow{flex:2 1 240px;max-width:440px}\n.es-search__fields>.es-wide{flex:1 1 240px;max-width:360px}\n.es-search__actions{flex:0 0 auto;display:flex;flex-direction:column;gap:var(--space-12);margin-left:auto}\n.es-search__main{display:flex;gap:var(--space-8)}\n.es-search__main>*{min-width:104px}\n.es-search__extra{display:flex;flex-direction:column;gap:var(--space-8)}\n.es-search .es-field__label:empty{display:none}\n@container (max-width:640px){.es-search__actions{flex:1 1 100%}.es-search__main>*{flex:1}.es-search__fields>*,.es-search__fields>.es-grow{max-width:none}}\n.es-sortbtn{justify-content:space-between}\n\n/* Row actions (操作列) */\n.es-rowactions{display:inline-flex;gap:var(--space-4)}\n.es deg,#F4860C,#FFC15E);\n  display:grid;place-items:center;color:#3A2200;font-weight:800;font-size:11px;letter-spacing:-.02em}\n.gnav .bt{font-size:13.5px;font-weight:800;letter-spacing:.02em;white-space:nowrap}\n.gnav .bs{font-size:11px;color:#B9CBDD;border-left:1px solid #3B5B7E;padding-left:10px;margin-left:2px;white-space:nowrap}\n.gnav .gmenu{display:flex;gap:2px;flex-shrink:0}\n.gnav .gmenu a{padding:6px 12px;border-radius:6px;font-size:12.5px;font-weight:600;color:#C9D9E7;white-space:nowrap}\n.gnav .gmenu a:hover{background:#27496E}\n.gnav .gmenu a.on{background:#fff;color:var(--navy)}\n.gnav .gright{margin-left:auto;display:flex;align-items:center;gap:10px;flex-shrink:0}\n.gnav .gu{display:flex;align-items:center;gap:7px;font-size:12.5px;color:#DCE7F1;white-space:nowrap}\n.gnav .gav{width:25px;height:25px;border-radius:50%;background:#3B6390;display:grid;place-items:center;font-size:11px;font-weight:700}\n.gnav .gcar{font-size:10px;color:#9FB6CB}\n\n/* ============ page ============ */\n.page{max-width:1440px;margin:0 auto;padding:16px 20px 120px}\n.crumb{font-size:12px;color:var(--ink3);margin-bottom:5px}\n.crumb b{color:var(--ink2);font-weight:600}\n.phead{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:12px}\n.phead h1{font-size:22px;margin:0;letter-spacing:-.01em;display:flex;align-items:center;gap:10px;flex-wrap:wrap}\n.pmeta{display:flex;gap:16px;flex-wrap:wrap;margin-top:7px;font-size:12.5px;color:var(--ink2)}\n.pmeta span b{color:var(--ink);font-weight:700;font-variant-numeric:tabular-nums}\n.pacts{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}\n\n/* ============ buttons ============ */\n.btn{font-size:13px;font-weight:600;padding:7px 14px;border-radius:6px;border:1px solid var(--line2);\n  background:#fff;color:var(--ink);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}\n.btn:hover{border-color:#9FB0C1;background:var(--soft)}\n.btn.sm{font-size:12px;padding:4px 10px}\n.btn.pri{backg first-child,.scrollx table.t td:first-child{padding-left:12px}\n\n/* diff cell colors */\n.up{color:var(--red);font-weight:700}\n.down{color:var(--blue);font-weight:700}\n.same{color:var(--ink3)}\n.attn{color:var(--amber);font-weight:700}\n\n/* ============ notes ============ */\n.note{border-radius:7px;padding:9px 12px;font-size:12.5px;line-height:1.65;border:1px solid;margin:10px 0}\n.note.info{background:var(--blue-s);border-color:var(--blue-b);color:#1B4E86}\n.note.warn{background:var(--amber-s);border-color:var(--amber-b);color:var(--amber)}\n.note.dang{background:var(--red-s);border-color:var(--red-b);color:var(--red)}\n.note.ok{background:var(--green-s);border-color:var(--green-b);color:var(--green)}\n.note.mut{background:var(--soft);border-color:var(--line);color:var(--ink2)}\n.note b{font-weight:800}\n.note ul{margin:5px 0 0;padding-left:18px}\n.note li{margin:2px 0}\n\n/* ============ side panel ============ */\n.sidec{background:var(--card);border:1px solid var(--line);border-radius:9px;box-shadow:var(--sh);overflow:hidden}\n.sidec>h3{font-size:13px;margin:0;padding:9px 12px;background:var(--navy);color:#fff;display:flex;align-items:center;gap:8px}\n.sidec>h3 .sb{font-size:11px;color:#B9CBDD;font-weight:500;margin-left:auto}\n.sblk{padding:10px 12px;border-bottom:1px solid var(--line)}\n.sblk:last-child{border-bottom:none}\n.sblk h4{font-size:11.5px;margin:0 0 7px;color:var(--navy2);display:flex;align-items:center;gap:6px;flex-wrap:wrap}\n.srow{display:flex;justify-content:space-between;gap:10px;font-size:12px;padding:3px 0;align-items:baseline}\n.srow .sk{color:var(--ink3);flex-shrink:0}\n.srow .sv{text-align:right;word-break:break-word;font-weight:600}\n.srow .sv.mut{font-weight:400;color:var(--ink3)}\n.stab{font-size:11.5px;width:100%;border-collapse:collapse}\n.stab th,.stab td{padding:5px 6px;border-bottom:1px solid #EEF0F3;text-align:left;vertical-align:top}\n.stab th{background:var(--soft);color:var(--ink3);font-weight:700;font-size:10.5px;white-space:nowrap}\n.stab td .mm{font-size:10.5px;color:var(--ink3);word-break:break-all}\n\n/* ============ fixed footer ============ */\n.fixfoot{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);\n  box-shadow:0 -4px 18px -10px rgba(28,36,48,.3);padding:11px 20px}\n.ffin{max-width:1440px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}\n.ffin .fnote{font-size:12.5px;color:var(--ink2)}\n.ffin .fr{margin-left:auto;display:flex;gap:9px;align-items:center;flex-wrap:wrap}\n\n/* ============ modal ============ */\n.ov{position:fixed;inset:0;z-index:70;background:rgba(17,26,38,.62);display:none;align-items:flex-start;justify-content:center;padding:34px 16px;overflow-y:auto}\n.ov.on{display:flex}\n.mdl{background:#fff;border-radius:12px;width:100%;max-width:620px;box-shadow:0 24px 60px -14px rgba(0,0,0,.45);overflow:hidden;animation:pop .16s ease-out}\n.mdl.wide{max-width:760px}\n@keyframes pop{from{transform:translateY(-10px);opacity:.4}to{transform:none;opacity:1}}\n.mhead{padding:22px 24px 6px;text-align:center}\n.mico{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;margin:0 auto 12px;font-size:25px;font-weight:800}\n.mico.q{background:var(--amber-s);color:#D79B1D;border:2px solid #EFD4A4}\n.mico.ok{background:var(--green-s);color:var(--green);border:2px solid var(--green-b)}\n.mico.dang{background:var(--red-s);color:var(--red);border:2px solid var(--red-b)}\n.mdl h3{font-size:18px;margin:0;letter-spacing:-.01em}\n.mdl .mdesc{font-size:13px;color:var(--ink2);margin:7px 0 0}\n.mbody{padding:14px 24px 4px}\n.mfoot{padding:14px 24px 20px;display:flex;gap:9px;justify-content:flex-end;flex-wrap:wrap}\n.mfoot .btn{padding:9px 20px}\n.cnt{display:flex;gap:9px;flex-wrap:wrap;margin:10px 0}\n.cnt .ci{flex:1 1 130px;background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:9px 11px;text-align:center}\n.cnt .ci .cl{font-size:11px;color:var(--ink3);font-weight:600}\n.cnt . tsub{font-size:12.5px;color:var(--ink2);margin:0 0 14px}\n\n/* fields */\n.frow{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:11px}\n.fld{min-width:0}\n.fld .fl{font-size:11.5px;font-weight:700;color:var(--ink2);display:flex;align-items:center;gap:5px;margin-bottom:3px;flex-wrap:wrap}\n.fld .rq{font-size:10px;font-weight:800;color:var(--red);background:var(--red-s);border-radius:3px;padding:0 4px}\n.fld .ro{background:var(--soft);border:1px solid var(--line);border-radius:6px;padding:6px 9px;font-size:13px;color:var(--ink);min-height:33px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}\n.fld .ro.lock{color:var(--ink2)}\n.fld input[type=text],.fld input[type=date],.fld input[type=number],.fld select,.fld textarea{\n  width:100%;border:1px solid var(--line2);border-radius:6px;padding:6px 9px;font-size:13px;background:#fff}\n.fld input:focus,.fld select:focus,.fld textarea:focus{outline:2px solid var(--blue-b);outline-offset:-1px;border-color:var(--blue)}\n.fld textarea{min-height:62px;resize:vertical}\n.fld .fh{font-size:11px;color:var(--ink3);margin-top:3px}\n.fld.bad input,.fld.bad select,.fld.bad textarea{border-color:var(--red);background:var(--red-s)}\n.fld .er{display:none;font-size:11.5px;color:var(--red);font-weight:700;margin-top:3px}\n.fld.bad .er{display:block}\n.fld.wide{grid-column:1/-1}\n.swrow{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:7px;padding:9px 11px;background:#fff;margin-bottom:8px;flex-wrap:wrap}\n.swrow .sn{font-size:13px;font-weight:700}\n.swrow .sd{font-size:11.5px;color:var(--ink3)}\n.swrow .sp{margin-left:auto;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}\n.swrow label.sw{display:inline-flex;align-items:center;gap:7px;cursor:pointer;font-size:12.5px;font-weight:700}\n.swrow input[type=checkbox]{width:15px;height:15px;accent-color:var(--blue)}\n.ckline{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;cursor:pointe ink)}\n.card>h2 .apx-n{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--navy);color:#fff;font-size:12px;margin-right:4px}\n.pad{padding:12px 14px}\n/* ① 申請内容：太字のラベル＋グレーの値の枠（法人画面と同じ見せ方） */\n.apx-kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 16px}\n.apx-f .l{font-size:12px;font-weight:800;color:var(--ink);margin-bottom:4px}\n.apx-f .v{background:#F3F5F8;border:1px solid var(--line);border-radius:6px;padding:7px 10px;font-size:13px;min-height:34px;word-break:break-word}\n.apx-f.wide{grid-column:1/-1}\n/* ② 変更される項目 */\n.apx-br{display:flex;align-items:center;gap:8px;margin:12px 0 6px;font-size:13.5px}\n.apx-br:first-child{margin-top:0}\n.apx-loc{display:inline-block;font-size:11px;font-weight:700;color:var(--blue);background:var(--blue-s);border-radius:4px;padding:0 6px}\n.apx-loc:hover{text-decoration:underline}\n.apx-fld{font-weight:700;margin-top:3px}\n.apx-before{color:var(--ink2);text-decoration:line-through;text-decoration-color:#C3CAD3}\n.apx-after{background:#FFF8EC}\n/* ③ 動くもの */\ntable.t.apx-imp th{width:26%;background:var(--soft);color:var(--ink);white-space:normal}\ntable.t.apx-imp td.apx-when{width:28%;color:var(--ink2)}\n.apx-ops{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}\n/* 一覧 */\n.apx-tabs{display:flex;gap:6px;margin-bottom:10px;border-bottom:2px solid var(--line)}\n.apx-tab{border:0;background:transparent;padding:8px 14px;font-weight:700;color:var(--ink2);border-bottom:3px solid transparent;margin-bottom:-2px}\n.apx-tab.on{color:var(--navy);border-bottom-color:var(--orange)}\n.apx-tab b{background:var(--orange);color:#fff;border-radius:10px;padding:0 7px;font-size:11px;margin-left:3px}\n.apx-filter{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:10px;font-size:12.5px;font-weight:700;color:var(--ink2)}\n.apx-filter select,.apx-filter input{margin-left:6px;border:1px solid var(--line2);border-radius:6px;padding:5px 8px;font-weight:400}\n.apx- px){ .apx-kpis{grid-template-columns:repeat(2,minmax(0,1fr))} }\n\ntable.t.apx-list td,table.t.apx-list th{white-space:nowrap}\ntable.t.apx-list td.apx-co{white-space:normal;min-width:190px}\ntable.t.apx-list td.apx-head{white-space:normal;min-width:220px;max-width:270px}\ntable.t.apx-list td.apx-st{white-space:normal;min-width:110px;max-width:150px}\n/* 2026/09/28：見出し右の操作（主1つ＋副）／新規登録（代理入力） */\n.apx-acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}\n#nf .card{margin-bottom:14px}\n/* 2026/09/28 UX ------------------------------------------------ */\n/* 検索条件のたたみ（2行以上のときだけ矢印を出す） */\n.apx-filter{position:relative}\n.apx-ftog{flex:none;width:32px;height:32px;border-radius:50%;border:1px solid var(--line2);background:#fff;color:var(--ink2);display:grid;place-items:center;cursor:pointer;padding:0}\n.apx-ftog:hover{color:var(--blue);border-color:var(--blue)}\n.apx-filter.col{max-height:64px;overflow:hidden}\n.apx-filter.col .apx-ftog svg{transform:rotate(180deg)}\n/* 一覧：横にスクロールしても「開く」の列は右端に残す */\ntable.t.apx-list th:last-child,table.t.apx-list td:last-child{position:sticky;right:0;background:var(--card);box-shadow:inset 1px 0 0 var(--line);z-index:1}\ntable.t.apx-list thead th:last-child{background:var(--soft)}\ntable.t.apx-list tr.hi td:last-child{background:var(--blue-s)}\n.apx-kpi .v{white-space:nowrap}\n/* 申請詳細：下に固定の承認バー */\n.apx-stick{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);box-shadow:0 -4px 18px -10px rgba(28,36,48,.3);transition:transform .2s}\n.apx-stick.off{transform:translateY(110%)}\n.apx-stick-in{max-width:1180px;margin:0 auto;padding:10px 20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}\n.apx-stick-in .sp{flex:1}\n\n\n\n/* ===== ES Kitchen（System admin）を申請管理デモ（apply_demo）の既存クラスに当てる上書き。2026/09/28 =====\n   トークン（--primary など）だけを使う。元の common.css / approve.css の変数も DS のトークンへ付け替える */\n:root{\n  --navy:var(--neutral-800); --navy2:var(--neutral-700);\n  --blue:var(--primary); --blue-s:v    運営が入れるものがある 親契約（契約開始日）と 設備・オプション（設置日）だけが未保存で残る */\n    /* 2026/09/29：受付では 設備・オプション を 料金・請求 の前に置く（設備・オプションを決めてから料金を確かめる順） */\n    if(CFG.mode!=='approve' && t.tabs){ var ki=function(k){ for(var x=0;x<t.tabs.length;x++) if(t.tabs[x].key===k) return x; return -1; };\n      var fi=ki('fee'), ei=ki('eq'); if(fi>=0 && ei>fi){ t.tabs.splice(fi,0,t.tabs.splice(ei,1)[0]); } }\n    var PRE = CFG.preTabs || ['corp','br','bill','ct','fee'];   /* 子契約｜契約 は運営が配送ルートを入れるので未保存で始める */\n    (t.tabs||[]).forEach(function(tb,j){\n      /* 2026/09/29：拠点｜資料・履歴 は自動保存（ファイルを足した時点で保存。保存ボタンは置かない） */\n      if(CFG.mode!=='approve' && tb.key==='at'){ tb.auto = true; ST.saved[i][j] = {at:'自動保存', auto:true}; return; }\n      ST.saved[i][j] = (CFG.mode!=='approve' && PRE.indexOf(tb.key)>=0) ? {at:'申込内容確認で確認済み', pre:true} : null; });\n    routeInit(t,i);\n    ebInit(t,i);\n    ST.accOpen[i] = !!t.open;\n    ST.confirmed[i] = false;\n  });\n  ST.acct = !!CFG.acctIssued;\n  ST.acctChk = CFG.modalB && CFG.modalB.check ? !!CFG.modalB.check.on : false;\n  ST.applied = CFG.applyDate || null;\n  ST.phase = 'A'; ST.target = 0; ST.tab = 0; ST.aview = ST.aview || 'acc';\n  ST.approved = false; ST.form = null; ST.val = {}; ST.rtWarn = {}; ST.init = {}; ST.atab = 'info'; ST.edit = null; ST.snap = null; ST.pend = null;\n  /* 2026/09/23 決定 1B：承認は拠点単位。拠点ごとに '' 未処理 / 'ok' 承認 / 'ng' 却下 を持つ */\n  ST.apSt = apList().map(function(){ return ''; });\n  ST.apWhy = {};\n  ST.apUnit = 0;\n  renderChrome();\n  if(CFG.mode === 'approve') renderAP(); else renderA();\n}\n\nwindow.__renderSwitch = function(a){ renderSwitch(a); };\nfunction go(i){\n  CFG = CFGS[i]; CUR = i;\n  var apx = document.getElementById('apx'); if(apx) apx.classList.add('hidden');\n  document.getElementById('home').classList.add('hidden');\n  document.getElementById('app').classList.remove('hidden');\n  closeAll(); init(); renderSwitch(i);\n  window.scrollTo(0,0);\n}\nfunction home(){ if(window.APX) return APX.list();\n  CUR = null; closeAll();\n  var apx = document.getElementById('apx'); if(apx) apx.classList.add('hidden');\n  document.getElementById('app').classList.add('hidden');\n  document.getElementById('home').classList.remove('hidden');\n  renderSwitch(null);\n  window.scrollTo(0,0);\n}\n\n/* ---------- 進捗の集計 ---------- */\nfunction activeTargets(){ return CFG.targets.filter(function(t){return t.active !== false;}); }\nfunction reqCount(){\n  var n=0;\n  CFG.targets.forEach(function(t,i){ if(t.active===false) return;\n    (t.tabs||[]).forEach(function(tb,j){ if(tb.req) n++; }); });\n  return n;\n}\nfunction savedCount(){\n  var n=0;\n  CFG.targets.forEach(function(t,i){ if(t.active===false) return;\n    (t.tabs||[]).forEach(function(tb,j){ if(tb.req && ST.saved[i][j]) n++; }); });\n  return n;\n}\nfunction targetSaved(i){\n  var t=CFG.targets[i], n=0, tot=0;\n  (t.tabs||[]).forEach(function(tb,j){ if(tb.req){ tot++; if(ST.saved[i][j]) n++; } });\n  return {n:n, tot:tot};\n}\nfunction confirmedCount(){\n  var n=0; CFG.targets.forEach(function(t,i){ if(t.active!==false && ST.confirmed[i]) n++; }); return n;\n}\nfunction targetReady(i){ var p=targetSaved(i); return p.tot>0 && p.n===p.tot; }\nfunction allConfirmed(){ return confirmedCount()===activeTargets().length; }\nfunction pending(){\n  var out=[];\n  CFG.targets.forEach(function(t,i){ if(t.active===false) return;\n    var miss=[], tot=0;\n    (t.tabs||[]).forEach(function(tb,j){ if(tb.req){ tot++; if(!ST.saved[i][j]) miss.push(tb.label); } });\n    if(miss.length) out.push(t.name+'（'+(miss.length===tot ? '全'+tot+'タブ未保存' : miss.join('／'))+'）');\n  });\n  return out;\n}\n\n/* ---------- ヘッダー・ステップ ---------- */\nfunction renderChrome(){\n  $('#gnav').innerHTML =\n    '<div class=\"brand\"><div class=\"mark\">ES<\/div><div><div class=\"bt\">ES STATION<\/div><\/div>'+\n    '<div class=\"bs\">運営管理システム<\/div><\/div>'+\n    '<nav class=\"gmenu\">'+\n      '<a href=\"#\">ダッシュボード<\/a>'+\n      '<a href=\"#\" class=\"on\">申請管理<\/a>'+\n      '<a href=\"#\">契約管理<\/a>'+\n      '<a href=\"#\">拠点管理<\/a>'+\n    '<\/nav>'+\n    '<div class=\"gright\"><div class=\"gu\"><span class=\"gav\">'+esc(CFG.opUser.charAt(0))+'<\/span>'+\n    '<span>'+esc(CFG.opUser)+'<\/span><span class=\"gcar\">▾<\/span><\/div><\/div>';\n}\n\n\nfunction apBranchMeta(){\n  var bl = CFG.branchList;\n  if(bl && bl.length > 1){\n    return '<span>対象拠点 <b>'+bl.length+'件<\/b> <span class=\"mm\">'+esc(bl.join('／'))+'<\/span><\/span>';\n  }\n  return '<span>拠点 <b>'+esc(CFG.branchName || (bl && bl[0]) || '')+'<\/b><\/span>';\n}\n\n\n/* ================= 2026/09/29：デザインシステム（ES Kitchen）に合わせた描画 =================\n   ・ボタンはページヘッダーの右（画面下の固定バーは使わない）　・ステッパーは使わず、状態は見出しの Badge\n   ・タブは横の下線タブ（6個まで。拠点の基本情報・請求・資料は「拠点」タブにまとめる）\n   ・モーダルは Modal（小さい確認）／Dialog（表・フォーム）　・参照のみの権限では欄は読み取り専用・操作ボタンは隠す */\nvar TAB_LABEL = {corp:'法人', br:'拠点', ct:'親契約', mc:'子契約', eq:'設備・オプション', fee:'料金・請求', sw:'お試しの終了'};\nfunction mergeTabs(t){\n  if(t._merged || CFG.mode==='approve' || !t.tabs) return; t._merged = true;\n  var get = function(k){ return t.tabs.filter(function(x){ return x.key===k; })[0]; };\n  var br = get('br'), bill = get('bill'), at = get('at');\n  if(br){\n    if(bill){ br.blocks = br.blocks.concat(bill.blocks); }\n    if(at){ br.blocks = br.blocks.concat([{b:'h',text:'資料'}]).concat(at.blocks.filter(function(b){ return b.b!=='note'; })); }\n    t.tabs = t.tabs.filter(function(x){ return x!==bill && x!==at; });\n  }\n  t.tabs.forEach(function(tb){ if(TAB_LABEL[tb.key]) tb.label = TAB_LABEL[tb.key]; });\n}\n/* 札（Badge）の色を DS の決まりにそろえる：文言で決め、決まらなければ元の色から */\nvar BADGE_TXT = [[/仮登録|予定|自動公開|設定中|契約設定中|一部処理済み|一部承認/, 'info'], [/本登録|正式登録|有効|公開|確定済み|承認済み|完了|発行済|ログイン済|自動生成|確認済み/, 'success'],\n                 [/休止中|要確認|受付中|承認待ち|未保存/, 'warning'], [/解約済|満了|非公開|削除済|取り下げ済み|対象外|未発行|—/, 'neutral'], [/解約|エラー|却下|停止中|超過/, 'negative']];\nvar BADGE_CLS = {blue:'primary', pur:'primary', org:'warning', grn:'success', amb:'warning', red:'negative', mut:'neutral', teal:'info', ind:'info'};\nfunction fixBadges(root){\n  [].forEach.call((root||document).querySelectorAll('span.bg'), function(el){\n    var tx = el.textContent, tone = null;\n    for(var k=0;k<BADGE_TXT.length;k++){ if(BADGE_TXT[k][0].test(tx)){ tone = BADGE_TXT[k][1]; break; } }\n    if(!tone){ var c = el.className.split(/\\s+/).filter(function(x){ return BADGE_CLS[x]; })[0]; tone = c ? BADGE_CLS[c] : 'neutral'; }\n    el.className = 'es-badge es-badge--'+tone;\n  });\n}\nwindow.__fixBadges = fixBadges;\nfunction phaseStatus(){\n  if(ST.phase==='A') return {t:'受付中', tone:'warning'};\n  return allConfirmed() ? {t:'完了', tone:'success'} : {t:'契約設定中', tone:'info'};\n}\nfunction renderSteps(){ var el = $('#steps'); if(el){ el.innerHTML = ''; el.style.display = 'none'; } }\nfunction renderPageHead(){\n  var st = phaseStatus(), acts = '';\n  if(!VIEW()){\n    if(ST.phase==='A'){\n      acts = (window.APX&&APX.intakeReject&&CFG.apNo ? DSX.btn('却下',{variant:'outline',tone:'negative',on:\"APX.intakeReject('\"+CFG.apNo+\"')\"}) : '')+\n             DSX.btn(CFG.mainBtn,{id:'btnMain',on:'DEMO.openB()'});\n    } else {\n      acts = DSX.btn(ST.acct?'アカウント再送':(CFG.acctBtnLabel||'アカウント発行'),{variant:'outline',icon:'EnvelopeSimple',\n               on:\"DEMO.toast('\"+(ST.acct?'ログイン案内メールを再送しました':'アカウントを発行しました（デモ）')+\"')\"});\n      /* 2026/09/29：詳細情報設定のタブは「参照 → 編集 → 保存／キャンセル」（DS の CrudPattern）。自動保存のタブと確定済みの拠点には置かない */\n      var tbx = CFG.targets[ST.target] && CFG.targets[ST.target].tabs[ST.tab];\n      if(!ST.confirmed[ST.target] && tbx && !tbx.auto){\n        acts += ST.edit==='D' ? DSX.btn('キャンセル',{variant:'outline',id:'btnCancel',on:'DEMO.cancelEdit()'})+DSX.btn('保存',{id:'btnSave',on:'DEMO.save()'})\n                              : DSX.btn('編集',{id:'btnEdit',icon:'PencilSimple',on:'DEMO.edit()'});\n      }\n      if(allConfirmed() && ST.edit!=='D') acts += DSX.btn('申請完了の内容を確認',{id:'btnDone',on:'DEMO.openAllDone()'});\n    }\n  }\n  $('#phead').innerHTML = DSX.pagehead({crumb:[{t:'申請管理',on:'DEMO.gList()'},{t:'契約申請管理',on:'DEMO.gList()'},'申請詳細'],\n    title:'申請詳細', id:CFG.apNo, badge:DSX.badge(st.tone, st.t), actions:acts});\n}\n/* 申請情報（読み取り専用の欄） */\nfunction infoCard(){\n  var f = DSX.ro('申請日', esc(CFG.apDate)) + (CFG.summary||[]).map(function(x){ return DSX.ro(x.l, x.v); }).join('');\n  return '<div class=\"card\"><h2>申請情報<\/h2><div class=\"pad\"><div class=\"es-formgrid\">'+f+'<\/div><\/div><\/div>';\n}\n/* 共通情報（以前は右の欄）：申込担当者の表＋法人情報 */\nfunction commonCard(){\n  var s = CFG.side, h = '';\n  h += '<div class=\"secttl\">申込担当者<\/div>'+DSX.table(['氏名','部署','担当区分','メールアドレス','電話番号'],\n    s.contacts.map(function(c){ return '<tr><td><b>'+esc(c.name)+'<\/b>'+(c.main?' '+DSX.badge('primary','メイン'):'')+'<\/td><td>'+esc(c.dept)+'<\/td><td>'+esc(c.role)+'<\/td><td>'+esc(c.mail)+'<\/td><td>'+esc(c.tel)+'<\/td><\/tr>'; }).join(''));\n  h += '<div class=\"secttl\">法人情報 '+DSX.badge('neutral', s.company.existing?'既存の法人':'新規の法人')+'<\/div>';\n  if(s.company.none) h += DSX.inline('info','法人情報なし');\n  else h += '<div class=\"es-formgrid\">'+s.company.rows.filter(function(r){ return !(ST.phase==='A' && !s.company.existing && /ステータス/.test(r[0])); })\n    .map(function(r){ return DSX.ro(r[0], r[1]); }).join('')+'<\/div>';\n  if(s.company.existing && s.billing) h += '<div class=\"secttl\">請求情報<\/div><div class=\"es-formgrid\">'+s.billing.map(function(r){ return DSX.ro(r[0], r[1]); }).join('')+'<\/div>';\n  if(s.extra) h += '<div class=\"secttl\">'+esc(s.extra.title)+'<\/div><div class=\"es-formgrid\">'+s.extra.rows.map(function(r){ return DSX.ro(r[0], r[1]); }).join('')+'<\/div>';\n  return '<div class=\"card\"><h2>共通情報<\/h2><div class=\"pad\">'+h+'<\/div><\/div>';\n}\nfunction renderA(){\n  ST.phase='A';\n  renderSteps(); renderPageHead();\n  /* 2026/09/29：申込内容確認もタブに分ける（DS の Tabs）。申請内容／配送の設定／開始スケジュール／共通情報 */\n  var miss = routeMissing();\n  var P = [['info','申請内容'], ['route','配送の設定'], ['sched','開始スケジュール'], ['common','共通情報']];\n  if(!(CFG.preBlocks||[]).length) P = P.filter(function(x){ return x[0]!=='sched'; }) 閉じる',{on:'DEMO.close()'})}));\n}\n/* 2026/09/29：編集できる権限でも、まず参照で見せる。「編集」で入力欄になり、「保存」「キャンセル」で参照に戻る。\n   編集中に変更があるまま別のタブ・拠点・一覧へ移ろうとしたら、破棄の確認（Modal）を出す */\nfunction roD(){ return VIEW() || (ST.phase==='D' && ST.edit!=='D'); }\nfunction roCtx(ctx){ return VIEW() || (ctx && typeof ctx.ti==='number' && ST.phase==='D' && ST.edit!=='D'); }\nfunction syncDom(){\n  [].forEach.call(document.querySelectorAll('#dscreen .vbody [id^=\"f_\"], #dscreen .vbody [id^=\"sw_\"], #dscreen .vbody [id^=\"ck_\"]'), function(el){\n    if(!/^(INPUT|SELECT|TEXTAREA)$/.test(el.tagName)) return;\n    ST.val[el.id] = el.type==='checkbox' ? el.checked : el.value; });\n}\nfunction capture(){ syncDom(); return JSON.stringify({v:ST.val, r:ST.route, i:ST.init, e:Object.keys(EB).map(function(k){ return EB[k].b.rows; })}); }\nfunction startEdit(kind){ ST.edit = kind; ST.form = null; ST.snap = null; }\nfunction snapNow(){ if(ST.edit && !ST.snap) ST.snap = capture(); }\nfunction isDirty(){ return !!(ST.edit && ST.snap && capture() !== ST.snap); }\nfunction restoreSnap(){\n  if(!ST.snap) return; var o = JSON.parse(ST.snap);\n  ST.val = o.v; ST.route = o.r; ST.init = o.i; Object.keys(EB).forEach(function(k,x){ EB[k].b.rows = o.e[x]; });\n}\nfunction endEdit(discard){ if(discard) restoreSnap(); ST.edit = null; ST.snap = null; ST.form = null; }\n/* 必須でまだ保存していないタブ・未入力の配送の設定は、開いたときから編集で始める（新規登録と同じ） */\nfunction autoEdit(){\n  if(VIEW()) return;\n  if(ST.phase==='D'){ var t = CFG.targets[ST.target], tb = t && t.tabs[ST.tab];\n    if(tb && tb.req && !tb.auto && !ST.saved[ST.target][ST.tab] && !ST.confirmed[ST.target]) startEdit('D'); }\n  else if(ST.phase==='A' && ST.atab==='route' && routeMissing()) startEdit('A');\n}\nfunction guard(go, cl){\n  if(!ST.edit){ go(); return; }\n  if(!isDirty()){ endEdit(false); go(); return; }\n  ST.pend = go;\n  var o = document.getElementById('ovX');\n  if(!o){ o = document.createElement('div'); o.className = 'ov'; o.id = 'ovX'; document.body.appendChild(o); }\n  dlgOpen('ovX', DS v>'+\n      '<div class=\"rtsum\">'+routeSum(i)+'<\/div>'+initSetRow(i)+'<\/div>';\n  }).join('');\n  var tl = CFG.trialTimeline ? '<div class=\"rttl\"><b>お試しのタイムライン<\/b>　'+CFG.trialTimeline+'<\/div>' : '';\n  return any ? '<div class=\"card\" id=\"rtcard\"><h2>配送の設定（倉庫・配送回数・資材の初期セット）<span class=\"r\">'+\n    DSX.btn('キャンセル',{variant:'outline',size:'sm',id:'rtCancel',on:'DEMO.cancelEdit()'})+DSX.btn('保存',{size:'sm',id:'rtSave',on:'DEMO.rtSave()'})+'<\/span><\/h2><div class=\"pad\">'+tl+h+'<\/div><\/div>' : '';\n}\n/* 2026/09/29：資材の初期セット（無料）の配送は申込内容確認で決める。中身は資材マスタの商品（初期セットの定義は要確認）。倉庫は資材配送の倉庫 */\nfunction initSetRow(i){\n  var mat = (ST.route[i]||[]).filter(rtIsMat)[0], v = (ST.init||{})[i] || '';\n  return '<div class=\"initset\"><b>資材の初期セット<\/b><span class=\"bg grn\">無料<\/span>'+\n    '<label>納品日<span class=\"rq\">必須<\/span><input type=\"date\" data-init=\"'+i+'\" value=\"'+esc(v)+'\" onchange=\"DEMO.initDate(this)\"><\/label>'+\n    '<span class=\"mm\">倉庫 '+esc(mat && mat.wh ? mat.wh : '（資材配送の倉庫を選ぶ）')+' ／ 中身：資材マスタの初期セットの商品<\/span><\/div>';\n}\n/* 申込内容確認で入れるもの（倉庫・資材の初期セットの納品日）の未入力の数（タブを開いていなくても数える） */\nfunction routeMissing(){\n  var n = 0;\n  CFG.targets.forEach(function(t,i){ var rs = ST.route[i]; if(t.active===false || !rs || !rs.length) return;\n    rs.forEach(function(r){ if(rtOn(r) && !r.wh) n++; }); if(!((ST.init||{})[i])) n++; });\n  return n;\n}\nfunction routeAOK(){\n  if(routeMissing() && (ST.atab!=='route' || ST.edit!=='A')){ ST.atab = 'route'; if(!VIEW() && ST.edit!=='A'){ startEdit('A'); } renderA(); }\n  var bad = [];\n  [].forEach.call(document.querySelectorAll('#rtcard [data-rt][data-req]'), function(el){\n    var miss = !String(el.value).trim(); el.classList.toggle('bad', miss); if(miss) bad.push(el); });\n  [].forEach.call(document.querySelectorAll('#rtcard [data-init]'), function(el){ var miss = !el.value; el.classList.toggle('bad', miss); if(miss) bad.push(el); });\n  if(bad.length){ bad[0].scrollIntoView({behavior:'smooth',block:'center'}); toast('倉庫・資材の初期セットの納品日が未設定です（'+bad.length+'件）'); return false; }\n  if(ST.edit==='A'){ endEdit(false); renderA(); }   /* 入力がそろっていれば、編集中の配送の設定はそのまま保存して進む */\n  return true;\n}\nfunction redrawA(){ var y = window.scrollY; renderA(); window.scrollTo(0,y); }\n\n/* ================= A画面 ================= */\n\nfunction targetMatrix(){\n  var ts = CFG.targets.filter(function(t){ return t.active !== false; });\n  if(!ts.length) return '<div class=\"note mut\" style=\"margin:0\">対象の拠点がありません。<\/div>';\n  /* 区分と項目は全拠点の合併（拠点によって持っている区分が違うことがある） */\n  var base = [], byTitle = {};\n  ts.forEach(function(t){\n    (t.sections||[]).forEach(function(sec){\n      var e = byTitle[sec.title];\n      if(!e){ e = byTitle[sec.title] = {title:sec.title, kv:[], seen:{}}; base.push(e); }\n      (sec.kv||[]).forEach(function(pair){\n        if(!e.seen[pair[0]]){ e.seen[pair[0]] = 1; e.kv.push(pair); }\n      });\n    });\n  });\n  var head = '<tr><th class=\"hd\">項目<\/th>'+ts.map(function(t,i){\n    var bgs = (t.badges||[]).slice(0,1).map(function(b){return '<span class=\"bg '+b.c+'\">'+esc(b.t)+'<\/span>';}).join(' ');\n    return '<th><div class=\"cn\">'+esc(t.no)+'<\/div><div class=\"ct\">'+esc(t.name)+'<\/div>'+\n      (t.applyDate?'<div class=\"cs\">'+esc(t.applyLabel||'適用日')+' <b>'+esc(t.applyDate)+'<\/b><\/div>':'')+\n      (bgs?'<div class=\"cs\">'+bgs+'<\/div>':'')+'<\/th>';\n  }).join('')+'<\/tr>';\n\n  var body = base.map(function(sec){\n    var rows = '<tr class=\"sec\"><th class=\"hd\" colspan=\"'+(ts.length+1)+'\">'+esc(sec.title)+'<\/th><\/tr>';\n    rows += (sec.kv||[]).map(function(pair){\n      var key = pair[0];\n      var vals = ts.map(function(t){\n        var hit = '';\n        (t.sections||[]).forEach(function(s2){\n          if(s2.title !== sec.title) return;\n          (s2.kv||[]).forEach(function(p2){ if(p2[0]===key) hit = p2[1]; });\n        });\n        return hit;\n      });\n      var diff = false;\n      vals.forEach(function(x){ if(x !== vals[0]) diff = true; });\n      return '<tr'+(diff&&ts.length>1?' class=\"dx\"':'')+'><th class=\"hd\">'+esc(key)+\n'<\/th>'+\n        vals.map(function(x){\n          return '<td>'+(x==null||x===''?'<span class=\"unset\">—<\/span>':feeNote(sec.title,x))+'<\/td>';\n        }).join('')+'<\/tr>';\n    }).join('');\n    return rows;\n  }).join('');\n\n  return '<div class=\"scrollx\"><table class=\"t mx\"><thead>'+head+'<\/thead><tbody>'+body+'<\/tbody><\/table><\/div>';\n}\n\n/* 申込内容の「設備」には機種マスタの料金（税抜）を添える */\nfunction feeNote(title, x){\n  if(!/^設備/.test(title)) return x;\n  var out = [], seen = {};\n  String(x).replace(/(RF|FZ|MW|BX|VM)\\d{6}/g, function(id){ if(seen[id]) return id; seen[id]=1;\n    var md = MD_MODELS.filter(function(m){ return m.id===id; })[0];\n    if(md) out.push('月額 '+yenS(md.m)+(md.init?' ・ 初期 '+yenS(md.init):'')); return id; });\n  return out.length ? x+'<div class=\"feen\">'+out.join('／')+'（税抜）<\/div>' : x;\n}\nfunction accItem(t,i){\n  var open = ST.accOpen[i];\n  var line = (t.line||[]).map(function(x){return esc(x);}).join(' <i>｜<\/i> ');\n  var bgs = (t.badges||[]).map(function(b){return '<span class=\"bg '+b.c+'\">'+esc(b.t)+'<\/span>';}).join(' ');\n  return '<div class=\"accit'+(open?' open':'')+'\" id=\"acc'+i+'\">'+\n    '<div class=\"acch\" onclick=\"DEMO.acc('+i+')\">'+\n      '<span class=\"cno\">'+esc(t.no)+'<\/span>'+\n      '<span class=\"bn\">'+esc(t.name)+'<\/span>'+\n      '<span class=\"ln\">'+line+'<\/span>'+ bgs +\n      '<span class=\"more\">'+(open?'閉じる ▲':'登録内容をすべて見る ▼')+'<\/span>'+\n    '<\/div>'+\n    '<div class=\"accb\">'+\n      blocks(t.panels, {ti:i,tb:'a'})+\n      (t.sections||[]).map(function(s){\n        return '<div class=\"secttl\">'+esc(s.title)+'<\/div>'+kv(s.kv);\n      }).join('')+\n    '<\/div><\/div>';\n}\n\n\n/* ================= 承認モード ================= */\n/* 2026/09/23 決定 1B：1申請に複数の拠点が入り、承認は拠点ごとに行う。\n   申請のステータスは 全拠点承認＝承認済み／一部だけ＝一部承認／全部却下＝却下。\n   データは「申請」＋「申請明細（拠点）」の2階層で、明細に承認ステータス・承認日時・承認者を持つ想定。 */\nfunction apList(){\n  if(CFG.mode !== 'approve') return [];\n  if(CFG.branchList && CFG.branchList.length) return CFG.branchList;\n  return [CFG.branchName || '—'];\n}\nfunction apCount(v){ var n=0; (ST.apSt||[]).forEach(function(x){ if(x===v) n++; }); return n; }\nfunction apDone(){ return apCount('ok') + apCount('ng') === apList().length; }\nfunction apState(){\n  var ok = apCount('ok'), ng = apCount('ng'), n = apList().length;\n  if(ok+ng < n) return {t: (ok+ng>0 ? '一部処理済み' : '承認待ち'), c: (ok+ng>0 ? 'blue' : 'amb')};\n  if(ok === n) return {t:'✓ 承認済み', c:'grn'};\n  if(ng === n) return {t:'却下', c:'red'};\n  return {t:'一部承認', c:'blue'};\n}\n/* 拠点ごとの承認カード。内容のカードは preBlocks 側にあり、ここは判断だけを行う */\n/* 2026/09/28 追補 28-27：オーダー締切までの残り日数を出す。締切後に承認すると開始月を自動で1つ後ろに直す。\n   締切日は申請内容の「締切は <b>yyyy/mm/dd<\/b>」から読む。デモの「今日」は申請日の2日後 */\nfunction apDeadline(){\n  var html = JSON.stringify(CFG.preBlocks||[]);\n  var m = html.match(/締切は <b>(\\d{4})\\/(\\d{2})\\/(\\d{2})<\\/b>/);\n  var a = String(CFG.apDate||'').match(/(\\d{4})年(\\d{1,2})月(\\d{1,2})日/);\n  if(!m || !a) return '';\n  var close = new Date(+m[1], +m[2]-1, +m[3]);\n  var today = new Date(+a[1], +a[2]-1, +a[3]+2);\n  var d = Math.round((close - today)/86400000);\n  var ymd = function(x){ return x.getFullYear()+'/'+('0'+(x.getMonth()+1)).slice(-2)+'/'+('0'+x.getDate()).slice(-2); };\n  var rule = '締切後はそのサイクルを変えられないため、<b>締切を過ぎてから承認すると開始サイクル月を自動で1つ後ろに直し<\/b>、お客様へのお知らせにも書きます（決定 v2.3 追補 28-27）。';\n  if(d >= 0){\n    return '<div class=\"note '+(d<=3?'warn':'info')+'\"><b>オーダー締切 '+ymd(close)+' まで あと '+d+'日<\/b>'+\n      '<span class=\"mm\">（デモの今日 '+ymd(today)+'）<\/span>　'+rule+'<\/div>';\n  }\n  return '<div class=\"note dang\"><b>オーダー締切 '+ymd(close)+' を '+(-d)+'日 過ぎています。<\/b>'+\n    '承認すると、開始サイクル月を1つ後ろに直します。　'+rule+'<\/div>';\n}\nfunction apBoard(){\n  var list = apList(), sum = CFG.apSummary || [];\n  var rows = list.map(function(nm, i){\n    var st = ST.apSt[i] || '', s2 = sum[i] || {};\n    var badge = st==='ok' ? '<span class=\"bg grn\">✓ 承認済み<\/span>'\n              : st==='ng' ? '<span class=\"bg red\">却下<\/span>'+((ST.apWhy||{})[i]?'<div class=\"mm\">'+esc(ST.apWhy[i])+'<\/div>':'')\n              : '<span class=\"bg amb\">承認待ち<\/span>';\n    var btns = st\n      ? '<button class=\"btn sm\" onclick=\"DEMO.apUndo('+i+')\">やり直す<\/button>'\n      : '<button class=\"btn sm\" onclick=\"DEMO.apReject('+i+')\">却下<\/button>'+\n        '<button class=\"btn sm '+(CFG.btnCls||'pri')+'\" onclick=\"DEMO.apApprove('+i+')\">'+\n        'この拠点を承認<\/button>';\n    return '<tr class=\"'+(st==='ng'?'off':(st==='ok'?'':'hi'))+'\">'+\n      '<td><b>'+esc(nm)+'<\/b>'+(s2.id?'<div class=\"mm\">'+s2.id+'<\/div>':'')+'<\/td>'+\n      '<td>'+(s2.head||'<span class=\"mut\">—<\/span>')+'<\/td>'+\n      '<td class=\"r\">'+(s2.amount||'—')+'<\/td>'+\n      '<td class=\"c\">'+badge+'<\/td>'+\n      '<td class=\"r\"><div class=\"fr\" style=\"justify-content:flex-end\">'+btns+'<\/div><\/td><\/tr>';\n  }).join('');\n  var st = apState();\n  return '<div class=\"card acc\" id=\"apboard\"><h2>拠点ごとの承認<span class=\"sub\">承認の単位は拠点。1申請に複数の拠点が入る<\/span>'+\n    '<span class=\"r\"><span class=\"bg '+st.c+'\">'+esc(st.t)+'<\/span><\/span><\/h2><div class=\"pad\">'+\n    '<div class=\"note info\" style=\"margin-top:0\"><b>拠点ごとに承認・却下します。<\/b>'+\n    '1つの拠点が保留でも、ほかの拠点はそのまま進められます。'+\n    'お客様へのお知らせも<b>拠点ごと<\/b>にお送りします。'+\n    '申請全体のステータスは、全拠点が承認済みなら<b>承認済み<\/b>、一部だけなら<b>一部承認<\/b>になります。<\/div>'+\n    apDeadline()+\n    '<div class=\"scrollx\"><table class=\"t\"><thead><tr><th>拠点<\/th><th>変更の内容<\/th>'+\n    '<th class=\"r\">月額への影響<\/th><th class=\"c\">承認<\/th><th class=\"r\">操作<\/th><\/tr><\/thead><tbody>'+\n    rows+'<\/tbody><\/table><\/div>'+\n    '<div class=\"note mut\">処理済み <b>'+(apCount('ok')+apCount('ng'))+'<\/b> ／ '+apList().length+' 拠点'+\n    '（承認 '+apCount('ok')+'・却下 '+apCount('ng')+'）<\/div>'+\n    (CFG.apBoardNote ? '<div class=\"note warn\">'+CFG.apBoardNote+'<\/div>' : '')+\n    '<\/div><\/div>';\n}\nfunction renderAP(){\n  renderSteps(); renderPageHead();\n  $('#dscreen').classList.add('hidden');\n  $('#ascreen').classList.remove('hidden');\n  var st = apState();\n  $('#main').innerHTML = blocks(CFG.preBlocks, {ti:'ap',tb:'a'}) + apBoard() +\n    (apDone() ? '<div class=\"dbanner\"><span class=\"ico\">✓<\/span>'+esc(st.t)+'（'+apCount('ok')+' ／ '+apList().length+' 拠点を承認）'+\n      '<button class=\"btn sm grn\" style=\"margin-left:auto\" onclick=\"DEMO.openAPC()\">承認結果をもう一度見る<\/button><\/div>' : '');\n  $('#side').innerHTML = sidePanel();\n  $('#foot').innerHTML = '<div class=\"ffin\"><div class=\"fnote\">'+CFG.footNote+'<\/div><div class=\"fr\">'+\n    (apDone()\n      ? '<span class=\"bg '+st.c+'\">'+esc(st.t)+'<\/span>'\n      : '<span class=\"bg mut\">処理済み '+(apCount('ok')+apCount('ng'))+' ／ '+apList().length+' 拠点<\/span>'+\n        '<button class=\"btn\" onclick=\"DEMO.jumpBoard()\">拠点ごとの承認へ <span class=\"ico\">↓<\/span><\/button>')+\n    '<\/div><\/div>';\n}\nfunction jumpBoard(){\n  var el = document.getElementById('apboard');\n  if(el) el.scrollIntoView({behavior:'smooth', block:'center'});\n}\nfunction apApprove(i){ ST.apUnit = i; openAPB(); }\n/* 2026/09/28 決定 28-25：却下は理由が必須。法人へ拠点ごとに理由つきでお知らせする（差戻しは作らない） */\nvar REJECT_REASONS = ['申請内容に不備がある','オーダー締切に間に合わない','設備・在庫の手配ができない',\n                      '配送エリア・配送ルートの都合で対応できない','契約条件（最低利用期間など）に合わない','その他（下に詳しく書く）'];\nfunction apReject(i){\n  var nm = apList()[i];\n  var h = '<div class=\"mdl\"><div class=\"mhead\"><div class=\"mico dang\">!<\/div>'+\n    '<h3>'+esc(nm)+' の申請を却下しますか？<\/h3>'+\n    '<p class=\"mdesc\">却下の理由は<b>必須<\/b>です。法人へ<b>この拠点の却下のお知らせ<\/b>を、理由の定型文をつけて送ります。'+\n    '差戻しはできないので、お客様には内容を直して申請し直していただきます。<\/p><\/div><div class=\"mbody\">'+\n    '<div class=\"fld\" id=\"rjW\"><div class=\"fl\">却下の理由<span class=\"rq\">必須<\/span><\/div>'+\n    '<select id=\"rjWhy\" onchange=\"DEMO.clr(this)\"><option value=\"\">選択してください<\/option>'+\n    REJECT_REASONS.map(function(r){ return '<option value=\"'+esc(r)+'\">'+esc(r)+'<\/option>'; }).join('')+'<\/select>'+\n    '<div class=\"er\">却下の理由を選んでください。<\/div><\/div>'+\n    '<div class=\"fld\" id=\"rjNoteW\" style=\"margin-top:10px\"><div class=\"fl\">お客様へのひとこと（任意・お知らせに載ります）<\/div>'+\n    '<textarea id=\"rjNote\" placeholder=\"例）設置場所の寸法を確認のうえ、あらためてお申し込みください。\"><\/textarea><\/div>'+\n    '<\/div><div class=\"mfoot\"><button class=\"btn\" onclick=\"DEMO.close()\">キャンセル<\/button>'+\n    '<button class=\"btn red\" onclick=\"DEMO.doReject('+i+')\">却下してお知らせを送る<\/button><\/div><\/div>';\n  document.getElementById('ovB').innerHTML = h;\n  document.getElementById('ovB').classList.add('on');\n}\nfunction doReject(i){\n  var why = document.getElementById('rjWhy').value;\n  if(!why){ document.getElementById('rjW').classList.add('bad'); return; }\n  ST.apWhy = ST.apWhy || {};\n  ST.apWhy[i] = why;\n  ST.apSt[i] = 'ng';\n  closeAll();\n  toast(apList()[i]+' を却下しました。法人へ却下のお知らせ（理由：'+why+'）を送ります');\n  renderAP();\n  if(apDone()) openAPC();\n}\nfunction apUndo(i){ ST.apSt[i] = ''; renderAP(); }\n\nfunction openAPB(){\n  var m = CFG.modalB, i = ST.apUnit||0, nm = apList()[i], s2 = (CFG.apSummary||[])[i] || {};\n  var multi = apList().length > 1;\n  var h = '<div class=\"mdl wide\"><div class=\"mhead\"><div class=\"mico '+(m.ico||'q')+'\">'+(m.ico==='dang'?'!':'?')+'<\/div>'+\n    '<h3>'+esc(m.title)+(multi?'　<span class=\"bg blue\">'+esc(nm)+'<\/span>':'')+'<\/h3>'+\n    '<p class=\"mdesc\">'+(multi?'<b>'+esc(nm)+'<\/b> だけを承認します。ほかの拠点は別に承認してください。<br>':'')+m.desc+'<\/p><\/div><div class=\"mbody\">'+\n    (multi&&s2.head?'<div class=\"note info\" style=\"margin-top:0\"><b>'+esc(nm)+' の変更<\/b>　'+s2.head+\n      (s2.amount?'　月額への影響 <b>'+s2.amount+'<\/b>':'')+'<\/div>':'')+\n    (m.counts?'<div class=\"cnt\">'+m.counts.map(function(c){\n      return '<div class=\"ci '+(c.cls||'')+'\"><div class=\"cl\">'+esc(c.l)+'<\/div><div class=\"cvv\"'+\n        (String(c.v).length>6?' style=\"font-size:15px\"':'')+'>'+esc(c.v)+\n        '<span class=\"cu\">'+esc(c.u===undefined?'件':c.u)+'<\/span><\/div><\/div>';\n    }).join('')+'<\/div>':'')+\n    (m.notes&&m.notes.length?'<div class=\"note '+(m.noteTone||'dang')+'\"><b>承認すると次のことが起きます<\/b><ul>'+\n      m.notes.map(function(n){return '<li>'+n+'<\/li>';}).join('')+'<\/ul><\/div>':'')+\n    blocks(m.extra,{ti:'m',tb:'b'})+\n    (m.confirm?'<div class=\"chkbox\" id=\"cfBox\"><label><input type=\"checkbox\" id=\"cfChk\" onchange=\"DEMO.cfToggle(this)\">'+\n      '<span>'+m.confirm.label+'<\/span><\/label>'+(m.confirm.hint?'<div class=\"hint\">'+m.confirm.hint+'<\/div>':'')+'<\/div>'+\n      '<div class=\"er\" id=\"cfErr\" style=\"display:none;font-size:12px;color:#C02339;font-weight:700\">'+\n      esc(m.confirm.err||'確認にチェックを入れてください。')+'<\/div>':'')+\n    '<\/div><div class=\"mfoot\"><button class=\"btn\" onclick=\"DEMO.close()\">キャンセル<\/button>'+\n    '<button class=\"btn '+(m.btnCls||'pri')+'\" onclick=\"DEMO.doAPB()\">'+esc(m.btn)+'<\/button><\/div><\/div>';\n  document.getElementById('ovB').innerHTML = h;\n  document.getElementById('ovB').classList.add('on');\n}\n\nfunction doAPB(){\n  var m = CFG.modalB;\n  if(m.confirm){\n    var c = document.getElementById('cfChk');\n    if(!c.checked){ document.getElementById('cfBox').classList.add('err');\n      document.getElementById('cfErr').style.display='block'; return; }\n  }\n  ST.apSt[ST.apUnit||0] = 'ok';\n  ST.approved = apDone();\n  closeAll(); renderAP();\n  if(apDone()) openAPC();\n}\n\nfunction openAPC(){\n  var m = CFG.modalC;\n  var h = '<div class=\"mdl wide\"><div class=\"mhead\"><div class=\"mico ok\">✓<\/div>'+\n    '<h3>'+esc(m.title)+'<\/h3><p class=\"mdesc\">'+m.desc+'<\/p><\/div><div class=\"mbody\">'+\n    '<div class=\"scrollx\"><table class=\"t\"><thead><tr><th>対象<\/th><th>名称<\/th><th>承認前<\/th><th>承認後<\/th><\/tr><\/thead><tbody>'+\n    m.rows.map(function(r){\n      return '<tr><td>'+esc(r[0])+'<\/td><td><b>'+esc(r[1])+'<\/b><\/td>'+\n        '<td><span class=\"bg mut\">'+esc(r[2])+'<\/span><\/td>'+\n        '<td><span class=\"bg '+(r[4]||'grn')+' ==el && id!=='ovC') closeAll(); });\n  });\n}\nfunction closeAll(){ ['ovB','ovC','ovE','ovF','ovX'].forEach(function(id){ var o = document.getElementById(id); if(o) o.classList.remove('on'); }); }\n\n\nfunction doB(){\n  var m = CFG.modalB;\n  if(m.check){ var ac=document.getElementById('acctChk'); if(ac) ST.acct = ac.checked; }\n  if(m.confirm){\n    var c = document.getElementById('cfChk');\n    if(!c.checked){ document.getElementById('cfBox').classList.add('err');\n      document.getElementById('cfErr').style.display='block'; return; }\n  }\n  closeAll(); openC();\n}\n\n/* 2026/09/29：申込内容確認を終えてアカウントを発行すると、オーダーができる。資材のオーダー（初期セット）は自動で作る。\n   お試しは、全部の商品を受け取れるよう個数を割合で自動計算したオーダーを作る（法人は編集できない・運営が微調整できる） */\nfunction orderRows(){\n  if(CFG.mode==='approve' || !CFG.orderMode) return '';\n  var trial = CFG.orderMode==='trial';\n  return activeTargets().map(function(t){\n    var o = trial\n      ? '<tr><td>オーダー<\/td><td><b>'+esc(t.name)+'（お試し）<\/b><\/td><td><span class=\"bg grn\">自動生成<\/span> <span class=\"mm\">個数は割合で自動計算・法人は編集不可<\/span><\/td><td><span class=\"idc\">—<\/span><\/td><\/tr>'\n      : '<tr><td>オーダー<\/td><td><b>'+esc(t.name)+'（最初のサイクル）<\/b><\/td><td><span class=\"bg '+(ST.acct?'grn':'mut')+'\">'+(ST.acct||CFG.side.company.existing?'法人がオーダーできる':'アカウント発行後にオーダーできる（未入力なら締切で標準数量）')+'<\/span><\/td><td><span class=\"idc\">—<\/span><\/td><\/tr>';\n    var ti = CFG.targets.indexOf(t), d = (ST.init||{})[ti];\n    return o + '<tr><td>資材オーダー<\/td><td><b>'+esc(t.name)+'（初期セット・無料）<\/b><\/td><td><span class=\"bg grn\">自動生成<\/span>'+(d?' <span class=\"mm\">納品日 '+esc(d.replace(/-/g,'/'))+'<\/span>':'')+'<\/td><td><span class=\"idc\">—<\/span><\/td><\/tr>';\n  }).join('');\n}\n\n\n\n\n/* ================= 保存とバリデーション ================= */\nfunction save(){\n  if(ST.confirmed[ST.target]){ toast('この拠点は確定済みのため編集できません'); return; }\n  var t = CFG.targets[ST.target], tb = t.tabs[ST.tab];\n  var bad = [], first = null;\n  // 必須フィールド\n  (tb.blocks||[]).forEach(function(b){\n    if(b.b===' (){ if(ST.phase==='A' && CFG.mode!=='approve' && !routeAOK()) return; openB(); }, doB: doB,\n  /* 配送ルートの変更はその場で反映（ほかの入力欄を消さないよう、配送ルートの表だけ描き直す） */\n  rt: function(el){ var p=el.dataset.rt.split(','), i=+p[0], r=ST.route[i][+p[1]], f=p[2], v=el.value;\n    if(ST.phase==='D' && (f==='wh'||f==='cnt')){ ST.rtWarn = ST.rtWarn || {}; ST.rtWarn[i] = true; if(f==='wh'){ r.wh=v; routeRedraw(i); return; } }\n    if(/^s\\d+$/.test(f)){ r.slots[+f.slice(1)]=v; if(v) el.classList.remove('bad'); return; }\n    if(f==='cnt'){ r.cnt=+v; r.slots=r.slots.slice(0,r.cnt); }\n    else if(f==='pat'){ r.pat=v; r.slots=[]; }\n    else if(f==='via'){ r.via=v; if(!v) r.c2=''; }\n    else { r[f]=v; if(v) el.classList.remove('bad'); return; }\n    if(ST.phase==='A'){ redrawA(); return; }\n    routeRedraw(i); },\n  initDate: function(el){ ST.init = ST.init || {}; ST.init[+el.dataset.init] = el.value; el.classList.toggle('bad', !el.value); },\n  rtDefA: function(i){ var t=CFG.targets[i]; (t._rdef||[]).map(rtParse).forEach(function(d,k){ var r=ST.route[i][k]; if(r && rtOn(r)) r.wh = d.wh || r.wh; }); redrawA(); toast(t.name+' に既定の倉庫を入れました'); },\n  rtSlot: function(i,k,code){ var r=ST.route[i][k], a=r.slots.filter(Boolean), x=a.indexOf(code);\n    if(x>=0) a.splice(x,1); else if(a.length<r.cnt) a.push(code); else { toast('配送回数（'+r.cnt+'回）の分まで選べます'); return; }\n    a.sort(function(p,q){ return RT_ORDER[p]-RT_ORDER[q]; }); r.slots=a; routeRedraw(i); },\n  rtDef: function(i){ var t=CFG.targets[i], cur=ST.route[i]; ST.route[i]=(t._rdef||[]).map(rtParse).map(function(d,k){ var c=cur[k]||{}; d.wh=c.wh; d.cnt=c.cnt; d.slots=d.slots.slice(0, d.cnt||0); return d; }); routeRedraw(i); toast(t.name+' にエリアの既定値を入れました'); },\n  atab: function(k){ if(k===ST.atab) return; guard(function(){ ST.atab = k; autoEdit(); renderA(); window.scrollTo(0,0); }); },\n  edit: function(){ if(VIEW()) return; startEdit(ST.phase==='A'?'A':'D'); if(ST.phase==='A') renderA(); else renderD(); },\n  cancelEdit: function(){ var re = function(){ if(ST.phase==='A') renderA(); else renderD(); };\n    if(isDirty()){ guard(re, '破棄する'); return; }\n    endEdit(false); re(); },\n  rtSave: function(){ var bad = [];\n    [].forEach.call(document.querySelectorAll('#rtcard [data-rt][data-req]'), function(el){ var m = !String(el.value).trim(); el.classList.toggle('bad', m); if(m) bad.push(el); });\n    [].forEach.call(document.querySelectorAll('#rtcard [data-init]'), function(el){ var m = !el.value; el.classList.toggle('bad', m); if(m) bad.push(el); });\n    if(bad.length){ bad[0].scrollIntoView({behavior:'smooth',block:'center'}); toast('倉庫・資材の初期セットの納品日が未設定です（'+bad.length+'件）'); return; }\n    endEdit(false); renderA(); toast('配送の設定を保存しました'); },\n  xOk: function(){ var go = ST.pend; ST.pend = null; closeAll(); endEdit(true); if(go) go(); },\n  xCancel: function(){ ST.pend = null; closeAll(); },\n  gList: function(){ guard(function(){ APX.list(); }); },\n  toD: function(){ closeAll(); endEdit(false); ST.target = CFG.targets.findIndex(function(t){return t.active!==false;}); ST.tab=firstOpen(ST.target); ST.phase='D'; autoEdit(); renderD(); },\n  openE: function(){ guard(openE); },\n  confirmAt: function(i){ guard(function(){ if(i!==ST.target){ ST.target=i; ST.tab=firstOpen(i); autoEdit(); renderD(); } openE(); }); }, doE: doE, openAllDone: openAllDone, close: closeAll,\n  openAPB: openAPB, doAPB: doAPB, openAPC: openAPC,\n  apApprove: apApprove, apReject: apReject, apUndo: apUndo, jumpBoard: jumpBoard,\n  doReject: doReject,\n  pick: function(i){ if(CFG.targets[i].active===false || i===ST.target) return; guard(function(){ ST.target=i; ST.tab=firstOpen(i); autoEdit(); renderD(); }); },\n  tab: function(j){ if(j===ST.tab) return; guard(function(){ ST.tab=j; autoEdit(); renderD(); window.scrollTo(0,0); }); },\n  addRow: function(eid){ var prev=ST.form; ST.form=eid; if(prev&&prev!==eid) ebRedraw(prev); ebRedraw(eid); var f=document.getElementById('nf_k'); if(f) f.focus(); },\n  addCancel: function(eid){ ST.form=null; \n  if(ng===0) return {k:'ok', t:'承認済み', c:'grn'};\n  if(ok===0) return {k:'ng', t:'却下', c:'red'};\n  return {k:'part2', t:'一部承認', c:'blue'};\n}\nfunction brBadge(x){\n  return x.st==='ok' ? '<span class=\"bg grn\">✓ 承認済み<\/span>'\n       : x.st==='ng' ? '<span class=\"bg red\">却下<\/span>'\n       : x.st==='wd' ? '<span class=\"bg mut\">取り下げ済み<\/span>'\n       : '<span class=\"bg amb\">承認待ち<\/span>';\n}\nfunction chrome(){\n  $('#apxnav').innerHTML =\n    '<div class=\"brand\"><div class=\"mark\">ES<\/div><div><div class=\"bt\">ES STATION<\/div><\/div><div class=\"bs\">運営管理システム<\/div><\/div>'+\n    '<nav class=\"gmenu\"><a href=\"#\">ダッシュボード<\/a><a class=\"on\" onclick=\"APX.list()\">申請管理<\/a>'+\n    '<a href=\"'+ENTITY+'\" target=\"_blank\">契約管理<\/a><a href=\"'+ENTITY+'\" target=\"_blank\">拠点管理<\/a><\/nav>'+\n    '<div class=\"gright\"><div class=\"gu\"><span class=\"gav\">井<\/span><span>井上 悠<\/span><span class=\"gcar\">▾<\/span><\/div><\/div>';\n}\nfunction show(){\n  $('#home').classList.add('hidden'); $('#app').classList.add('hidden'); $('#apx').classList.remove('hidden');\n  if(window.DEMO && DEMO.close) DEMO.close();\n  if(typeof window.__renderSwitch==='function') window.__renderSwitch('list');\n  chrome(); window.scrollTo(0,0);\n}\nfunction toast(m){ if(window.DEMO && DEMO.toast) DEMO.toast(m); }\nfunction modal(h){ var o=$('#ovB'); o.innerHTML=h; o.classList.add('on'); if(window.__fixBadges) window.__fixBadges(o); }\nfunction closeM(){ ['ovB','ovC'].forEach(function(id){ var o=document.getElementById(id); if(o) o.classList.remove('on'); }); }\n\n/* =================================================================\n   申請一覧（契約申請管理）\n   2026/09/28：実画面「契約申請管理」の内容に合わせた（スタイルはこのデモのまま）。\n   タブ：新規契約／契約変更／休止・解約。新規契約の列は実画面と同じ。\n   ================================================================= */\nvar ACCT_C = {'未発行':'org','発行済':'grn','ログイン済':'blue','停止中':'red'};\nvar ST_C   = {'受付中':'org','契約設定中':'blue','完了':'grn','却下':'red','取り下げ済み':'mut'};\nvar TABS   = [['new','   var VW = D.vw || 1440;
  var st = $('stage'), w = st.clientWidth, h = st.clientHeight, s = ZOOMFIT ? Math.min(1, w/VW) : 1;
  fr.style.width = VW+'px'; fr.style.height = (h/s)+'px'; fr.style.transform = 'scale('+s+')';
  fr.style.left = Math.max(0, (w - VW*s)/2)+'px';
  $('stage').style.overflow = ZOOMFIT ? 'hidden' : 'auto';
}
window.addEventListener('resize', fit);
$('zoom').onclick = function(){ ZOOMFIT = !ZOOMFIT; this.textContent = ZOOMFIT ? t('zoomFit') : t('zoom100'); fit(); };
function boot(){
  fr.onload = function(){
    W = fr.contentWindow;
    var s = W.document.createElement('script'); s.textContent = window.KD_OVERLAY; W.document.head.appendChild(s);
    var st = W.document.createElement('style'); st.id='__kd_hide'; W.document.head.appendChild(st);
    W.__KD.live(); READY = true; $('loading').style.display='none';
    if(DEMOS){ LOADED = LOADING; LOADING = null; applyView(); if(SELNO) setTimeout(function(){ scrollCard(SELNO); }, 400); return; }
    var keep = SELNO; showView(VIEW ? VIEW.id : D.views[0].id, keep);
    if(keep) setTimeout(function(){ scrollCard(keep); }, 400);
  };
  if(DEMOS) showView(D.views[0].id); else fr.srcdoc = window.KD_DEMO;
  fit();
}
function applyView(){
  if(!VIEW) return;
  if(DEMOS && LOADED !== VIEW.id){
    if(LOADING !== VIEW.id){ LOADING = VIEW.id; READY = false; $('loading').style.display=''; fr.srcdoc = snapHtml(VIEW.id); }
    return;
  }
  if(!READY) return;
  if(!DEMOS && LOADED !== VIEW.id){ LOADED = VIEW.id; READY = false; $('loading').style.display=''; fr.srcdoc = window.KD_DEMO; return; }
  if(!DEMOS && !VIEW.__ran){ var V0 = VIEW; V0.__ran = true; $('loading').style.display=''; Promise.resolve().then(function(){ return W.eval('(async function(){'+V0.setup+'\n})()'); }).catch(function(e){ console.warn('setup', e); }).then(function(){ setTimeout(function(){ $('loading').style.display='none'; if(VIEW===V0) applyView(); V0.__ran = false; }, 150); }); return; }
  W.document.getElementById('__kd_hide').textContent = D.hideAlways.concat(VIEW.hide||[]).join(',')+'{display:none!important}'+(D.viewerCss||'');
  setTimeout(function(){
    W.__KD.set(VIEW.rows.map(function(r){ return {no:r.no, sel:r.sel, kind:r.kindKey, ja:r.ja}; }), function(no){ pick(no, false, true); });
    W.__KD.box($('boxTg').checked);
    if(SELNO) W.__KD.select(SELNO, true);
    W.scrollTo(0,0);
  }, 250);
}
$('reset').onclick = function(){ SELNO = null; LOADED = null; applyView(); renderSide(); };
$('boxTg').onchange = function(){ if(W && W.__KD) W.__KD.box(this.checked); };

function showView(id, no){
  VIEW = D.views.filter(function(v){ return v.id===id; })[0];
  SELNO = no || null; OPEN = {}; if(no) OPEN[no] = true;
  $('vCode').textContent = VIEW.code+'　/　'+VIEW.id;
  $('vName').textContent = L(VIEW.screen);
  $('vState').textContent = t('state')+'：'+L(VIEW.state);
  renderNav(); renderSide(); applyView();
}

/* ---------------- side ---------------- */
function rowMatch(r){
  if(FILTER==='chk' && !(r.chk[0] || r.auto.length)) return false;
  if(FILTER==='inp' && ['text','textarea','select','check','radio','month','file','card'].indexOf(r.kindKey)<0) return false;
  if(!Q) return true;
  var s = [r.no, r.ja, r.vi, r.detail[0], r.detail[1], r.valid[0], r.len].join(' ').toLowerCase();
  return s.indexOf(Q.toLowerCase())>=0;
}
function itemHtml(r){
  var area = r.lvl===0 && ['area','modal','table'].indexOf(r.kindKey)>=0;
  var hasChk = r.chk[0] || r.auto.length;
  var tags = '<span class="tag">'+esc(L(r.kind))+'</span>'+
    (r.req==='○'?'<span class="tag req">'+t('must')+'</span>':'')+(r.req==='条件付き'?'<span class="tag cnd">'+t('cnd')+'</span>':'')+
    (hasChk?'<span class="tag chk">'+t('chkL')+'</span>':'')+(!r.found?'<span class="tag miss">'+t('miss')+'</span>':'');
  var rows = [];
  function add(k, v, cls){ if(v) rows.push('<dt>'+t(k)+'</dt><dd'+(cls?' class="'+cls+'"':'')+'>'+v+'</dd>'); }
  add('detail', esc(L(r.detail)));
  add('len', esc(L(r.len))); add('init', esc(L(r.init)));
  if(r.ex && r.ex[0]) add('ex', esc(LANG==='vi' ? r.ex.filter(Boolean).join(' → ') : r.ex[0])); add('cond', esc(L(r.cond)));
  add('trig', esc(L(r.trig))); add('valid', esc(L(r.valid)));
  if(r.err.length) add('err', r.err.map(function(e, i){ return '<span class="em" data-m="'+esc(r.errCodes[i])+'">'+esc(L(e))+'</span>'; }).join(''));
  var ck = [];
  if(r.chk[0]) ck.push(esc(L(r.chk)));
  r.auto.forEach(function(a){ ck.push('【'+(LANG==='vi'?'Tự động':'自動')+'】'+esc(L(a))); });
  add('chkL', ck.join('\n'), 'warn');
  add('demo', esc(L(r.demo)), 'demo');
  add('sel', '<span class="sel">'+esc(r.sel)+'</span>');
  return '<div class="it '+(r.lvl?'l1':'')+(SELNO===r.no?' on':'')+(OPEN[r.no]?' open':'')+'" data-no="'+esc(r.no)+'">'+
    '<div class="hd"><span class="bdg '+(area?'area':'leaf')+'">'+esc(r.no)+'</span><div style="min-width:0;flex:1">'+
    '<div class="nm">'+esc(LANG==='vi'?r.vi:r.ja)+'</div><div class="meta">'+tags+'</div>'+
    (L(r.detail)?'<div class="one">'+esc(L(r.detail))+'</div>':'')+'</div></div>'+
    '<div class="bd"><dl>'+rows.join('')+'</dl></div></div>';
}
function renderSide(){
  var sh = $('sh'), li = $('list');
  if(PANEL==='items'){
    var rows = VIEW.rows.filter(rowMatch);
    sh.innerHTML = '<div class="row"><h3>'+t('items')+'</h3><span class="cnt">'+rows.length+' / '+VIEW.rows.length+' '+t('count')+'</span></div>'+
      '<input id="q" placeholder="'+t('search')+'" value="'+esc(Q)+'">'+
      '<div class="chips">'+['all','chk','inp'].map(function(f){ return '<button data-f="'+f+'" class="'+(FILTER===f?'on':'')+'">'+t(f)+'</button>'; }).join('')+'</div>';
    li.innerHTML = (L(VIEW.note)?'<div class="note"><b>'+t('noteL')+'：</b>'+esc(L(VIEW.note))+'</div>':'')+rows.map(itemHtml).join('');
    var q = $('q'); q.oninput = function(){ Q = this.value; var p = this.selectionStart; renderSide(); var n=$('q'); n.focus(); n.setSelectionRange(p,p); };
    sh.querySelectorAll('[data-f]').forEach(function(b){ b.onclick = function(){ FILTER = b.dataset.f; renderSide(); }; });
  } else if(PANEL==='msgs'){
    sh.innerHTML = '<div class="row"><h3>'+t('msgs')+'</h3><span class="cnt">'+D.messages.length+' '+t('count')+'</span></div>';
    var used = {};
    D.views.forEach(function(v){ v.rows.forEach(function(r){ r.errCodes.forEach(function(c){ (used[c]=used[c]||[]).push([v.id, r.no]); }); }); });
    li.innerHTML = '<table class="t"><tr><th>ID</th><th>'+t('text')+'</th></tr>'+D.messages.map(function(m){
      return '<tr id="m_'+m.id+'" class="'+(m.id===window.__MSEL?'on':'')+'"><td><span class="mid">'+m.id+'</span><div style="color:var(--ink3);font-size:11px">'+esc(m.type)+'</div></td><td>'+
        '<div>'+esc(LANG==='vi'?m.vi:m.ja)+'</div><div style="color:var(--ink3);font-size:11px;margin-top:2px">'+t('where')+'：'+esc(m.where)+'　'+t('ml')+'：'+esc(m.ml||'—')+(m.mlState?'（'+esc(m.mlState)+'）':'')+'</div>'+
        ((used[m.id]||[]).length?'<div style="font-size:11px;margin-top:2px">'+t('used')+'：'+used[m.id].map(function(u){ return '<a href="#" data-go="'+u[0]+'|'+u[1]+'">'+u[0]+' No.'+u[1]+'</a>'; }).join('、')+'</div>':'')+
        (m.diff?'<div class="diff">'+esc(m.diff)+'</div>':'')+'</td></tr>';
    }).join('')+'</table>';
    if(window.__MSEL){ var x = $('m_'+window.__MSEL); if(x) x.scrollIntoView({block:'center'}); }
  } else if(PANEL==='mails'){
    sh.innerHTML = '<div class="row"><h3>'+t('mails')+'</h3></div>';
    li.innerHTML = '<table class="t"><tr><th>ID</th><th>'+t('content')+'</th></tr>'+D.mails.map(function(m){
      return '<tr><td><span class="mid">'+m.id+'</span></td><td>'+esc(LANG==='vi'?m.vi:m.ja)+'<div style="color:var(--ink3);font-size:11px">'+t('to')+'：'+esc(m.to)+'</div></td></tr>'; }).join('')+'</table>'+
      '<div class="note" style="margin-top:10px">'+(LANG==='vi'?'Nội dung chính thức: Message List (Excel) sheet Email.':'文面の正は Message List（Excel）の「メール」シート。送る条件は メール一覧_申込・申請。')+'</div>';
  } else if(PANEL==='issues'){
    sh.innerHTML = '<div class="row"><h3>'+t('issues')+'</h3><span class="cnt">'+D.issues.length+' '+t('count')+'</span></div>';
    li.innerHTML = '<table class="t"><tr><th>'+t('view')+'</th><th>'+t('content')+'</th></tr>'+D.issues.map(function(x){
      return '<tr class="'+(x.view?'go':'')+'" data-go="'+(x.view?x.view+'|'+x.no:'')+'"><td style="white-space:nowrap"><span class="mid" style="color:var(--blue)">'+esc(x.view||x.code)+'</span><div style="font-size:11px">No.'+esc(x.no)+'</div></td>'+
        '<td><b>'+esc(LANG==='vi'&&x.vi?x.vi:x.ja)+'</b><div>'+esc(L(x.text))+'</div><div style="color:var(--ink3);font-size:11px">'+esc(x.src)+'</div></td></tr>'; }).join('')+'</table>';
  } else if(PANEL==='sheets'){
    sh.innerHTML = '<div class="row"><h3>'+t('sheets')+'</h3></div>';
    li.innerHTML = (D.sheets||[]).map(function(s){
      return '<h3 style="margin:6px 0">'+esc(L(s.name))+'</h3>'+(s.note?'<div class="note">'+esc(L(s.note))+'</div>':'')+(s.tables||[]).map(function(tb){
        return '<h4 style="margin:10px 0 4px">'+esc(L(tb.title))+'</h4>'+(tb.note&&L(tb.note)?'<div class="note">'+esc(L(tb.note))+'</div>':'')+'<div style="overflow:auto"><table class="t" style="font-size:11px;white-space:nowrap"><tr>'+tb.head.map(function(h){ return '<th>'+esc(L(h[0]))+'</th>'; }).join('')+'</tr>'+
          tb.rows.map(function(r){ return '<tr>'+r.map(function(x){ return '<td style="max-width:360px;white-space:normal">'+esc(Array.isArray(x)?L(x):String(x==null?'':x))+'</td>'; }).join('')+'</tr>'; }).join('')+'</table></div>'; }).join('');
    }).join('');
  } else if(PANEL==='about'){
    sh.innerHTML = '<div class="row"><h3>'+t('about')+'</h3></div>';
    li.innerHTML = '<div class="about note" style="background:#fff;border:1px solid var(--line)">'+(LANG==='vi'
      ? '<p><b>Cách dùng</b>: Nhấn số trên màn hình demo để xem định nghĩa; nhấn thẻ bên phải để làm sáng vị trí trên màn hình. Demo vẫn thao tác được.</p><p><b>Nguồn dữ liệu</b>: 05_基本設計/データ/'+esc(D.dataFile)+' là bản chính. HTML và Excel được tạo tự động từ cùng dữ liệu.</p><p><b>Demo</b>: '+esc(D.demo)+'</p>'
      : '<p><b>使い方</b>：デモ画面の番号を押すと右に定義が出ます。右の項目を押すと画面の場所が光ります。デモはそのまま操作できます（操作すると番号の位置も追いかけます）。</p>'+
        '<p><b>元データ</b>：05_基本設計/データ/'+esc(D.dataFile)+' が正です。この HTML と Excel は同じデータから自動で作っています。直すときはデータを直して作り直します。</p>'+
        '<p><b>「自動」の要確認</b>：作るときにデモの入力欄（項目名・必須の表示・選択肢・最大文字数）を読み取り、仕様と違うところを自動で挙げています。</p>'+
        '<p><b>共通の決まり</b>：基本設計_全体の定義_提案_20261001（メッセージの出し方 §1、入力 §10-1、法人Web の権限 §10-7）。</p>'+
        '<p><b>元にしたデモ</b>：'+esc(D.demo)+'　<b>作成</b>：'+esc(D.created)+'　'+esc(D.author)+'</p>')+'</div>';
  }
}
$('list').addEventListener('click', function(e){
  var go = e.target.closest('[data-go]');
  if(go && go.dataset.go){ e.preventDefault(); var p = go.dataset.go.split('|'); PANEL='items'; FILTER='all'; Q=''; showView(p[0], p[1]); setTimeout(function(){ scrollCard(p[1]); }, 60); return; }
  var em = e.target.closest('.em');
  if(em){ window.__MSEL = em.dataset.m; PANEL = D.messages.some(function(m){ return m.id===em.dataset.m; }) ? 'msgs' : 'mails'; renderNav(); renderSide(); return; }
  var hd = e.target.closest('.hd');
  if(hd){ var no = hd.parentNode.dataset.no; OPEN[no] = !(OPEN[no] && SELNO===no) ; pick(no, true, false); }
});
function scrollCard(no){ var c = document.querySelector('.it[data-no="'+no+'"]'); if(c) c.scrollIntoView({block:'center', behavior:'smooth'}); }
function pick(no, scrollFrame, scrollList){
  SELNO = no; if(scrollList) OPEN[no] = true;
  if(PANEL!=='items'){ PANEL='items'; renderNav(); }
  if(FILTER!=='all' || Q){ var r = VIEW.rows.filter(function(x){ return x.no===no; })[0]; if(r && !rowMatch(r)){ FILTER='all'; Q=''; } }
  renderSide();
  if(W && W.__KD) W.__KD.select(no, scrollFrame);
  if(scrollList) scrollCard(no);
}
$('lang').addEventListener('click', function(e){
  var b = e.target.closest('button'); if(!b) return; LANG = b.dataset.l;
  document.querySelectorAll('#lang button').forEach(function(x){ x.classList.toggle('on', x===b); });
  document.querySelectorAll('[data-t]').forEach(function(x){ x.textContent = t(x.dataset.t); });
  $('zoom').textContent = ZOOMFIT ? t('zoomFit') : t('zoom100');
  document.documentElement.lang = LANG;
  head(); renderNav(); renderSide(); if(VIEW){ $('vName').textContent = L(VIEW.screen); $('vState').textContent = t('state')+'：'+L(VIEW.state); }
});
function head(){
  $('ttl').textContent = LANG==='vi' ? 'Thiết kế màn hình' : '画面設計書';
  $('sub').textContent = L([D.system.ja, D.system.vi])+'　｜　'+(LANG==='vi'?(D.titleVi||D.title):D.title)+'　｜　'+D.created;
}
document.title = '画面設計書 '+D.title; head();
/* #001-4|14.12 のように開くと、その状態・項目から始める（メッセージ一覧からのリンク） */
var H = decodeURIComponent((location.hash||'').slice(1)).split('|'), HV = D.views.filter(function(v){ return v.id===H[0]; })[0];
VIEW = HV || D.views[0]; showView(VIEW.id, HV ? H[1] : null); boot();
})();
</script>
