<!DOCTYPE html>
<!-- ============================================================= -->
<!-- 画面名: OW_STAF_003 - 配送スタッフを追加する (基本情報 / 担当者)  -->
<!-- 入力画像: OW_STAF_003.png                                     -->
<!-- ============================================================= -->
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OW_STAF_003 - 配送スタッフを追加する</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  :root{
    --green:#84cc16;--green-dark:#65a30d;--bg:#f3f4f6;--card:#fff;--line:#e5e7eb;
    --text:#1f2937;--muted2:#6b7280;--orange:#f59e0b;--link:#2563eb;--req:#ef4444;--sidebar-w:226px;--header-h:64px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",-apple-system,sans-serif;color:var(--text);background:var(--bg);font-size:14px;line-height:1.6}
  .app{display:flex;min-height:100vh}
  .sidebar{width:var(--sidebar-w);background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;flex-shrink:0}
  .logo{display:flex;align-items:center;gap:8px;padding:16px 18px;height:var(--header-h)}
  .logo .sun{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 50% 40%,#fbbf24,#f97316);display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;box-shadow:0 0 0 3px #fff7ed}
  .logo .name{font-weight:800;font-size:19px}
  .logo .name .es{color:#ef4444}.logo .name .st{color:#1e293b}
  .nav{padding:14px;display:flex;flex-direction:column;gap:6px}
  .nav a{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:10px;color:#374151;text-decoration:none;font-weight:600;font-size:15px}
  .nav a i{width:20px;text-align:center;font-size:16px;color:#6b7280}
  .nav a:hover{background:#f9fafb}
  .nav a.active{background:var(--green);color:#fff;box-shadow:0 2px 6px rgba(132,204,22,.4)}
  .nav a.active i{color:#fff}
  .mascot{margin-top:auto;padding:18px;display:flex;justify-content:center}
  .mascot .m-illu{width:120px;height:150px;border-radius:12px;background:radial-gradient(circle at 50% 30%,#fde68a,#fbbf24 70%,#f59e0b);display:flex;align-items:flex-end;justify-content:center;font-size:64px}
  .collapse{padding:10px 18px;color:#9ca3af;font-size:18px;cursor:pointer}
  .main{flex:1;display:flex;flex-direction:column;min-width:0}
  .topbar{height:var(--header-h);background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px}
  .topbar .welcome{display:flex;align-items:center;gap:10px;color:#374151;font-weight:600}
  .topbar .welcome .sun{color:var(--orange);font-size:20px}
  .topbar .user{display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:600}
  .topbar .user .avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#fcd34d,#f59e0b);display:flex;align-items:center;justify-content:center;font-size:20px;border:2px solid #fde68a}
  .topbar .user .fa-chevron-down{color:#9ca3af;font-size:12px}
  .content{padding:22px 26px;flex:1}
  .crumb{color:var(--muted2);font-size:12px;margin-bottom:2px}
  .head-row{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:18px}
  .page-title{font-size:22px;font-weight:700}
  .head-actions{display:flex;gap:10px}
  .btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 22px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;color:#374151}
  .btn:hover{background:#f9fafb}
  .btn-green{background:var(--green);border-color:var(--green);color:#fff;box-shadow:0 2px 5px rgba(132,204,22,.4)}
  .btn-green:hover{background:var(--green-dark)}
  .btn-outline{border:1px solid var(--green-dark);color:var(--green-dark);background:#fff;padding:8px 16px;font-size:13px}
  .btn-outline:hover{background:#f7fee7}
  .section{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:16px;overflow:hidden}
  .sec-head{display:flex;align-items:center;justify-content:space-between;background:#f8fafc;border-left:4px solid var(--green);padding:13px 18px;font-weight:700}
  .sec-head .left{display:flex;align-items:center;gap:9px}
  .sec-head .left i{color:#9ca3af}
  .sec-head .chev{color:#9ca3af;font-size:13px}
  .sec-body{padding:18px 20px}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px 20px}
  .field{display:flex;flex-direction:column;gap:6px}
  .field label{font-size:13px;color:#374151;font-weight:600}
  .field label .req{color:var(--req);margin-left:3px}
  .field input,.field select{height:40px;border:1px solid var(--line);border-radius:8px;padding:0 12px;font-size:14px;font-family:inherit;color:#374151;background:#fff}
  .field input::placeholder{color:#9ca3af}
  .field input[readonly]{background:#f3f4f6}
  .field select{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%239ca3af' stroke-width='3'><polyline points='6 9 12 15 18 9'/></svg>");background-repeat:no-repeat;background-position:right 12px center;padding-right:34px}
  .lnk{color:var(--link);text-decoration:none;align-self:flex-start;padding-top:10px}.lnk:hover{text-decoration:underline}
  .static-val{padding-top:10px;color:#374151}
  /* license upload */
  .license-row{display:flex;gap:14px;align-items:stretch}
  .license-thumb{width:160px;height:104px;border-radius:8px;border:2px solid var(--green);background:#1f2937;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#cbd5e1;font-size:34px}
  .license-thumb .acts{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:14px;background:rgba(0,0,0,.25);color:#fff;font-size:15px;opacity:0;transition:.15s}
  .license-thumb:hover .acts{opacity:1}
  .add-photo{width:96px;border:1.5px dashed #cbd5e1;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:#60a5fa;cursor:pointer;font-size:12px}
  .add-photo i{font-size:22px}
  .add-photo:hover{background:#f8fafc}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="logo">
      <span class="sun"><i class="fa-solid fa-sun"></i></span>
      <span class="name"><span class="es">ES</span><span class="st">STATION</span></span>
    </div>
    <nav class="nav">
      <a href="#" class="active"><i class="fa-regular fa-window-maximize"></i> TOP</a>
      <a href="#"><i class="fa-solid fa-truck"></i> 配送状況</a>
      <a href="#"><i class="fa-regular fa-rectangle-list"></i> 集金額</a>
      <a href="#"><i class="fa-solid fa-user-group"></i> スタッフ</a>
    </nav>
    <div class="mascot"><div class="m-illu">🧑‍🍳</div></div>
    <div class="collapse"><i class="fa-solid fa-bars-staggered"></i></div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="welcome"><i class="fa-solid fa-sun sun"></i><span>お帰りなさい</span></div>
      <div class="user"><span class="avatar">🦁</span><span>にっしぐち</span><i class="fa-solid fa-chevron-down"></i></div>
    </header>

    <main class="content">
      <div class="head-row">
        <div>
          <div class="crumb">配送スタッフ管理</div>
          <h1 class="page-title">配送スタッフを追加する</h1>
        </div>
        <div class="head-actions">
          <button class="btn">キャンセル</button>
          <button class="btn btn-green">保存</button>
        </div>
      </div>

      <!-- 基本情報 -->
      <section class="section">
        <div class="sec-head"><span class="left"><i class="fa-solid fa-circle-info"></i>基本情報</span><i class="fa-solid fa-chevron-up chev"></i></div>
        <div class="sec-body">
          <div class="grid">
            <div class="field"><label>ID</label><input value="DR00001" readonly></div>
            <div class="field"><label>配送スタッフ名<span class="req">*</span></label><input placeholder="山岡 美幸"></div>
            <div class="field"><label>カナ<span class="req">*</span></label><input placeholder="ヤマオカ ミユキ"></div>
            <div class="field"><label>委託配送先名</label><a href="#" class="lnk">株式会社 三輝</a></div>
            <div class="field"><label>ステータス</label><div class="static-val">本登録</div></div>
            <div class="field"><label>電話番号<span class="req">*</span></label><input value="050-1245-1245"></div>
          </div>
          <div class="field" style="margin-top:18px">
            <label>免許証</label>
            <div class="license-row">
              <div class="license-thumb">
                <i class="fa-regular fa-id-card"></i>
                <div class="acts"><i class="fa-regular fa-eye"></i><i class="fa-solid fa-pen"></i></div>
              </div>
              <div class="add-photo"><i class="fa-solid fa-plus"></i><span>写真を追加</span></div>
            </div>
          </div>
        </div>
      </section>

      <!-- 担当者 -->
      <section class="section">
        <div class="sec-head"><span class="left"><i class="fa-solid fa-user"></i>担当者</span><i class="fa-solid fa-chevron-up chev"></i></div>
        <div class="sec-body">
          <div class="grid">
            <div class="field"><label>メールアドレス</label><input value="sample@email.com"></div>
            <div class="field"><label>ステータス</label><select><option>有効</option><option>無効</option></select></div>
            <div class="field"><label>最終ログイン日時</label><input value="2026年6月1日 11:00:00" readonly></div>
          </div>
          <button class="btn btn-outline" style="margin-top:18px">パスワード送信</button>
        </div>
      </section>
    </main>
  </div>
</div>
</body>
</html>
