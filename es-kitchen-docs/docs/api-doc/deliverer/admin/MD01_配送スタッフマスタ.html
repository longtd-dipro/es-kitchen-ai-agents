<!--
============================================================
SCREEN NAME: MD01-Admin / 配送関連 / 配送スタッフ マスタ (Delivery staff master - list)
SOURCE: design/deliverer/admin/MD01-Admin/配送関連/配送スタッフ マスタ-Delivery staff.png
- Admin shell (sidebar 240px, primary #0066DD, Noto Sans JP, gold mascot)
- マスタ管理 group expanded → 配送関連 → 配送スタッフ active
- Filter bar + sortable list + status pill 本登録 + delete action + pagination
============================================================
-->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>配送スタッフ マスタ - ES STATION</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+JP:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script>
  tailwind.config={theme:{extend:{
    fontFamily:{sans:['Inter','Noto Sans JP','-apple-system','Segoe UI','sans-serif']},
    colors:{primary:{50:'#E6F0FA',100:'#CCE0F5',500:'#0066DD',600:'#005BB5',700:'#004C99'},
            accent:{500:'#FF9900',600:'#E08800'}}
  }}}
</script>
<style type="text/tailwindcss">
  @layer components{
    .nav-link{@apply flex items-center gap-3 px-4 py-2.5 rounded-lg cursor-pointer transition-all;}
    .nav-link--idle{@apply text-gray-600 hover:bg-gray-100;}
    .nav-link--active{@apply bg-primary-500 text-white;}
    .nav-sub{@apply flex items-center gap-3 pl-11 pr-4 py-2 rounded-lg cursor-pointer text-sm transition-all;}
    .nav-sub--idle{@apply text-gray-600 hover:bg-gray-100;}
    .nav-sub--active{@apply bg-primary-50 text-primary-600 font-semibold;}
    .nav-sub2{@apply flex items-center gap-3 pl-[60px] pr-4 py-1.5 rounded-lg cursor-pointer text-[13px] transition-all;}
    .col-head{@apply px-4 py-3 text-xs font-semibold text-gray-500;}
    .data-cell{@apply px-4 py-3 text-sm text-gray-800;}
    .filter-select{@apply w-full h-10 pl-3 pr-9 border border-gray-300 rounded-lg text-sm text-gray-700 bg-white appearance-none focus:outline-none focus:ring-2 focus:ring-primary-500;}
    .search-input{@apply w-full h-10 pl-3 pr-10 border border-gray-300 rounded-lg text-sm text-gray-700 bg-white focus:outline-none focus:ring-2 focus:ring-primary-500;}
  }
  .table-row-hover:hover{background:#F0F5FF;}
  .badge-formal{background:#E6F7FF;color:#0066DD;}
  .page-btn{min-width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:6px;font-size:14px;font-weight:500;}
  .page-btn:hover:not(.active){background:#EDF2F7;}
  .page-btn.active{background:#0066DD;color:#fff;}
</style>
</head>
<body class="font-sans bg-gray-50 antialiased">

<!-- ===== SIDEBAR ===== -->
<aside class="w-[240px] bg-white border-r border-gray-200 fixed h-full flex flex-col z-30">
  <div class="px-5 py-4 border-b border-gray-100 flex items-center gap-2.5">
    <div class="w-8 h-8 rounded-lg flex items-center justify-center flex-shrink-0" style="background:radial-gradient(circle at 50% 40%,#fbbf24,#f97316)"><i class="fas fa-sun text-white text-sm"></i></div>
    <span class="text-base font-extrabold tracking-wide"><span class="text-red-500">ES</span><span class="text-slate-800">STATION</span></span>
  </div>

  <nav class="flex-1 px-3 py-3 overflow-y-auto text-sm">
    <div class="nav-link nav-link--idle"><i class="fas fa-gauge-high w-5 text-center text-gray-400"></i>ダッシュボード</div>
    <div class="nav-link nav-link--idle justify-between"><span class="flex items-center gap-3"><i class="fas fa-bars w-5 text-center text-gray-400"></i>メニュー管理</span><i class="fas fa-chevron-down text-[10px] text-gray-400"></i></div>

    <!-- マスタ管理 (expanded) -->
    <div class="nav-link nav-link--active justify-between mt-0.5"><span class="flex items-center gap-3"><i class="fas fa-folder w-5 text-center"></i>マスタ管理</span><i class="fas fa-chevron-up text-[10px]"></i></div>
    <div class="mt-0.5 space-y-0.5">
      <div class="nav-sub nav-sub--idle">プランマスタ</div>
      <div class="nav-sub nav-sub--idle">惣菜マスタ</div>
      <div class="nav-sub nav-sub--idle">資材マスタ</div>
      <!-- 配送関連 (expanded) -->
      <div class="nav-sub nav-sub--idle justify-between font-medium text-gray-700"><span>配送関連</span><i class="fas fa-chevron-up text-[10px] text-gray-400"></i></div>
      <div class="nav-sub2 nav-link--idle text-gray-600">委託配送先</div>
      <div class="nav-sub2 nav-link--idle text-gray-600">中継先</div>
      <div class="nav-sub2 nav-link--idle text-gray-600">中継先</div>
      <div class="nav-sub2 bg-primary-50 text-primary-600 font-semibold">配送スタッフ</div>
      <div class="nav-sub nav-sub--idle">仕入先</div>
      <div class="nav-sub nav-sub--idle">代理店・パートナー管理</div>
      <div class="nav-sub nav-sub--idle justify-between"><span>機種マスタ</span><i class="fas fa-chevron-down text-[10px] text-gray-400"></i></div>
    </div>

    <div class="nav-link nav-link--idle mt-1"><i class="fas fa-building w-5 text-center text-gray-400"></i>法人・契約管理</div>
    <div class="nav-link nav-link--idle justify-between"><span class="flex items-center gap-3"><i class="fas fa-user-gear w-5 text-center text-gray-400"></i>アカウント管理</span><i class="fas fa-chevron-down text-[10px] text-gray-400"></i></div>
    <div class="nav-link nav-link--idle"><i class="fas fa-yen-sign w-5 text-center text-gray-400"></i>売上管理</div>
    <div class="nav-link nav-link--idle justify-between"><span class="flex items-center gap-3"><i class="fas fa-truck w-5 text-center text-gray-400"></i>配送管理</span><i class="fas fa-chevron-down text-[10px] text-gray-400"></i></div>
  </nav>

  <div class="px-4 pb-4">
    <div class="rounded-xl p-3 flex justify-center" style="background:linear-gradient(180deg,#fff,#fff9f0)">
      <div class="w-20 h-24 rounded-lg flex items-end justify-center text-5xl" style="background:radial-gradient(circle at 50% 30%,#fde68a,#fbbf24 70%,#f59e0b)">🧑‍🍳</div>
    </div>
  </div>
</aside>

<!-- ===== MAIN ===== -->
<main class="ml-[240px] min-h-screen">
  <header class="bg-white border-b border-gray-200 px-8 py-3.5 flex items-center justify-between">
    <div class="flex items-center gap-2 text-gray-800"><i class="fas fa-sun text-yellow-400 text-lg"></i><span class="font-semibold">お帰りなさい</span></div>
    <div class="flex items-center gap-3 cursor-pointer">
      <div class="w-9 h-9 rounded-full flex items-center justify-center text-lg border-2 border-amber-200" style="background:linear-gradient(135deg,#fcd34d,#f59e0b)">🦁</div>
      <span class="font-semibold text-gray-800">にっしぐち</span><i class="fas fa-chevron-down text-xs text-gray-400"></i>
    </div>
  </header>

  <div class="p-8">
    <p class="text-xs text-gray-500 mb-1">マスタ管理 ／ 配送関連 ／ 配送スタッフ</p>
    <h1 class="text-2xl font-bold text-gray-800 mb-6">配送スタッフ</h1>

    <!-- Filter -->
    <div class="bg-white rounded-xl border border-gray-100 shadow-sm p-5 mb-6">
      <div class="flex flex-wrap items-end gap-4">
        <div class="flex flex-col gap-1.5 min-w-[260px] flex-1">
          <label class="text-xs font-medium text-gray-500">委託配送先名、配送スタッフ名</label>
          <div class="relative"><input class="search-input" placeholder="委託配送先名、配送スタッフ名">
            <i class="fas fa-search text-sm text-gray-400 absolute right-3 top-1/2 -translate-y-1/2"></i></div>
        </div>
        <div class="flex flex-col gap-1.5 min-w-[160px]"><label class="text-xs font-medium text-gray-500">スタッフ区分</label>
          <select class="filter-select"><option>全て</option><option>個人</option><option>法人</option></select></div>
        <div class="flex flex-col gap-1.5 min-w-[160px]"><label class="text-xs font-medium text-gray-500">ステータス</label>
          <select class="filter-select"><option>全て</option><option>本登録</option><option>仮登録</option></select></div>
        <div class="flex items-center gap-3 ml-auto">
          <button class="px-6 py-2.5 border border-gray-300 text-gray-600 rounded-lg text-sm font-medium hover:bg-gray-50">クリア</button>
          <button class="px-6 py-2.5 bg-primary-500 text-white rounded-lg text-sm font-medium hover:brightness-90">検索</button>
        </div>
      </div>
      <div class="flex items-end gap-4 mt-4">
        <div class="flex flex-col gap-1.5 min-w-[200px]"><label class="text-xs font-medium text-gray-500">並び替え</label>
          <select class="filter-select"><option>配送スタッフ名（昇順）</option><option>配送スタッフ名（降順）</option></select></div>
      </div>
    </div>

    <!-- Table -->
    <div class="bg-white rounded-xl border border-gray-100 shadow-sm overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full min-w-[900px]">
          <thead><tr class="bg-gray-50 border-b border-gray-200 text-left">
            <th class="col-head w-12">No</th><th class="col-head">ID</th><th class="col-head">配送スタッフ名</th>
            <th class="col-head">委託配送先名</th><th class="col-head">区分</th><th class="col-head">電話番号</th>
            <th class="col-head text-center">ステータス</th><th class="col-head text-center">操作</th>
          </tr></thead>
          <tbody id="rows" class="divide-y divide-gray-200"></tbody>
        </table>
      </div>
      <div class="px-6 py-4 border-t border-gray-200 flex items-center justify-between">
        <div class="text-sm text-gray-600">全 <span class="font-semibold text-gray-800">100</span> 件</div>
        <div class="flex items-center gap-1">
          <button class="page-btn text-gray-400"><i class="fas fa-chevron-left text-xs"></i></button>
          <button class="page-btn text-gray-500">1</button><button class="page-btn text-gray-500">2</button>
          <button class="page-btn text-gray-500">3</button><button class="page-btn text-gray-500">4</button>
          <button class="page-btn text-gray-500">5</button><span class="px-1 text-gray-400">…</span>
          <button class="page-btn active">6</button><button class="page-btn text-gray-500">7</button>
          <span class="px-1 text-gray-400">…</span><button class="page-btn text-gray-500">10</button>
          <button class="page-btn text-gray-400"><i class="fas fa-chevron-right text-xs"></i></button>
        </div>
      </div>
    </div>
  </div>
</main>

<script>
  const rows=document.getElementById('rows');
  for(let i=1;i<=10;i++){
    rows.insertAdjacentHTML('beforeend',`
      <tr class="table-row-hover transition-colors">
        <td class="data-cell text-center text-gray-500">${i}</td>
        <td class="data-cell"><span class="text-primary-500 hover:underline cursor-pointer">DR0000${i}</span></td>
        <td class="data-cell">山岡 美幸</td>
        <td class="data-cell text-gray-600">株式会社 三輝</td>
        <td class="data-cell">個人</td>
        <td class="data-cell text-gray-600">050-1245-1245</td>
        <td class="data-cell text-center"><span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-medium badge-formal">本登録</span></td>
        <td class="data-cell text-center"><button class="text-red-500 hover:text-red-600" title="削除"><i class="far fa-trash-can"></i></button></td>
      </tr>`);
  }
</script>
</body>
</html>
