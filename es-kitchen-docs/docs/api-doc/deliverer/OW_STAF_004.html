<!DOCTYPE html>
<!-- ============================================================= -->
<!-- 画面名: OW_STAF_004 - 配送スタッフを追加する (配送スタッフ情報)   -->
<!-- 入力画像: OW_STAF_004.png                                     -->
<!-- ============================================================= -->
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OW_STAF_004 - 配送スタッフを追加する</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  :root{
    --green:#84cc16;--green-dark:#65a30d;--bg:#f3f4f6;--card:#fff;--line:#e5e7eb;
    --text:#1f2937;--muted2:#6b7280;--orange:#f59e0b;--req:#ef4444;--sidebar-w:226px;--header-h:64px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",-apple-system,sans-serif;color:var(--text);background:var(--bg);font-size:14px;line-height:1.6}
  .app{display:flex;min-height:100vh}
  .sidebar{width:var(--sidebar-w);background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;flex-shrink:0}
  .logo{display:flex;align-items:center;gap:8px;padding:16px 18px;height:var(--header-h)}
  .logo .sun{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 50% 40%,#fbbf24,#f97316);display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;box-shadow:0 0 0 3px #fff7ed}
  .logo .name{font-weight:800;font-size:19px}
  .logo .name .es{color:#ef4444}.logo .name .st{color:#1e293b}
  .nav{padding:14px;display:flex;flex-direction:column;gap:6px}
  .nav a{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:10px;color:#374151;text-decoration:none;font-weight:600;font-size:15px}
  .nav a i{width:20px;text-align:center;font-size:16px;color:#6b7280}
  .nav a:hover{background:#f9fafb}
  .nav a.active{background:var(--green);color:#fff;box-shadow:0 2px 6px rgba(132,204,22,.4)}
  .nav a.active i{color:#fff}
  .mascot{margin-top:auto;padding:18px;display:flex;justify-content:center}
  .mascot .m-illu{width:120px;height:150px;border-radius:12px;background:radial-gradient(circle at 50% 30%,#fde68a,#fbbf24 70%,#f59e0b);display:flex;align-items:flex-end;justify-content:center;font-size:64px}
  .collapse{padding:10px 18px;color:#9ca3af;font-size:18px;cursor:pointer}
  .main{flex:1;display:flex;flex-direction:column;min-width:0}
  .topbar{height:var(--header-h);background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px}
  .topbar .welcome{display:flex;align-items:center;gap:10px;color:#374151;font-weight:600}
  .topbar .welcome .sun{color:var(--orange);font-size:20px}
  .topbar .user{display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:600}
  .topbar .user .avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#fcd34d,#f59e0b);display:flex;align-items:center;justify-content:center;font-size:20px;border:2px solid #fde68a}
  .topbar .user .fa-chevron-down{color:#9ca3af;font-size:12px}
  .content{padding:22px 26px;flex:1}
  .crumb{color:var(--muted2);font-size:12px;margin-bottom:2px}
  .head-row{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:18px}
  .page-title{font-size:24px;font-weight:700}
  .head-actions{display:flex;gap:12px}
  .btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:11px 26px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;color:#374151}
  .btn:hover{background:#f9fafb}
  .btn-green{background:var(--green);border-color:var(--green);color:#fff;box-shadow:0 2px 6px rgba(132,204,22,.4)}
  .btn-green:hover{background:var(--green-dark)}
  .section{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .sec-head{display:flex;align-items:center;justify-content:space-between;background:#f8fafc;border-left:4px solid var(--green);padding:16px 22px;font-weight:700;font-size:17px}
  .sec-head .chev{color:#9ca3af;font-size:14px}
  .sec-body{padding:24px 26px 30px}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px 28px}
  .field{display:flex;flex-direction:column;gap:8px}
  .field label{font-size:15px;color:#374151;font-weight:600}
  .field label .req{color:var(--req);margin-left:4px}
  .field input,.field select{height:44px;border:1px solid var(--line);border-radius:8px;padding:0 14px;font-size:14px;font-family:inherit;color:#374151;background:#fff}
  .field input::placeholder{color:#cbd5e1}
  .field select{appearance:none;color:#9ca3af;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%239ca3af' stroke-width='3'><polyline points='6 9 12 15 18 9'/></svg>");background-repeat:no-repeat;background-position:right 14px center;padding-right:36px}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="logo">
      <span class="sun"><i class="fa-solid fa-sun"></i></span>
      <span class="name"><span class="es">ES</span><span class="st">STATION</span></span>
    </div>
    <nav class="nav">
      <a href="#"><i class="fa-regular fa-window-maximize"></i> TOP</a>
      <a href="#"><i class="fa-solid fa-truck"></i> 配送状況</a>
      <a href="#"><i class="fa-regular fa-rectangle-list"></i> 集金額</a>
      <a href="#" class="active"><i class="fa-solid fa-user-group"></i> スタッフ</a>
    </nav>
    <div class="mascot"><div class="m-illu">🧑‍🍳</div></div>
    <div class="collapse"><i class="fa-solid fa-bars-staggered"></i></div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="welcome"><i class="fa-solid fa-sun sun"></i><span>お帰りなさい</span></div>
      <div class="user"><span class="avatar">🦁</span><span>にっしぐち</span><i class="fa-solid fa-chevron-down"></i></div>
    </header>

    <main class="content">
      <div class="head-row">
        <div>
          <div class="crumb">配送スタッフ管理</div>
          <h1 class="page-title">配送スタッフを追加する</h1>
        </div>
        <div class="head-actions">
          <button class="btn">キャンセル</button>
          <button class="btn btn-green">アカウントを作成する</button>
        </div>
      </div>

      <section class="section">
        <div class="sec-head"><span>配送スタッフ情報</span><i class="fa-solid fa-chevron-up chev"></i></div>
        <div class="sec-body">
          <div class="grid">
            <div class="field"><label>ユーザID<span class="req">*</span></label><input placeholder="--"></div>
            <div class="field"><label>パスワード<span class="req">*</span></label><input placeholder="--"></div>
            <div class="field"><label>名前<span class="req">*</span></label><input placeholder="--"></div>

            <div class="field"><label>名前カナ<span class="req">*</span></label><input placeholder="--"></div>
            <div class="field"><label>区分</label><select><option>--</option></select></div>
            <div class="field"><label>携帯番号<span class="req">*</span></label><input placeholder="--"></div>

            <div class="field"><label>メールアドレス<span class="req">*</span></label><input placeholder="--"></div>
            <div class="field"><label>配送スタッフ地</label><select><option>--</option></select></div>
            <div class="field"><label>配送スタッフ場所</label><input placeholder="--"></div>

            <div class="field"><label>承認済<span class="req">*</span></label><select><option>--</option></select></div>
          </div>
        </div>
      </section>
    </main>
  </div>
</div>
</body>
</html>
