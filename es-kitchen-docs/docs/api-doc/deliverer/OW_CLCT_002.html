<!DOCTYPE html>
<!-- ============================================================= -->
<!-- 画面名: OW_CLCT_002 - 収集された金額のリスト (集計カード付き)      -->
<!-- 入力画像: OW_CLCT_002.png                                     -->
<!-- ============================================================= -->
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OW_CLCT_002 - 集金額一覧</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  :root{
    --green:#84cc16;--green-dark:#65a30d;--bg:#f3f4f6;--card:#fff;--line:#e5e7eb;
    --text:#1f2937;--muted2:#6b7280;--orange:#f59e0b;--link:#2563eb;--sidebar-w:226px;--header-h:64px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",-apple-system,sans-serif;color:var(--text);background:var(--bg);font-size:14px;line-height:1.6}
  .app{display:flex;min-height:100vh}
  .sidebar{width:var(--sidebar-w);background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;flex-shrink:0}
  .logo{display:flex;align-items:center;gap:8px;padding:16px 18px;height:var(--header-h)}
  .logo .sun{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 50% 40%,#fbbf24,#f97316);display:flex;align-items:center;justify-content:center;color:#fff;font-size:16px;box-shadow:0 0 0 3px #fff7ed}
  .logo .name{font-weight:800;font-size:19px}
  .logo .name .es{color:#ef4444}.logo .name .st{color:#1e293b}
  .nav{padding:14px;display:flex;flex-direction:column;gap:6px}
  .nav a{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:10px;color:#374151;text-decoration:none;font-weight:600;font-size:15px}
  .nav a i{width:20px;text-align:center;font-size:16px;color:#6b7280}
  .nav a:hover{background:#f9fafb}
  .nav a.active{background:var(--green);color:#fff;box-shadow:0 2px 6px rgba(132,204,22,.4)}
  .nav a.active i{color:#fff}
  .mascot{margin-top:auto;padding:18px;display:flex;justify-content:center}
  .mascot .m-illu{width:120px;height:150px;border-radius:12px;background:radial-gradient(circle at 50% 30%,#fde68a,#fbbf24 70%,#f59e0b);display:flex;align-items:flex-end;justify-content:center;font-size:64px}
  .collapse{padding:10px 18px;color:#9ca3af;font-size:18px;cursor:pointer}
  .main{flex:1;display:flex;flex-direction:column;min-width:0}
  .topbar{height:var(--header-h);background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px}
  .topbar .welcome{display:flex;align-items:center;gap:10px;color:#374151;font-weight:600}
  .topbar .welcome .sun{color:var(--orange);font-size:20px}
  .topbar .user{display:flex;align-items:center;gap:10px;cursor:pointer;font-weight:600}
  .topbar .user .avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#fcd34d,#f59e0b);display:flex;align-items:center;justify-content:center;font-size:20px;border:2px solid #fde68a}
  .topbar .user .fa-chevron-down{color:#9ca3af;font-size:12px}
  .content{padding:22px 26px;flex:1}
  .crumb{color:var(--muted2);font-size:12px;margin-bottom:2px}
  .head-row{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:18px}
  .page-title{font-size:22px;font-weight:700}
  .head-actions{display:flex;gap:10px}
  .btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 18px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;color:#374151}
  .btn:hover{background:#f9fafb}
  /* summary cards */
  .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:18px}
  .card{background:linear-gradient(180deg,#f0f7ff,#eef6ff);border:1px solid #dbeafe;border-radius:12px;padding:16px 20px;display:flex;align-items:center;gap:14px}
  .card .ic{width:42px;height:42px;border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;color:#3b82f6;box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .card .c-label{color:#6b7280;font-size:13px}
  .card .c-body{flex:1;display:flex;align-items:center;justify-content:space-between}
  .card .c-val{font-size:24px;font-weight:800;color:#1e3a8a}
  .card .c-val .unit{font-size:13px;font-weight:600;color:#6b7280;margin-left:3px}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px}
  table{width:100%;border-collapse:collapse}
  thead th{text-align:left;font-size:13px;color:#6b7280;font-weight:600;padding:12px 10px;border-bottom:1px solid var(--line)}
  tbody td{padding:14px 10px;border-bottom:1px solid #f1f5f9;font-size:14px;color:#374151}
  tbody tr:hover{background:#fafafa}
  .ta-right{text-align:right}.ta-center{text-align:center}
  .col-no{width:50px;color:#9ca3af}
  .op-btn{width:30px;height:30px;border-radius:7px;border:1px solid var(--line);background:#fff;color:#3b82f6;cursor:pointer}
  .op-btn:hover{background:#eff6ff}
  .pager{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:18px;font-size:13px;color:#6b7280;flex-wrap:wrap}
  .pager .total{margin-right:16px}
  .pg{min-width:30px;height:30px;border:1px solid var(--line);border-radius:6px;background:#fff;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;color:#374151;padding:0 6px}
  .pg:hover{background:#f9fafb}
  .pg.active{border-color:var(--green);color:var(--green-dark);font-weight:700}
  .pg.nav{color:#9ca3af}.pg.dots{border:none;background:none;cursor:default}
  .select{height:30px;border:1px solid var(--line);border-radius:6px;background:#fff;padding:0 10px;font-family:inherit;font-size:13px;margin-left:12px}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="logo">
      <span class="sun"><i class="fa-solid fa-sun"></i></span>
      <span class="name"><span class="es">ES</span><span class="st">STATION</span></span>
    </div>
    <nav class="nav">
      <a href="#"><i class="fa-regular fa-window-maximize"></i> TOP</a>
      <a href="#"><i class="fa-solid fa-truck"></i> 配送状況</a>
      <a href="#" class="active"><i class="fa-regular fa-rectangle-list"></i> 集金額</a>
      <a href="#"><i class="fa-solid fa-user-group"></i> スタッフ</a>
    </nav>
    <div class="mascot"><div class="m-illu">🧑‍🍳</div></div>
    <div class="collapse"><i class="fa-solid fa-bars-staggered"></i></div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div class="welcome"><i class="fa-solid fa-sun sun"></i><span>お帰りなさい</span></div>
      <div class="user"><span class="avatar">🦁</span><span>にっしぐち</span><i class="fa-solid fa-chevron-down"></i></div>
    </header>

    <main class="content">
      <div class="crumb">集金額一覧</div>
      <div class="head-row">
        <h1 class="page-title">収集された金額のリスト</h1>
        <div class="head-actions">
          <button class="btn">CSVダウンロード</button>
          <button class="btn">レポート</button>
        </div>
      </div>

      <!-- 集計カード -->
      <div class="cards">
        <div class="card">
          <span class="ic"><i class="fa-regular fa-calendar"></i></span>
          <div class="c-body"><span class="c-label">納品月</span><span class="c-val">2024/11</span></div>
        </div>
        <div class="card">
          <span class="ic"><i class="fa-regular fa-rectangle-list"></i></span>
          <div class="c-body"><span class="c-label">集金合計</span><span class="c-val">8,700<span class="unit">円</span></span></div>
        </div>
        <div class="card">
          <span class="ic"><i class="fa-solid fa-square-parking"></i></span>
          <div class="c-body"><span class="c-label">駐車場料金合計</span><span class="c-val">300<span class="unit">円</span></span></div>
        </div>
      </div>

      <section class="panel">
        <table>
          <thead>
            <tr>
              <th class="col-no">No</th>
              <th>納品先</th>
              <th>配送スタッフ名</th>
              <th>納品日</th>
              <th class="ta-right">集金合計</th>
              <th class="ta-right">駐車場料金</th>
              <th class="ta-center">操作</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>

        <div class="pager">
          <span class="total">100件中 1-10件</span>
          <span class="pg">1</span>
          <span class="pg dots">···</span>
          <span class="pg">4</span>
          <span class="pg">5</span>
          <span class="pg active">6</span>
          <span class="pg">7</span>
          <span class="pg">8</span>
          <span class="pg dots">···</span>
          <span class="pg">50</span>
          <select class="select"><option>10件/ページ</option></select>
        </div>
      </section>
    </main>
  </div>
</div>

<script>
  const rows=document.getElementById('rows');
  for(let i=1;i<=8;i++){
    rows.insertAdjacentHTML('beforeend',`
      <tr>
        <td class="col-no">${i}</td>
        <td>請器美前頗市頭園町</td>
        <td>テスト一号</td>
        <td>11/15</td>
        <td class="ta-right">4,100</td>
        <td class="ta-right">0</td>
        <td class="ta-center"><button class="op-btn"><i class="fa-regular fa-pen-to-square"></i></button></td>
      </tr>`);
  }
</script>
</body>
</html>
