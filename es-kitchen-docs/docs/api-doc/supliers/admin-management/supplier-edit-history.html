    padding: 0 18px;
    font-size: 14px;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;

    color: #ffffff;

  .sub-tab.active {
    color: var(--color-primary);
    border-bottom-color: var(--color-primary);
    font-weight: 600;

  .history-card {
    background: var(--bg-white);
    border-radius: 8px;
    box-shadow: var(--shadow-sm);
    overflow: hidden;
  }
  .table-responsive { overflow-x: auto; }
  .history-table {
    width: 100%;
    border-collapse: collapse;

  .history-table thead th {
    background: #F8F9FA;
    color: #6B7280;
    font-size: 13px;
    font-weight: 600;
    text-align: left;
    padding: 14px 20px;
    white-space: nowrap;
  }
  .history-table tbody td {
    padding: 14px 20px;
    font-size: 14px;
    color: #333333;
    border-bottom: 1px solid #EFEFEF;
    vertical-align: middle;
  }

  .history-table tbody tr:last-child td { border-bottom: none; }
