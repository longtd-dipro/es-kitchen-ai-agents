<!DOCTYPE html>
<!-- アカウント発行にエラーが発生しました -->
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>アカウント発行にエラーが発生しました</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Hiragino Sans", Meiryo, sans-serif;
    background: #F8F9FA;
    color: #333333;
    margin: 0;
    min-height: 100vh;
  }

  .demo-bg {
    padding: 40px;
    color: #9CA3AF;
    font-size: 14px;
  }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
  }

  .modal {
    background: #ffffff;
    border-radius: 8px;
    width: 420px;
    max-width: calc(100vw - 32px);
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
    display: flex;
    flex-direction: column;
  }

  .modal-header {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding: 16px 16px 0 16px;
  }

  .modal-close {
    width: 32px;
    height: 32px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 4px;
    color: #6B7280;
    cursor: pointer;
    transition: background 0.2s;
    background: transparent;
    border: none;
  }
  .modal-close:hover { background: #F3F4F6; }

  .modal-body {
    padding: 12px 24px 24px 24px;
    text-align: center;
  }

  .modal-footer {
    padding: 0 24px 24px 24px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .error-icon {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: #FEE2E2;
    color: #DC2626;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    margin-bottom: 16px;
  }

  .error-title {
    font-size: 18px;
    font-weight: 700;
    color: #111827;
    margin-bottom: 10px;
  }

  .error-desc {
    font-size: 14px;
    color: #4B5563;
    line-height: 1.7;
  }

  .btn {
    height: 38px;
    border-radius: 4px;
    padding: 0 18px;
    font-size: 14px;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
    border: 1px solid transparent;
  }
  .btn-primary {
    background: #0062CC;
    color: #ffffff;
    border-color: #0062CC;
  }
  .btn-primary:hover { background: #004C9F; border-color: #004C9F; }
  .btn-outline {
    background: #ffffff;
    color: #0062CC;
    border-color: #0062CC;
  }
  .btn-outline:hover { background: #E6F0FA; }
</style>
</head>
<body>

<div class="demo-bg">
  <div>Background page (dummy)</div>
</div>

<div class="modal-overlay" id="errorModal">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="errorTitle">
    <div class="modal-header">
      <button class="modal-close" aria-label="Close" onclick="closeModal('errorModal')">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>

    <div class="modal-body">
      <div class="error-icon">
        <i class="fa-solid fa-exclamation"></i>
      </div>
      <div class="error-title" id="errorTitle">アカウント発行にエラーが発生しました。</div>
      <div class="error-desc">
        失敗：<span id="failedCount">0</span>件<br />
        <span style="font-size: 13px; color: #6B7280;">
          ※失敗した対象には送信されていません。内容をご確認のうえ、再度実行してください。
        </span>
      </div>
    </div>

    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('errorModal')">完了</button>
      <button class="btn btn-primary" onclick="closeModal('errorModal')">再度実行</button>
    </div>
  </div>
</div>

<script>
  function closeModal(id) {
    const el = document.getElementById(id);
    if (!el) return;
    el.style.display = 'none';
  }

  document.getElementById('errorModal').addEventListener('click', function (e) {
    if (e.target === this) {
      closeModal('errorModal');
    }
  });

  // Example dynamic binding
  // setFailedCount(3);
  function setFailedCount(count) {
    const el = document.getElementById('failedCount');
    if (el) el.textContent = count;
  }
</script>

</body>
</html>
