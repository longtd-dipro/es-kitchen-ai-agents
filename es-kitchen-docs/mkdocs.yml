validation:
  links:
    not_found: info
    unrecognized_links: info
    anchors: info
    absolute_links: warn

plugins:
  - search

markdown_extensions:
  - nl2br
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - admonition
  - tables
