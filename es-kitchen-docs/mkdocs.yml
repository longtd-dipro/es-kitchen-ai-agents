- Quality:
  - Phase 1 Quality: quality/phase1_quality.md

plugins:
  - search

markdown_extensions:
  - nl2br
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - admonition
  - tables
