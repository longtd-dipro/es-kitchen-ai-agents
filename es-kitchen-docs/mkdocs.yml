site_name: ESKITCHEN Documentation
theme:
  name: material
  palette:
    primary: deep orange
    accent: orange
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.expand
    - search.suggest
    - search.highlight
    - content.code.copy

nav:
- Home: index.md

- Backend:
  - Es Kitchen API:
    - Overview:
      - Structure: backend/es-kitchen-api/overview/structure.md
      - ERD: backend/es-kitchen-api/overview/erd.md
      - API Catalog: backend/es-kitchen-api/overview/api-catalog.md
      - Patterns: backend/es-kitchen-api/overview/patterns.md

- Frontend:
  - Es Kitchen Web Admin (E03):
    - Overview:
      - Structure: frontend/es-kitchen-web-admin/overview/structure.md
      - Patterns: frontend/es-kitchen-web-admin/overview/patterns.md
  - Es Kitchen Web Company (E02):
    - Overview:
      - Structure: frontend/es-kitchen-web-company/overview/structure.md
      - Patterns: frontend/es-kitchen-web-company/overview/patterns.md
  - Es Kitchen Web Supplier (E04):
    - Overview:
      - Structure: frontend/es-kitchen-web-supplier/overview/structure.md
      - Patterns: frontend/es-kitchen-web-supplier/overview/patterns.md
  - Es Kitchen Web Outsource Private (E05):
    - Overview:
      - Structure: frontend/es-kitchen-web-outsource-web-private/overview/structure.md
      - Patterns: frontend/es-kitchen-web-outsource-web-private/overview/patterns.md
  - Es Kitchen Webapp Driver (E06):
    - Overview:
      - Structure: frontend/es-kitchen-webapp-driver/overview/structure.md
      - Patterns: frontend/es-kitchen-webapp-driver/overview/patterns.md
  - Es Kitchen Webapp Payment (E07):
    - Overview:
      - Structure: frontend/es-kitchen-webapp-payment/overview/structure.md
      - Patterns: frontend/es-kitchen-webapp-payment/overview/patterns.md

- Mobile:
  - Es Kitchen Payment App (E01):
    - Overview:
      - Structure: mobile/es-kitchen-payment-app/overview/structure.md
      - Patterns: mobile/es-kitchen-payment-app/overview/patterns.md

- ES-STATION: requirements/es-station/index.md

- Quality:
  - Phase 1 Quality: quality/phase1_quality.md

- Migration Data:
  - Overview: migration/index.md
  - Hợp đồng ⭐:
    - Contract & Plans: migration/contract/index.md
  - Khách hàng & User: migration/company/index.md
  - Kho & Item Master: migration/warehouse/index.md
  - Supplier & Đặt hàng: migration/supplier/index.md
  - Đơn Order: migration/order/index.md
  - Giao hàng: migration/delivery/index.md
  - Hao hụt & Thông tin: migration/loss/index.md
  - Ghi chú kỹ thuật: migration/reference.md

validation:
  links:
    not_found: info
    unrecognized_links: info
    anchors: info
    absolute_links: warn

plugins:
  - search

markdown_extensions:
  - nl2br
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - admonition
  - tables
